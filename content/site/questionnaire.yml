        - title: Contact preferences
          body: Name, email, mobile number, preferred contact method, and language
        - title: About you
          body: City, state, marital status, and the people who depend on you
        - title: Your family
          body: Children, dependents, guardians, and important relationships
        - title: Planning needs
          body: What prompted planning and which services you want to discuss
        - title: Current documents
          body: Existing documents and possible decision-makers
        - title: Questions
          body: Timing, priorities, and context for the consultation
      cta: Ready to start the conversation?
