  source: View Estate Planning FAQs
  value: Ver preguntas frecuentes sobre planificación patrimonial
faq.items.0.question:
  source: Do I need an estate plan if I am not wealthy?
  value: ¿Necesito un plan patrimonial si no tengo grandes bienes?
faq.items.0.answer:
  source: Estate planning is not only about wealth. It can help you name decision-makers, document your wishes, prepare for incapacity, and make important matters clearer for the people you love.
  value: La planificación patrimonial no trata solo de riqueza. Puede ayudarle a designar personas para la toma de decisiones, documentar sus deseos, prepararse para una posible incapacidad y dar mayor claridad en asuntos importantes para sus seres queridos.
faq.items.1.question:
  source: What documents are commonly included in an estate plan?
  value: ¿Qué documentos se incluyen comúnmente en un plan patrimonial?
faq.items.1.answer:
  source: Depending on your circumstances, an estate plan may include a will, trust, power of attorney, and healthcare directive. We’ll help you understand which documents make sense for your situation.
  value: Dependiendo de sus circunstancias, un plan patrimonial puede incluir un testamento, fideicomiso, poder notarial y directiva de atención médica. Le ayudaremos a comprender qué documentos son adecuados para su situación.
faq.items.2.question:
  source: How much does estate planning cost?
  value: ¿Cuánto cuesta la planificación patrimonial?
faq.items.2.answer:
  source: The cost depends on the documents and complexity involved. After your free initial consultation, we’ll explain what your situation requires and the associated fees before moving forward.
  value: El costo depende de los documentos y la complejidad involucrada. Después de su consulta inicial gratuita, le explicaremos lo que requiere su situación y los honorarios asociados antes de proceder.
faq.items.3.question:
  source: What happens during the initial consultation?
  value: ¿Qué sucede durante la consulta inicial?
faq.items.3.answer:
  source: We’ll learn about your family, priorities, property, existing documents, and questions, then explain the options that may fit your goals. You do not need to arrive with every decision already made.
  value: Conoceremos a su familia, sus prioridades, sus propiedades, sus documentos existentes y sus preguntas; luego, explicaremos las opciones que pueden adaptarse a sus objetivos. No es necesario que llegue con todas las decisiones ya tomadas.
faq.items.4.question:
  source: Can Miranda Law assist me in Spanish or Portuguese?
  value: ¿Puede Miranda Law asistirme en español o portugués?
faq.items.4.answer:
  source: Yes. Miranda Law serves clients in English, Spanish, and Portuguese so you can discuss important legal decisions in the language you’re most comfortable using.
  value: Sí. Miranda Law atiende a clientes en inglés, español y portugués para que pueda discutir decisiones legales importantes en el idioma con el que se sienta más cómodo.
faq.items.5.question:
  source: Does Miranda Law offer virtual consultations?
  value: ¿Ofrece Miranda Law consultas virtuales?
faq.items.5.answer:
  source: Consultation formats may depend on your circumstances. Contact Miranda Law to ask whether a virtual consultation is available for your matter.
  value: Los formatos de consulta pueden depender de sus circunstancias. Contacte a Miranda Law para preguntar si hay una consulta virtual disponible para su asunto.
