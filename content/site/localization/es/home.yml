intro.eyebrow:
  source: Estate planning
  value: Planificación patrimonial
intro.title:
  source: You Know You Should Have a Plan. You Just Haven’t Gotten Around to It.
  value: Usted sabe que debe tener un plan. Simplemente no ha tenido oportunidad de hacerlo.
intro.paragraphs.0:
  source: Maybe you’ve been meaning to make a will.
  value: Tal vez ha tenido la intención de elaborar un testamento.
intro.paragraphs.1:
  source: Maybe you recently bought a home, had children, got married, or started thinking more seriously about retirement.
  value: Tal vez compró una casa recientemente, tuvo hijos, se casó o comenzó a pensar más seriamente en su jubilación.
intro.paragraphs.2:
  source: Or maybe you’re simply not sure which documents you actually need.
  value: O tal vez simplemente no está seguro de qué documentos necesita realmente.
intro.paragraphs.3:
  source: You don’t have to figure it out yourself.
  value: No tiene que resolverlo usted solo.
intro.paragraphs.4:
  source: Miranda Law helps New Jersey families create straightforward estate plans designed to protect the people they love and make their wishes clear.
  value: Miranda Law ayuda a las familias de New Jersey a crear planes de planificación patrimonial sencillos, diseñados para proteger a sus seres queridos y dejar claras sus voluntades.
