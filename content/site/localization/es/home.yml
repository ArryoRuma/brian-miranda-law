why.eyebrow:
  source: Why choose Miranda Law
  value: ¿Por qué elegir Miranda Law?
why.title:
  source: Estate Planning Doesn’t Have to Feel Complicated.
  value: La planificación patrimonial no tiene por qué ser complicada.
why.body:
  source: The goal isn’t to hand you a stack of legal documents. It’s to help you understand your options, make the right decisions for your family, and leave with a plan you feel confident about.
  value: Nuestro objetivo no es entregarle una pila de documentos legales. Es ayudarle a comprender sus opciones, tomar las decisiones correctas para su familia y que usted se retire con un plan con el que se sienta seguro.
why.items.0.title:
  source: Straightforward
  value: Directo
why.items.0.description:
  source: We explain your options in plain language and help you determine what you actually need.
  value: Explicamos sus opciones en un lenguaje sencillo y le ayudamos a determinar lo que realmente necesita.
