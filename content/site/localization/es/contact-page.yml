  value: 908-424-1011
optionValues.text:
  source: Send a text message
  value: Enviar un mensaje de texto
optionValues.whatsapp:
  source: Message on WhatsApp
  value: Mensaje por WhatsApp
office.eyebrow:
  source: Warren office
  value: Oficina de Warren
office.title:
  source: Meet by appointment in North Jersey.
  value: Reuniones con cita previa en North Jersey.
office.body:
  source: Miranda Law primarily serves clients in Monmouth County and communities north of it. Contact the office to arrange a consultation.
  value: Miranda Law atiende principalmente a clientes en Monmouth County y las comunidades al norte de este. Contacte a la oficina para programar una consulta.
