entries:
  - path: title
    source: Privacy Policy
    value: Política de privacidad
  - path: description
    source: Read how Miranda Law may handle information submitted through this website and how to contact the firm with privacy questions.
    value: Lea cómo Miranda Law puede manejar la información enviada a través de este sitio web y cómo ponerse en contacto con la firma si tiene preguntas sobre privacidad.
  - path: updated
    source: October 9, 2026
    value: 9 de octubre de 2026
  - path: intro
    source: This policy describes the general categories of information that may be processed through the Miranda Law website and related communications. It does not replace the firm's engagement agreement or explain the handling of an active client matter.
    value: Esta política describe las categorías generales de información que pueden procesarse a través del sitio web de Miranda Law y las comunicaciones relacionadas. No reemplaza el acuerdo de contratación de la firma ni explica el manejo de un asunto activo de un cliente.
  - path: sections.0.title
    source: Information you choose to provide
    value: Información que usted elige proporcionar
  - path: sections.0.paragraphs.0
    source: You may choose to provide contact information and a general description of your legal needs when communicating with the firm. Do not submit confidential, highly sensitive, or time-sensitive information until Miranda Law confirms that the communication method is appropriate and that the firm represents you.
    value: Al comunicarse con la firma, usted puede optar por proporcionar información de contacto y una descripción general de sus necesidades legales. No envíe información confidencial, altamente sensible o urgente hasta que Miranda Law confirme que el método de comunicación es adecuado y que la firma lo representa.
  - path: sections.1.title
    source: Website and analytics information
    value: Información del sitio web y de análisis
  - path: sections.1.paragraphs.0
    source: The website and its service providers may process technical information such as browser type, device type, referring page, pages visited, approximate location, and interaction data for security, performance, and website improvement.
    value: El sitio web y sus proveedores de servicios pueden procesar información técnica como el tipo de navegador, dispositivo, página de referencia, páginas visitadas, ubicación aproximada y datos de interacción para la seguridad, el rendimiento y la mejora del sitio.
  - path: sections.1.paragraphs.1
    source: The website may use analytics tools to understand aggregate traffic and page usage. The specific tools and settings may change as the website develops.
    value: El sitio web puede utilizar herramientas de análisis para comprender el tráfico agregado y el uso de las páginas. Las herramientas y configuraciones específicas pueden cambiar a medida que el sitio se desarrolle.
  - path: sections.2.title
    source: How information may be used
    value: Cómo puede utilizarse la información
  - path: sections.2.bullets.0
    source: Respond to inquiries and help schedule consultations
    value: Responder a consultas y ayudar a programar consultas
  - path: sections.2.bullets.1
    source: Evaluate whether the firm can consider a matter
    value: Evaluar si la firma puede considerar un asunto
  - path: sections.2.bullets.2
    source: Operate, secure, and improve the website
    value: Operar, asegurar y mejorar el sitio web
  - path: sections.2.bullets.3
    source: Maintain records and comply with legal or professional obligations
    value: Mantener registros y cumplir con obligaciones legales o profesionales
  - path: sections.2.bullets.4
    source: Prevent misuse, fraud, or threats to the website and its users
    value: Prevenir el uso indebido, el fraude o las amenazas al sitio web y a sus usuarios
  - path: sections.3.title
    source: Service providers and legal requirements
    value: Proveedores de servicios y requisitos legales
  - path: sections.3.paragraphs.0
    source: Information may be received through the website, email, phone, text, WhatsApp, or other communication methods made available by the firm. Information may be processed by service providers that support hosting, communications, scheduling, analytics, security, or intake.
    value: La información puede recibirse a través del sitio web, correo electrónico, teléfono, mensajes de texto, WhatsApp u otros métodos de comunicación que ofrezca la firma. La información puede ser procesada por proveedores que apoyan el alojamiento, las comunicaciones, la programación, el análisis, la seguridad o la recepción.
  - path: sections.3.paragraphs.1
    source: Brian Miranda and the office team monitor phone, text, WhatsApp, and email. The channels are not continuously monitored; inquiries are reviewed during the next business day. Do not use the website or these channels for emergencies, urgent deadlines, or confidential highly sensitive information.
    value: Brian Miranda y el equipo de la oficina supervisan el teléfono, los mensajes de texto, WhatsApp y el correo electrónico. Los canales no se supervisan continuamente; las consultas se revisan durante el siguiente día hábil. No utilice el sitio ni estos canales para emergencias, plazos urgentes o información confidencial altamente sensible.
  - path: sections.3.paragraphs.2
    source: Miranda Law retains or deletes inquiry records under its existing firm retention policy. Provider logs and records remain subject to the applicable provider terms. Information may also be disclosed when required by law, court process, professional obligation, or a good-faith need to protect rights and safety.
    value: Miranda Law conserva o elimina los registros de consultas conforme a su política vigente de conservación. Los registros de proveedores están sujetos a los términos aplicables del proveedor. La información también puede divulgarse cuando lo exija la ley, un proceso judicial, una obligación profesional o una necesidad de buena fe para proteger derechos y seguridad.
  - path: sections.4.title
    source: Questions and requests
    value: Preguntas y solicitudes
  - path: sections.4.paragraphs.0
    source: Questions about this policy may be sent to bmiranda@bmirandalaw.com. The availability of particular privacy rights depends on the law that applies to the request.
    value: Las preguntas sobre esta política pueden enviarse a bmiranda@bmirandalaw.com. La disponibilidad de derechos de privacidad particulares depende de la ley aplicable a la solicitud.
