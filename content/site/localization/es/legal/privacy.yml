title:
  source: Privacy Policy
  value: Política de privacidad
description:
  source: Read how Miranda Law may handle information submitted through this website and how to contact the firm with privacy questions.
  value: Lea cómo Miranda Law puede manejar la información enviada a través de este sitio web y cómo ponerse en contacto con la firma si tiene preguntas sobre privacidad.
updated:
  source: August 14, 2026
  value: 14 de agosto de 2026
intro:
  source: This policy describes the general categories of information that may be processed through the Miranda Law website. It should be reviewed again when the secure intake, scheduling, analytics, and hosting services are finalized.
  value: Esta política describe las categorías generales de información que pueden procesarse a través del sitio web de Miranda Law. Debe revisarse nuevamente cuando se finalicen los servicios de recepción segura, programación, análisis y alojamiento.
sections.0.title:
  source: Information you choose to provide
  value: Información que usted elige proporcionar
sections.0.paragraphs.0:
  source: You may choose to provide contact information and a general description of your legal needs when communicating with the firm. Do not submit confidential, highly sensitive, or time-sensitive information until Miranda Law confirms that the communication method is appropriate and that the firm represents you.
  value: Al comunicarse con la firma, usted puede optar por proporcionar información de contacto y una descripción general de sus necesidades legales. No envíe información confidencial, altamente sensible o urgente hasta que Miranda Law confirme que el método de comunicación es adecuado y que la firma lo representa.
sections.1.title:
  source: Website and analytics information
  value: Información del sitio web y de análisis
sections.1.paragraphs.0:
  source: The website and its service providers may process technical information such as browser type, device type, referring page, pages visited, approximate location, and interaction data for security, performance, and website improvement.
  value: El sitio web y sus proveedores de servicios pueden procesar información técnica como el tipo de navegador, el tipo de dispositivo, la página de referencia, las páginas visitadas, la ubicación aproximada y los datos de interacción con fines de seguridad, rendimiento y mejora del sitio web.
sections.2.title:
  source: How information may be used
  value: Cómo puede utilizarse la información
sections.2.bullets.0:
  source: Respond to inquiries and help schedule consultations
  value: Responder a consultas y ayudar a programar consultas
sections.2.bullets.1:
  source: Evaluate whether the firm can consider a matter
  value: Evaluar si la firma puede considerar un asunto
sections.2.bullets.2:
  source: Operate, secure, and improve the website
  value: Operar, asegurar y mejorar el sitio web
sections.2.bullets.3:
  source: Maintain records and comply with legal or professional obligations
  value: Mantener registros y cumplir con obligaciones legales o profesionales
sections.2.bullets.4:
  source: Prevent misuse, fraud, or threats to the website and its users
  value: Prevenir el uso indebido, el fraude o las amenazas al sitio web y a sus usuarios
sections.3.title:
  source: Service providers and legal requirements
  value: Proveedores de servicios y requisitos legales
sections.3.paragraphs.0:
  source: Information may be processed by service providers that support hosting, communications, scheduling, analytics, security, or intake. Information may also be disclosed when required by law, court process, professional obligation, or a good-faith need to protect rights and safety.
  value: La información puede ser procesada por proveedores de servicios que brindan apoyo en alojamiento, comunicaciones, programación, análisis, seguridad o recepción. La información también puede ser divulgada cuando así lo requiera la ley, un proceso judicial, una obligación profesional o una necesidad de buena fe para proteger derechos y la seguridad.
sections.4.title:
  source: Questions and requests
  value: Preguntas y solicitudes
sections.4.paragraphs.0:
  source: Questions about this policy may be sent to bmiranda@bmirandalaw.com. The availability of particular privacy rights depends on the law that applies to the request.
  value: Las preguntas sobre esta política pueden enviarse a bmiranda@bmirandalaw.com. La disponibilidad de derechos de privacidad particulares depende de la ley que se aplique a la solicitud.
