title:
  source: Estate Planning Resources
  value: Recursos de planificación patrimonial
metaDescription:
  source: Use Miranda Law's estate-planning FAQs, preparation checklist, and video resources to organize questions before a consultation.
  value: Utilice las preguntas frecuentes, la lista de verificación de preparación y los recursos en video de Miranda Law para organizar sus preguntas antes de una consulta.
hero.eyebrow:
  source: Estate planning resources
  value: Recursos de planificación patrimonial
hero.title:
  source: Start informed.
  value: Comience informado.
hero.accent:
  source: You do not have to start certain.
  value: No es necesario comenzar con todas las certezas.
hero.lead:
  source: These resources are designed to help you organize the people, property, documents, and questions you may want to discuss with an attorney.
  value: Estos recursos están diseñados para ayudarle a organizar a las personas, propiedades, documentos y preguntas que desee discutir con un abogado.
hero.secondaryLabel:
  source: Read common questions
  value: Lea las preguntas comunes
sections.0.eyebrow:
  source: Prepare at your pace
  value: Prepárese a su propio ritmo
sections.0.title:
  source: Three ways to make the first conversation easier.
  value: Tres formas de facilitar la primera conversación.
sections.0.cards.0.title:
  source: Estate Planning FAQs
  value: Preguntas frecuentes sobre planificación patrimonial
sections.0.cards.0.body:
  source: Plain-language answers to common questions about documents, timing, cost, and the first consultation.
  value: Respuestas en lenguaje sencillo a preguntas comunes sobre documentos, plazos, costos y la primera consulta.
sections.0.cards.0.linkLabel:
  source: Browse the FAQs
