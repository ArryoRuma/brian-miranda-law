sections.0.cards.1.title:
  source: Estate Planning Checklist
  value: Lista de verificación de planificación patrimonial
sections.0.cards.1.body:
  source: A practical list of information and decisions to gather. Complete what you can and leave the rest for the conversation.
  value: Una lista práctica de información y decisiones para recopilar. Complete lo que pueda y deje el resto para la conversación.
sections.0.cards.1.linkLabel:
  source: Open the checklist
  value: Abra la lista de verificación
sections.0.cards.2.title:
  source: Video Library
  value: Biblioteca de videos
sections.0.cards.2.body:
  source: Short explanations of estate-planning concepts and the questions families commonly bring to the office.
  value: Explicaciones breves sobre conceptos de planificación patrimonial y las preguntas que las familias suelen traer a la oficina.
sections.0.cards.2.linkLabel:
  source: Visit the video library
  value: Visite la biblioteca de videos
sections.1.eyebrow:
  source: A useful reminder
  value: Un recordatorio útil
sections.1.title:
  source: General information is a starting point, not a personal legal plan.
  value: La información general es un punto de partida, no un plan legal personal.
sections.1.body.0:
  source: Online resources can help you identify questions, but they cannot account for every family, asset, document, or legal issue. A consultation is where general information becomes a conversation about your circumstances.
  value: Los recursos en línea pueden ayudarle a identificar preguntas, pero no pueden contemplar cada familia, activo, documento o asunto legal. Una consulta es el espacio donde la información general se convierte en una conversación sobre sus circunstancias.
