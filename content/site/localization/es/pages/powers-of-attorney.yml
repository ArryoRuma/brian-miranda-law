title:
  source: Powers of Attorney in North Jersey
  value: Poderes notariales en North Jersey
metaDescription:
  source: Learn how a financial power of attorney can authorize a trusted person to handle defined matters and speak with Miranda Law about your plan.
  value: Aprenda cómo un poder notarial financiero puede autorizar a una persona de confianza para gestionar asuntos definidos y consulte con Miranda Law sobre su plan.
hero.eyebrow:
  source: Powers of Attorney
  value: Poderes notariales
hero.title:
  source: Choose who may act
  value: Elija quién puede actuar
hero.accent:
  source: when you cannot act for yourself.
  value: cuando usted no pueda actuar por sí mismo.
hero.lead:
  source: A power of attorney can authorize a trusted person to handle defined financial, legal, or practical matters on your behalf. Careful drafting helps make the authority clear before it is urgently needed.
  value: Un poder notarial puede autorizar a una persona de confianza para gestionar asuntos financieros, legales o prácticos definidos en su nombre. Una redacción cuidadosa ayuda a que la autoridad sea clara antes de que se necesite con urgencia.
hero.secondaryLabel:
  source: See the complete estate plan
  value: Ver el plan de planificación patrimonial completo
sections.0.eyebrow:
  source: What is a power of attorney?
  value: ¿Qué es un poder notarial?
sections.0.title:
  source: Written authority for a person you choose.
  value: Autoridad por escrito para una persona que usted elija.
sections.0.body.0:
  source: A power of attorney names an agent to act for you within the authority described in the document. Depending on its terms, that authority may cover financial accounts, property, taxes, contracts, benefits, business interests, or other legal and practical matters.
  value: Un poder notarial designa a un agente para actuar en su nombre dentro de la autoridad descrita en el documento. Dependiendo de sus términos, esa autoridad puede cubrir cuentas financieras, propiedades, impuestos, contratos, beneficios, intereses comerciales u otros asuntos legales y prácticos.
sections.0.body.1:
  source: The document should be tailored to the authority you actually want to give and coordinated with institutions or arrangements that may have their own requirements.
  value: El documento debe adaptarse a la autoridad que usted realmente desea otorgar y coordinarse con las instituciones o acuerdos que puedan tener sus propios requisitos.
sections.1.eyebrow:
  source: Why you may need one
  value: Por qué podría necesitar uno
sections.1.title:
  source: Prepare for a time when signatures and decisions cannot wait.
  value: Prepárese para un momento en el que las firmas y las decisiones no puedan esperar.
sections.1.bullets.0:
  source: You want someone to manage bills or financial accounts during incapacity.
  value: Usted desea que alguien gestione facturas o cuentas financieras durante una incapacidad.
sections.1.bullets.1:
  source: You own real estate or a business interest that may require ongoing action.
  value: Usted posee bienes raíces o una participación comercial que puede requerir acciones continuas.
sections.1.bullets.2:
  source: You want an agent to address taxes, benefits, insurance, or legal documents.
  value: Usted desea que un agente se encargue de impuestos, beneficios, seguros o documentos legales.
sections.1.bullets.3:
  source: You travel or may need help handling a limited transaction.
  value: Usted viaja o puede necesitar ayuda para gestionar una transacción limitada.
sections.1.bullets.4:
  source: You want a backup agent if the first person cannot serve.
  value: Usted desea un agente de respaldo si la primera persona no puede ejercer el cargo.
sections.1.bullets.5:
  source: Your current document is old, too narrow, or names someone who is no longer appropriate.
  value: Su documento actual es antiguo, demasiado limitado o designa a alguien que ya no es apropiado.
sections.2.eyebrow:
  source: What you can decide
  value: Lo que usted puede decidir
sections.2.title:
  source: Who acts, what they may do, and how the authority is limited.
  value: Quién actúa, qué puede hacer y cómo se limita la autoridad.
sections.2.cards.0.title:
  source: Primary agent
  value: Agente principal
sections.2.cards.0.body:
  source: Choose a person you trust to follow the document and act with care.
  value: Elija a una persona de su confianza para que cumpla con el documento y actúe con cuidado.
sections.2.cards.1.title:
  source: Successor agent
  value: Agente sucesor
sections.2.cards.1.body:
  source: Name a backup in case the first agent cannot or will not act.
  value: Nombre a un sustituto en caso de que el primer agente no pueda o no desee actuar.
sections.2.cards.2.title:
  source: Scope of authority
  value: Alcance de la autoridad
sections.2.cards.2.body:
  source: Describe the financial, legal, property, business, or other matters the agent may handle.
  value: Describa los asuntos financieros, legales, de propiedad, comerciales u otros que el agente podrá gestionar.
sections.2.cards.3.title:
  source: Timing and limits
  value: Plazos y límites
sections.2.cards.3.body:
  source: Address when authority begins, whether it continues during incapacity, and any instructions or limits that should apply.
  value: Especifique cuándo comienza la autoridad, si esta continúa durante una incapacidad y cualquier instrucción o límite que deba aplicarse.
sections.3.eyebrow:
  source: Who should consider one
  value: Quién debería considerar uno
sections.3.title:
  source: Incapacity planning belongs in many adult estate plans.
  value: La planificación de la incapacidad es parte fundamental de muchos planes de planificación patrimonial para adultos.
sections.3.bullets.0:
  source: Adults with financial accounts or recurring obligations
  value: Adultos con cuentas financieras u obligaciones recurrentes
sections.3.bullets.1:
  source: Homeowners and business owners
  value: Propietarios de viviendas y propietarios de negocios
sections.3.bullets.2:
  source: People approaching retirement
  value: Personas próximas a la jubilación
sections.3.bullets.3:
  source: Caregivers and adults supporting family members
  value: Cuidadores y adultos que brindan apoyo a miembros de la familia
sections.3.bullets.4:
  source: People with planned travel, medical procedures, or periods of limited availability
  value: Personas con viajes programados, procedimientos médicos o períodos de disponibilidad limitada
sections.3.bullets.5:
  source: Anyone who wants to choose an agent before a court process may become necessary
  value: Cualquier persona que desee elegir un agente antes de que sea necesario un proceso judicial
sections.4.eyebrow:
  source: What happens without one
  value: Qué sucede si no se tiene uno
sections.4.title:
  source: Family members do not always receive automatic financial authority.
  value: Los familiares no siempre reciben autoridad financiera automática.
sections.4.body.0:
  source: If you become unable to manage financial or legal matters and no effective authority is in place, relatives may face delays, institutional barriers, or a court proceeding to obtain authority.
  value: Si usted queda imposibilitado para gestionar asuntos financieros o legales y no cuenta con una autoridad efectiva, sus familiares podrían enfrentar retrasos, barreras institucionales o un proceso judicial para obtener dicha autoridad.
sections.4.body.1:
  source: A power of attorney cannot prevent every difficulty, but it can provide a documented starting point and identify the person you chose.
  value: Un poder notarial no puede evitar todas las dificultades, pero puede proporcionar un punto de partida documentado e identificar a la persona que usted eligió.
sections.5.eyebrow:
  source: Common misconceptions
  value: Conceptos erróneos comunes
sections.5.title:
  source: Authority should be deliberate, not vague.
  value: La autoridad debe ser deliberada, no vaga.
sections.5.cards.0.title:
  source: “My spouse or child can automatically handle everything.”
  value: “Mi cónyuge o hijo puede encargarse de todo automáticamente”.
sections.5.cards.0.body:
  source: Relationships alone may not give another person authority over individually held accounts or legal matters.
  value: Los vínculos afectivos por sí solos pueden no otorgar a otra persona autoridad sobre cuentas individuales o asuntos legales.
sections.5.cards.1.title:
  source: “A power of attorney replaces a will.”
  value: “Un poder notarial reemplaza un testamento”.
sections.5.cards.1.body:
  source: A power of attorney generally concerns authority during life; a will addresses instructions after death.
  value: Un poder notarial generalmente se refiere a la autoridad durante la vida; un testamento aborda las instrucciones después del fallecimiento.
sections.5.cards.2.title:
  source: “The broadest document is always best.”
  value: “El documento más amplio es siempre el mejor”.
sections.5.cards.2.body:
  source: The appropriate authority depends on your goals, risks, and trust in the people being named.
  value: La autoridad apropiada depende de sus objetivos, riesgos y la confianza en las personas que sean designadas.
sections.6.eyebrow:
  source: How it fits
  value: Cómo se integra
sections.6.title:
  source: Pair financial authority with health care planning.
  value: Combine la autoridad financiera con la planificación de atención médica.
sections.6.body.0:
  source: A financial power of attorney handles a different set of decisions from a health care directive. Keeping both documents current can create a more complete incapacity plan.
  value: Un poder notarial financiero maneja un conjunto de decisiones distinto al de una directiva de atención médica. Mantener ambos documentos actualizados puede crear un plan de incapacidad más completo.
sections.7.eyebrow:
  source: The Miranda Law process
  value: El proceso de Miranda Law
sections.7.title:
  source: From a first conversation to a finished document.
  value: Desde la primera conversación hasta el documento finalizado.
sections.7.steps.0.title:
  source: Schedule a Free Initial Consultation
  value: Programe una consulta inicial gratuita
sections.7.steps.0.body:
  source: Discuss your current documents, family, property, concerns, and goals.
  value: Analizamos sus documentos actuales, su familia, propiedades, inquietudes y objetivos.
sections.7.steps.1.title:
  source: Review the options
  value: Revise las opciones
sections.7.steps.1.body:
  source: Understand the purpose, limits, and decisions involved before choosing a direction.
  value: Comprenda el propósito, los límites y las decisiones involucradas antes de elegir un camino.
sections.7.steps.2.title:
  source: Prepare and review
  value: Prepare y revise
sections.7.steps.2.body:
  source: The firm drafts the document and reviews its terms with you in plain language.
  value: La firma redacta el documento y revisa sus términos con usted en un lenguaje sencillo.
sections.7.steps.3.title:
  source: Sign and finalize
  value: Firme y finalice
sections.7.steps.3.body:
  source: Complete the required formalities and understand how the document fits with the rest of the plan.
  value: Complete las formalidades requeridas y comprenda cómo el documento se integra con el resto del plan.
sections.8.eyebrow:
  source: Why work with Miranda Law
  value: Por qué trabajar con Miranda Law
sections.8.title:
  source: Personal guidance with accessible communication.
  value: Guía personalizada con comunicación accesible.
sections.8.bullets.0:
  source: Clear explanations centered on the decisions you need to make.
  value: Explicaciones claras centradas en las decisiones que usted debe tomar.
sections.8.bullets.1:
  source: Recommendations based on your family, assets, and goals.
  value: Recomendaciones basadas en su familia, activos y objetivos.
sections.8.bullets.2:
  source: Service in English, Spanish, and Portuguese.
  value: Servicio en inglés, español y portugués.
sections.8.bullets.3:
  source: Phone, text, and WhatsApp communication with the office.
  value: Comunicación con la oficina por teléfono, mensaje de texto y WhatsApp.
sections.8.bullets.4:
  source: A free initial consultation to understand the possible scope.
  value: Una consulta inicial gratuita para comprender el alcance posible.
faqs.0.question:
  source: When does a power of attorney take effect?
  value: ¿Cuándo entra en vigor un poder notarial?
faqs.0.answer:
  source: That depends on the document's terms and applicable law. The timing should be discussed and written clearly.
  value: Eso depende de los términos del documento y la ley aplicable. El momento de entrada en vigor debe discutirse y redactarse claramente.
faqs.1.question:
  source: Does the authority continue if I become incapacitated?
  value: ¿Continúa la autoridad si quedo incapacitado?
faqs.1.answer:
  source: A durable power of attorney is designed to continue during incapacity, but the actual document must be reviewed for its terms and validity.
  value: Un poder notarial duradero está diseñado para continuar durante la incapacidad, pero el documento real debe revisarse para verificar sus términos y validez.
faqs.2.question:
  source: Can I name more than one agent?
  value: ¿Puedo designar a más de un agente?
faqs.2.answer:
  source: A document may name co-agents or successors, but multiple agents can create practical questions about signatures, coordination, and disagreements.
  value: Un documento puede designar coagentes o sucesores, pero múltiples agentes pueden generar dudas prácticas sobre firmas, coordinación y desacuerdos.
faqs.3.question:
  source: Can I revoke a power of attorney?
  value: ¿Puedo revocar un poder notarial?
faqs.3.answer:
  source: A person with capacity can generally revoke authority, but effective revocation also requires practical notice to the agent and relevant institutions.
  value: Una persona con capacidad legal generalmente puede revocar la autoridad, pero una revocación efectiva también requiere notificación práctica al agente y a las instituciones pertinentes.
faqs.4.question:
  source: Is a power of attorney the same as a health care proxy?
  value: ¿Es un poder notarial lo mismo que un representante de atención médica?
faqs.4.answer:
  source: No. Financial powers of attorney and health care directives address different decisions and are usually documented separately.
  value: No. Los poderes notariales financieros y las directivas de atención médica abordan decisiones distintas y generalmente se documentan por separado.
