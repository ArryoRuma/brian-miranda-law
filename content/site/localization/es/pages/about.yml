title:
  source: About Brian Miranda
  value: Acerca de Brian Miranda
metaDescription:
  source: Meet Brian M. Miranda, Esq. and learn about Miranda Law's clear, responsive, multilingual approach to serving North Jersey families.
  value: Conozca a Brian M. Miranda, Esq. y aprenda sobre el enfoque claro, receptivo y multilingüe de Miranda Law para servir a las familias de North Jersey.
hero.eyebrow:
  source: About Brian
  value: Acerca de Brian
hero.title:
  source: Meet Brian Miranda
  value: Conozca a Brian Miranda
hero.lead:
  source: Brian M. Miranda, Esq. helps North Jersey individuals and families with estate planning. His approach is personal and practical, with clear explanations and service available in English, Spanish, and Portuguese.
  value: Brian M. Miranda, Esq. ayuda a personas y familias del norte de New Jersey con la planificación patrimonial. Su enfoque es personal y práctico, con explicaciones claras y atención disponible en inglés, español y portugués.
