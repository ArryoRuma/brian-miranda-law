    source: Schedule a Free Initial Consultation
    value: Programe una consulta inicial gratuita
  - path: sections.0.title
    source: A Hillside foundation.
    value: Sus raíces en Hillside.
  - path: sections.0.body.0
    source: Brian Miranda grew up in Hillside, New Jersey, in a blue-collar family where hard work was a daily example. Working in construction with his father and uncle helped shape his practical approach.
    value: Brian Miranda creció en Hillside, New Jersey, en una familia de clase trabajadora donde el trabajo duro era un ejemplo cotidiano. Trabajar en la construcción con su padre y su tío contribuyó a formar su enfoque práctico.
  - path: sections.0.body.1
    source: Brian grew up bilingual and learned English as a second language. That experience gives him a personal understanding of how much clear communication matters when legal issues feel unfamiliar.
    value: Brian creció siendo bilingüe y aprendió inglés como segundo idioma. Esa experiencia le permite comprender, desde una perspectiva personal, cuánto importa la comunicación clara cuando los asuntos legales resultan poco familiares.
