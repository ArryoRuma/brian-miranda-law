title:
  source: Health Care Directives in North Jersey
  value: Directivas de atención médica en el norte de New Jersey
metaDescription:
  source: Learn how New Jersey health care directives can name a representative and communicate treatment preferences if you cannot decide for yourself.
  value: Aprenda cómo las directivas de atención médica de New Jersey pueden designar a un representante y comunicar sus preferencias de tratamiento si usted no puede decidir por sí mismo.
hero.eyebrow:
  source: Health Care Directives
  value: Directivas de atención médica
hero.title:
  source: Give the people you trust
  value: Brinde a las personas en las que confía
hero.accent:
  source: clearer medical guidance.
  value: una guía médica más clara.
hero.lead:
  source: A health care directive can name a representative to make health care decisions if you become unable to decide and can record preferences that help guide difficult conversations.
  value: Una directiva de atención médica puede designar a un representante para tomar decisiones de atención médica en caso de que usted no pueda decidir, y puede registrar preferencias que ayuden a orientar conversaciones difíciles.
hero.secondaryLabel:
  source: See the complete estate plan
  value: Ver el plan de planificación patrimonial completo
sections.0.eyebrow:
  source: What is a health care directive?
  value: ¿Qué es una directiva de atención médica?
sections.0.title:
  source: A written plan for medical decision-making during incapacity.
  value: Un plan por escrito para la toma de decisiones médicas durante una incapacidad.
sections.0.body.0:
  source: New Jersey recognizes a proxy directive, which names a health care representative, and an instruction directive, often called a living will, which communicates treatment preferences.
  value: New Jersey reconoce una directiva de apoderado, que designa a un representante de atención médica, y una directiva de instrucciones, a menudo llamada testamento vital, que comunica las preferencias de tratamiento.
sections.0.body.1:
  source: The representative's authority is intended for a time when you cannot make your own health care decisions. While you remain able to decide, your own decisions control.
  value: La autoridad del representante está destinada para un momento en el que usted no pueda tomar sus propias decisiones de atención médica. Mientras usted mantenga la capacidad de decidir, sus propias decisiones prevalecerán.
sections.1.eyebrow:
  source: Why you may need one
  value: Por qué podría necesitar uno
sections.1.title:
  source: Make the conversation easier before a crisis.
  value: Facilite la conversación antes de una crisis.
sections.1.bullets.0:
  source: You want to choose who should speak with physicians and make decisions if you cannot.
  value: Usted desea elegir quién debe hablar con los médicos y tomar decisiones si usted no puede hacerlo.
sections.1.bullets.1:
  source: You want to name an alternate representative.
  value: Usted desea designar a un representante alternativo.
sections.1.bullets.2:
  source: You have treatment preferences or values you want your representative to understand.
  value: Usted tiene preferencias o valores de tratamiento que desea que su representante comprenda.
sections.1.bullets.3:
  source: You want family members and medical providers to have written guidance.
  value: Usted desea que los familiares y los proveedores médicos cuenten con una guía por escrito.
sections.1.bullets.4:
  source: You have an older directive that names the wrong person or no longer reflects your wishes.
  value: Usted tiene una directiva antigua que designa a la persona incorrecta o que ya no refleja sus deseos.
sections.1.bullets.5:
  source: You are preparing for surgery, managing a health condition, or completing a broader estate plan.
  value: Usted se está preparando para una cirugía, manejando una condición de salud o completando un plan de planificación patrimonial más amplio.
sections.2.eyebrow:
  source: What you can decide
  value: Lo que usted puede decidir
sections.2.title:
  source: Choose a representative and communicate what matters to you.
  value: Elija un representante y comunique lo que es importante para usted.
sections.2.cards.0.title:
  source: Health care representative
  value: Representante de atención médica
sections.2.cards.0.body:
  source: Name the person authorized to make health care decisions if you are unable to do so.
  value: Designar a la persona autorizada para tomar decisiones de atención médica si usted no puede hacerlo.
sections.2.cards.1.title:
  source: Alternate representative
  value: Representante alternativo
sections.2.cards.1.body:
  source: Choose a backup if the first person is unable, unwilling, or unavailable to serve.
  value: Elegir un respaldo en caso de que la primera persona no pueda, no quiera o no esté disponible para ejercer el cargo.
sections.2.cards.2.title:
  source: Treatment preferences
  value: Preferencias de tratamiento
sections.2.cards.2.body:
  source: Provide guidance about treatments, life-sustaining measures, and the values that should shape decisions.
  value: Proporcione orientación sobre tratamientos, medidas de soporte vital y los valores que deben orientar las decisiones.
sections.2.cards.3.title:
  source: People who receive copies
  value: Personas que reciben copias
sections.2.cards.3.body:
  source: Plan how representatives, family members, physicians, and health care facilities can access the directive when needed.
  value: Planifique cómo los representantes, familiares, médicos y centros de atención médica pueden acceder a la directiva cuando sea necesario.
sections.3.eyebrow:
  source: Who should consider one
  value: Quién debería considerar uno
sections.3.title:
  source: Advance directives are not only for older adults.
  value: Las directivas anticipadas no son solo para adultos mayores.
sections.3.bullets.0:
  source: Any adult who wants to choose a health care representative
  value: Cualquier adulto que desee elegir un representante de atención médica
sections.3.bullets.1:
  source: People preparing for surgery or managing an illness
  value: Personas que se preparan para una cirugía o que están tratando una enfermedad
sections.3.bullets.2:
  source: Parents, caregivers, and adults with family responsibilities
  value: Padres, cuidadores y adultos con responsabilidades familiares
sections.3.bullets.3:
  source: People whose relatives disagree about medical decisions
  value: Personas cuyos familiares no están de acuerdo respecto a decisiones médicas
sections.3.bullets.4:
  source: Adults whose closest trusted person may not otherwise be the obvious decision-maker
  value: Adultos cuya persona de confianza más cercana podría no ser, de otro modo, la persona designada para tomar decisiones
sections.3.bullets.5:
  source: Anyone completing or updating an estate plan
  value: Cualquier persona que esté completando o actualizando un plan de planificación patrimonial
sections.4.eyebrow:
  source: What happens without one
  value: Qué sucede si no se tiene uno
sections.4.title:
  source: Loved ones may be left without your written choice or instructions.
  value: Sus seres queridos podrían quedar sin su elección o instrucciones por escrito.
sections.4.body.0:
  source: Without a directive, medical providers and family members may have to determine who should participate in decisions and what you would have wanted without the benefit of your written guidance.
  value: Sin una directiva, los proveedores médicos y los familiares podrían verse obligados a determinar quién debe participar en las decisiones y qué habría sido su voluntad, sin contar con el beneficio de su guía por escrito.
sections.4.body.1:
  source: A directive cannot anticipate every medical circumstance, but it can identify the person you trust and give that person a clearer understanding of your values.
  value: Una directiva no puede anticipar todas las circunstancias médicas, pero puede identificar a la persona en quien usted confía y brindarle a esa persona una comprensión más clara de sus valores.
sections.5.eyebrow:
  source: Common misconceptions
  value: Conceptos erróneos comunes
sections.5.title:
  source: The document protects your voice; it does not replace it.
  value: El documento protege su voz; no la reemplaza.
sections.5.cards.0.title:
  source: “My representative decides while I still can.”
  value: “Mi representante decide mientras yo aún puedo hacerlo”.
sections.5.cards.0.body:
  source: Your representative acts only when you are unable to make your own health care decisions under the applicable standard.
  value: Su representante actúa únicamente cuando usted no pueda tomar sus propias decisiones de atención médica bajo el estándar aplicable.
sections.5.cards.1.title:
  source: “A directive is only about end-of-life care.”
  value: “Una directiva trata solo sobre los cuidados al final de la vida”.
sections.5.cards.1.body:
  source: A proxy directive can address health care decision-making more broadly during incapacity.
  value: Una directiva de procuración puede abordar la toma de decisiones de atención médica de manera más amplia durante una incapacidad.
sections.5.cards.2.title:
  source: “Completing the form ends the conversation.”
  value: “Completar el formulario pone fin a la conversación”.
sections.5.cards.2.body:
  source: Discussing your values with the representative and sharing accessible copies are important parts of the plan.
  value: Conversar sobre sus valores con el representante y compartir copias accesibles son partes importantes del plan.
sections.6.eyebrow:
  source: How it fits
  value: Cómo se integra
sections.6.title:
  source: Coordinate medical and financial decision-makers.
  value: Coordinar a los responsables de la toma de decisiones médicas y financieras.
sections.6.body.0:
  source: A health care representative addresses medical decisions, while an agent under a financial power of attorney may handle bills, insurance, accounts, and other practical matters. Both roles may be needed during the same period.
  value: Un representante de atención médica se encarga de las decisiones médicas, mientras que un agente bajo un poder notarial financiero puede encargarse de facturas, seguros, cuentas y otros asuntos prácticos. Es posible que ambos roles sean necesarios durante el mismo período.
sections.7.eyebrow:
  source: The Miranda Law process
  value: El proceso de Miranda Law
sections.7.title:
  source: From a first conversation to a finished document.
  value: Desde la primera conversación hasta el documento finalizado.
sections.7.steps.0.title:
  source: Schedule a Free Initial Consultation
  value: Programe una consulta inicial gratuita
sections.7.steps.0.body:
  source: Discuss your current documents, family, property, concerns, and goals.
  value: Analizamos sus documentos actuales, su familia, propiedades, inquietudes y objetivos.
sections.7.steps.1.title:
  source: Review the options
  value: Revise las opciones
sections.7.steps.1.body:
  source: Understand the purpose, limits, and decisions involved before choosing a direction.
  value: Comprenda el propósito, los límites y las decisiones involucradas antes de elegir un camino.
sections.7.steps.2.title:
  source: Prepare and review
  value: Prepare y revise
sections.7.steps.2.body:
  source: The firm drafts the document and reviews its terms with you in plain language.
  value: La firma redacta el documento y revisa sus términos con usted en un lenguaje sencillo.
sections.7.steps.3.title:
  source: Sign and finalize
  value: Firme y finalice
sections.7.steps.3.body:
  source: Complete the required formalities and understand how the document fits with the rest of the plan.
  value: Complete las formalidades requeridas y comprenda cómo el documento se integra con el resto del plan.
sections.8.eyebrow:
  source: Why work with Miranda Law
  value: Por qué trabajar con Miranda Law
sections.8.title:
  source: Personal guidance with accessible communication.
  value: Guía personalizada con comunicación accesible.
sections.8.bullets.0:
  source: Clear explanations centered on the decisions you need to make.
  value: Explicaciones claras centradas en las decisiones que usted debe tomar.
sections.8.bullets.1:
  source: Recommendations based on your family, assets, and goals.
  value: Recomendaciones basadas en su familia, activos y objetivos.
sections.8.bullets.2:
  source: Service in English, Spanish, and Portuguese.
  value: Servicio en inglés, español y portugués.
sections.8.bullets.3:
  source: Phone, text, and WhatsApp communication with the office.
  value: Comunicación con la oficina por teléfono, mensaje de texto y WhatsApp.
sections.8.bullets.4:
  source: A free initial consultation to understand the possible scope.
  value: Una consulta inicial gratuita para comprender el alcance posible.
faqs.0.question:
  source: What is the difference between a proxy directive and a living will?
  value: ¿Cuál es la diferencia entre una directiva de representante y un testamento vital?
faqs.0.answer:
  source: A proxy directive names a health care representative. An instruction directive, often called a living will, records treatment preferences. A person may use one or both.
  value: Una directiva de representante designa a un representante de atención médica. Una directiva de instrucciones, a menudo llamada testamento vital, registra las preferencias de tratamiento. Una persona puede utilizar una o ambas.
faqs.1.question:
  source: When can my representative make decisions?
  value: ¿Cuándo puede mi representante tomar decisiones?
faqs.1.answer:
  source: The representative acts when you have been determined unable to make your own health care decisions under the applicable process. If you regain capacity, your own decisions control again.
  value: El representante actúa cuando se ha determinado que usted no puede tomar sus propias decisiones de atención médica bajo el proceso aplicable. Si recupera la capacidad, sus propias decisiones vuelven a prevalecer.
faqs.2.question:
  source: Who should receive a copy?
  value: ¿Quién debería recibir una copia?
faqs.2.answer:
  source: Consider providing copies to the primary and alternate representatives, appropriate family members, physicians, and health care facilities involved in your care.
  value: Considere proporcionar copias a los representantes principal y alternativo, a los familiares pertinentes, a los médicos y a los centros de atención médica involucrados en su cuidado.
faqs.3.question:
  source: Can I change my directive?
  value: ¿Puedo cambiar mi directiva?
faqs.3.answer:
  source: A person with capacity can generally update or revoke a directive. New copies should be shared so older instructions are not used by mistake.
  value: Una persona con capacidad puede, por lo general, actualizar o revocar una directiva. Se deben compartir copias nuevas para que las instrucciones antiguas no se utilicen por error.
faqs.4.question:
  source: Is a POLST the same as an advance directive?
  value: ¿Es un POLST lo mismo que una directiva anticipada?
faqs.4.answer:
  source: No. A POLST is a medical order used in particular serious-illness circumstances. It can complement, but does not automatically replace, an advance directive.
  value: No. Un POLST es una orden médica que se utiliza en circunstancias particulares de enfermedades graves. Puede complementar, pero no reemplaza automáticamente, una directiva anticipada.
