title:
  source: Trusts Attorney in North Jersey
  value: Abogado de fideicomisos en North Jersey
metaDescription:
  source: Understand how trusts can hold and manage assets under written terms and speak with Miranda Law about whether a trust fits your estate plan.
  value: Comprenda cómo los fideicomisos pueden mantener y administrar activos bajo términos escritos y hable con Miranda Law sobre si un fideicomiso se ajusta a su planificación patrimonial.
hero.eyebrow:
  source: Trusts
  value: Fideicomisos
hero.title:
  source: Create structure for
  value: Cree una estructura para
hero.accent:
  source: how selected assets are managed.
  value: cómo se gestionan los activos seleccionados.
hero.lead:
  source: A trust can place selected property under written terms for the benefit of the people or purposes you choose. Whether one belongs in your plan depends on what you own, what you want to accomplish, and how the trust will be maintained.
  value: Un fideicomiso puede colocar propiedades seleccionadas bajo términos escritos para el beneficio de las personas o fines que usted elija. El hecho de que uno pertenezca a su plan depende de lo que usted posee, lo que desea lograr y cómo se mantendrá el fideicomiso.
hero.secondaryLabel:
  source: See the complete estate plan
  value: Ver el plan de planificación patrimonial completo
sections.0.eyebrow:
  source: What is a trust?
  value: ¿Qué es un fideicomiso?
sections.0.title:
  source: A legal relationship built around property, instructions, and responsibility.
  value: Una relación legal construida en torno a la propiedad, las instrucciones y la responsabilidad.
sections.0.body.0:
  source: A trust generally involves a trustee who holds or manages property under written terms for one or more beneficiaries. The person creating the trust decides its purpose and the rules that apply, within the limits of the law.
  value: Un fideicomso generalmente involucra a un fiduciario que posee o administra bienes bajo términos escritos para uno o más beneficiarios. La persona que crea el fideicomiso decide su propósito y las reglas que se aplican, dentro de los límites de la ley.
sections.0.body.1:
  source: There are many kinds of trusts. The right structure—and whether a trust is useful at all—depends on the goals and assets involved.
  value: Existen muchos tipos de fideicomisos. La estructura adecuada —y si un fideicomiso es útil o no— depende de los objetivos y los activos involucrados.
sections.1.eyebrow:
  source: Why you may need one
  value: Por qué podría necesitar uno
sections.1.title:
  source: Add control where a simple transfer may not be enough.
  value: Agregue control donde una transferencia simple puede no ser suficiente.
sections.1.bullets.0:
  source: You want property managed for a child or another beneficiary over time.
  value: Usted desea que los bienes sean administrados para un hijo u otro beneficiario a lo largo del tiempo.
sections.1.bullets.1:
  source: You want a successor trustee to manage trust property if you cannot.
  value: Usted desea un administrador sucesor que administre los bienes del fideicomiso en caso de que usted no pueda hacerlo.
sections.1.bullets.2:
  source: You want to set conditions or timing for distributions.
  value: Usted desea establecer condiciones o plazos para las distribuciones.
sections.1.bullets.3:
  source: You have a blended family or responsibilities that require careful coordination.
  value: Usted tiene una familia reconstituida o responsabilidades que requieren una coordinación cuidadosa.
sections.1.bullets.4:
  source: You want a plan for selected property that continues beyond your lifetime.
  value: Usted desea un plan para bienes seleccionados que continúe más allá de su vida.
sections.1.bullets.5:
  source: You have an existing trust that has not been reviewed or properly coordinated with current assets.
  value: Usted tiene un fideicomiso existente que no ha sido revisado o coordinado adecuadamente con sus activos actuales.
sections.2.eyebrow:
  source: What you can decide
  value: Lo que usted puede decidir
sections.2.title:
  source: Define who manages, who benefits, and how the terms work.
  value: Defina quién administra, quién se beneficia y cómo funcionan los términos.
sections.2.cards.0.title:
  source: Trustee
  value: Administrador
sections.2.cards.0.body:
  source: Choose the person or institution responsible for following the trust terms and name appropriate successors.
  value: Elija a la persona o institución responsable de cumplir con los términos del fideicomiso y designe a los sucesores apropiados.
sections.2.cards.1.title:
  source: Beneficiaries
  value: Beneficiarios
sections.2.cards.1.body:
  source: Identify who may benefit and under what circumstances distributions may be made.
  value: Identifique quién puede beneficiarse y bajo qué circunstancias se pueden realizar las distribuciones.
sections.2.cards.2.title:
  source: Property
  value: Bienes
sections.2.cards.2.body:
  source: Determine which assets should be transferred to or coordinated with the trust.
  value: Determine qué activos deben transferirse al fideicomiso o coordinarse con este.
sections.2.cards.3.title:
  source: Timing and purpose
  value: Plazos y propósito
sections.2.cards.3.body:
  source: Set a framework for when property may be used, distributed, or retained for future needs.
  value: Establezca un marco de referencia para cuándo los bienes pueden ser utilizados, distribuidos o retenidos para necesidades futuras.
sections.3.eyebrow:
  source: Who should consider a trust
  value: Quién debería considerar un fideicomiso
sections.3.title:
  source: Useful in the right plan—not automatically necessary in every plan.
  value: Útil en el plan adecuado; no es automáticamente necesario en todos los planes.
sections.3.bullets.0:
  source: Parents planning for minor children
  value: Padres que planifican para hijos menores de edad
sections.3.bullets.1:
  source: Families supporting a beneficiary who may need ongoing management
  value: Familias que apoyan a un beneficiario que puede necesitar administración continua
sections.3.bullets.2:
  source: Homeowners and people with property in more than one jurisdiction
  value: Propietarios de viviendas y personas con propiedades en más de una jurisdicción
sections.3.bullets.3:
  source: Blended families
  value: Familias reconstituidas
sections.3.bullets.4:
  source: Business owners
  value: Dueños de negocios
sections.3.bullets.5:
  source: People who want a successor structure for managing selected assets during incapacity
  value: Personas que desean una estructura sucesora para la gestión de activos seleccionados durante una incapacidad
sections.4.eyebrow:
  source: What happens without one
  value: Qué sucede si no se tiene uno
sections.4.title:
  source: The result depends on the rest of the plan.
  value: El resultado depende del resto del plan.
sections.4.body.0:
  source: A trust is not required for every estate. Without one, property may still pass through a will, beneficiary designation, joint ownership, or other legal arrangement.
  value: No se requiere un fideicomiso para todos los patrimonías. Sin uno, la propiedad aún puede transferirse a través de un testamento, designación de beneficiarios, propiedad conjunta u otro acuerdo legal.
sections.4.body.1:
  source: The practical question is whether those alternatives provide enough control, continuity, and coordination for your circumstances.
  value: La cuestión práctica es si esas alternativas proporcionan suficiente control, continuidad y coordinación para sus circunstancias.
sections.5.eyebrow:
  source: Common misconceptions
  value: Conceptos erróneos comunes
sections.5.title:
  source: A signed trust is only the beginning.
  value: Un fideicomiso firmado es solo el comienzo.
sections.5.cards.0.title:
  source: “Every family needs a trust.”
  value: “Toda familia necesita un fideicomiso”.
sections.5.cards.0.body:
  source: Some goals can be handled effectively through other documents and ownership arrangements.
  value: Algunos objetivos pueden manejarse eficazmente a través de otros documentos y acuerdos de propiedad.
sections.5.cards.1.title:
  source: “A trust works automatically once signed.”
  value: “Un fideicomiso funciona automáticamente una vez firmado”.
sections.5.cards.1.body:
  source: A trust generally must be funded or coordinated with the relevant assets to do the work it was designed to do.
  value: Por lo general, un fideicomiso debe ser financiado o coordinado con los activos pertinentes para cumplir la función para la cual fue diseñado.
sections.5.cards.2.title:
  source: “A trust replaces every other document.”
  value: “Un fideicomiso reemplaza a cualquier otro documento”.
sections.5.cards.2.body:
  source: Wills, powers of attorney, health care directives, and beneficiary designations may still be essential.
  value: Los testamentos, poderes notariales, directivas de atención médica y las designaciones de beneficiarios aún pueden ser esenciales.
sections.6.eyebrow:
  source: How it fits
  value: Cómo se integra
sections.6.title:
  source: Connect the trust to the will, titles, and beneficiary designations.
  value: Conecte el fideicomiso con el testamento, los títulos y las designaciones de beneficiarios.
sections.6.body.0:
  source: Trust planning is as much about coordination as drafting. The document, selected assets, ownership records, beneficiary designations, and the rest of the estate plan should point in the same direction.
  value: La planificación de fideicomisos consiste tanto en la coordinación como en la redacción. El documento, los activos seleccionados, los registros de propiedad, las designaciones de beneficiarios y el resto del plan de planificación patrimonial deben apuntar en la misma dirección.
sections.7.eyebrow:
  source: The Miranda Law process
  value: El proceso de Miranda Law
sections.7.title:
  source: From a first conversation to a finished document.
  value: Desde la primera conversación hasta el documento finalizado.
sections.7.steps.0.title:
  source: Schedule a Free Initial Consultation
  value: Programe una consulta inicial gratuita
sections.7.steps.0.body:
  source: Discuss your current documents, family, property, concerns, and goals.
  value: Analizamos sus documentos actuales, su familia, propiedades, inquietudes y objetivos.
sections.7.steps.1.title:
  source: Review the options
  value: Revise las opciones
sections.7.steps.1.body:
  source: Understand the purpose, limits, and decisions involved before choosing a direction.
  value: Comprenda el propósito, los límites y las decisiones involucradas antes de elegir un camino.
sections.7.steps.2.title:
  source: Prepare and review
  value: Prepare y revise
sections.7.steps.2.body:
  source: The firm drafts the document and reviews its terms with you in plain language.
  value: La firma redacta el documento y revisa sus términos con usted en un lenguaje sencillo.
sections.7.steps.3.title:
  source: Sign and finalize
  value: Firme y finalice
sections.7.steps.3.body:
  source: Complete the required formalities and understand how the document fits with the rest of the plan.
  value: Complete las formalidades requeridas y comprenda cómo el documento se integra con el resto del plan.
sections.8.eyebrow:
  source: Why work with Miranda Law
  value: Por qué trabajar con Miranda Law
sections.8.title:
  source: Personal guidance with accessible communication.
  value: Guía personalizada con comunicación accesible.
sections.8.bullets.0:
  source: Clear explanations centered on the decisions you need to make.
  value: Explicaciones claras centradas en las decisiones que usted debe tomar.
sections.8.bullets.1:
  source: Recommendations based on your family, assets, and goals.
  value: Recomendaciones basadas en su familia, activos y objetivos.
sections.8.bullets.2:
  source: Service in English, Spanish, and Portuguese.
  value: Servicio en inglés, español y portugués.
sections.8.bullets.3:
  source: Phone, text, and WhatsApp communication with the office.
  value: Comunicación con la oficina por teléfono, mensaje de texto y WhatsApp.
sections.8.bullets.4:
  source: A free initial consultation to understand the possible scope.
  value: Una consulta inicial gratuita para comprender el alcance posible.
faqs.0.question:
  source: What is the difference between a will and a trust?
  value: ¿Cuál es la diferencia entre un testamento y un fideicomiso?
faqs.0.answer:
  source: A will gives instructions for property governed by the will after death. A trust can hold and manage selected property under written terms during life, after death, or both.
  value: Un testamento proporciona instrucciones para los bienes regidos por este después del fallecimiento. Un fideicomiso puede mantener y administrar bienes seleccionados bajo términos escritos durante la vida, después de la muerte, o ambos.
faqs.1.question:
  source: Does a trust avoid probate?
  value: ¿Evita un fideicomiso el proceso de sucesión (probate)?
faqs.1.answer:
  source: Property properly held in a trust may be administered under the trust terms rather than through probate, but assets left outside the trust may follow a different path.
  value: Los bienes debidamente mantenidos en un fideicomiso pueden administrarse bajo los términos del fideicomiso en lugar de a través del proceso de sucesión; sin embargo, los activos que queden fuera del fideicomiso pueden seguir un camino diferente.
faqs.2.question:
  source: Can I change a trust?
  value: ¿Puedo cambiar un fideicomiso?
faqs.2.answer:
  source: That depends on the type of trust and its terms. Revocable and irrevocable trusts operate differently, so the document must be reviewed.
  value: Eso depende del tipo de fideicomiso y sus términos. Los fideicomisos revocables e irrevocables operan de manera diferente, por lo que el documento debe ser revisado.
faqs.3.question:
  source: Who should serve as trustee?
  value: ¿Quién debe actuar como fiduciario?
faqs.3.answer:
  source: The choice depends on the responsibility involved, the people affected, the complexity of the property, and the candidate's judgment and availability.
  value: La elección depende de la responsabilidad involucrada, las personas afectadas, la complejidad de los bienes y el juicio y la disponibilidad del candidato.
faqs.4.question:
  source: What does it mean to fund a trust?
  value: ¿Qué significa financiar un fideicomiso?
faqs.4.answer:
  source: Funding generally means transferring or coordinating selected assets so the trust can govern them. The necessary steps depend on the asset.
  value: Financiar generalmente significa transferir o coordinar activos seleccionados para que el fideicomiso pueda administrarlos. Los pasos necesarios dependen del activo.
