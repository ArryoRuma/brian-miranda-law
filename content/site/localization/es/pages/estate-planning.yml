entries:
  - path: title
    source: Estate Planning in North Jersey
    value: Planificación patrimonial en North Jersey
  - path: metaDescription
    source: Understand wills, trusts, powers of attorney, and health care directives with clear, multilingual estate-planning guidance from Miranda Law.
    value: Comprenda testamentos, fideicomisos, poderes notariales y directivas de atención médica con una guía clara y multilingüe sobre planificación patrimonial de Miranda Law.
  - path: hero.eyebrow
    source: Estate planning for North Jersey families
    value: Planificación patrimonial para familias de North Jersey
  - path: hero.title
    source: Make the important decisions
    value: Tome las decisiones importantes
  - path: hero.accent
    source: before someone else has to.
    value: antes de que alguien más tenga que hacerlo.
  - path: hero.lead
    source: A thoughtful estate plan brings your wishes, decision-makers, and essential documents into one clear framework. Miranda Law helps families build that framework in English, Spanish, and Portuguese.
    value: Un plan de planificación patrimonial reflexivo integra sus deseos, sus responsables de la toma de decisiones y los documentos esenciales en un marco claro. Miranda Law ayuda a las familias a construir ese marco en inglés, español y portugués.
  - path: hero.secondaryLabel
    source: Use the planning checklist
    value: Utilice la lista de verificación de planificación
  - path: sections.0.eyebrow
    source: Why planning matters
    value: Por qué es importante la planificación
  - path: sections.0.title
    source: Estate planning is about people as much as property.
    value: La planificación patrimonial trata tanto de las personas como de los bienes.
  - path: sections.0.body.0
    source: An estate plan can give the people you trust useful direction if you die or become unable to make decisions. It can also reduce the number of urgent choices your family must make during an already difficult time.
    value: Un plan de planificación patrimonial puede brindar una dirección útil a las personas en quienes usted confía en caso de que fallezca o no pueda tomar decisiones. También puede reducir el número de decisiones urgentes que su familia debe tomar durante un momento que ya es difícil.
  - path: sections.0.body.1
    source: The right documents depend on your family, assets, responsibilities, and goals. The work begins by understanding those facts—not by reaching for a one-size-fits-all package.
    value: Los documentos adecuados dependen de su familia, sus activos, sus responsabilidades y sus objetivos. El trabajo comienza por comprender esos hechos, no por recurrir a un paquete genérico.
  - path: sections.1.eyebrow
    source: What a plan can do
    value: Lo que un plan puede lograr
  - path: sections.1.title
    source: Put your decisions in writing.
    value: Ponga sus decisiones por escrito.
  - path: sections.1.bullets.0
    source: Explain how you want property handled after your death.
    value: Explique cómo desea que se manejen sus bienes después de su fallecimiento.
  - path: sections.1.bullets.1
    source: Nominate the people you want to manage your estate and carry out your instructions.
    value: Nomine a las personas que desea que administren su patrimonio y ejecuten sus instrucciones.
  - path: sections.1.bullets.2
    source: Choose someone to address financial and legal matters if you cannot act for yourself.
    value: Elija a alguien para que se encargue de los asuntos financieros y legales si usted no puede actuar por sí mismo.
  - path: sections.1.bullets.3
    source: Name a health care representative and communicate medical preferences.
    value: Nombre a un representante de atención médica y comunique sus preferencias médicas.
  - path: sections.1.bullets.4
    source: Create practical guidance for children, dependents, caregivers, and loved ones.
    value: Cree orientación práctica para hijos, dependientes, cuidadores y seres queridos.
  - path: sections.1.bullets.5
    source: Coordinate existing documents after marriage, divorce, a birth, a death, retirement, or a major financial change.
    value: Coordine los documentos existentes tras un matrimonio, divorcio, nacimiento, fallecimiento, jubilación o un cambio financiero importante.
  - path: sections.2.eyebrow
    source: Core documents
    value: Documentos principales
  - path: sections.2.title
    source: The pieces of a coordinated estate plan.
    value: Los elementos de un plan de planificación patrimonial coordinado.
  - path: sections.2.cards.0.title
    source: Wills
    value: Testamentos
  - path: sections.2.cards.0.body
    source: State how property should be distributed, nominate an executor, and document other important wishes.
    value: Establezca cómo debe distribuirse la propiedad, designe a un albacea y documente otros deseos importantes.
  - path: sections.2.cards.1.title
    source: Trusts
    value: Fideicomisos
  - path: sections.2.cards.1.body
    source: Create a structure for holding, managing, and transferring selected assets under written terms.
    value: Cree una estructura para mantener, administrar y transferir activos seleccionados bajo términos escritos.
  - path: sections.2.cards.2.title
    source: Powers of Attorney
    value: Poderes notariales
  - path: sections.2.cards.2.body
    source: Authorize a trusted person to handle defined financial or legal matters on your behalf.
    value: Autorice a una persona de confianza para que gestione asuntos financieros o legales definidos en su nombre.
  - path: sections.2.cards.3.title
    source: Health Care Directives
    value: Directivas de atención médica
  - path: sections.2.cards.3.body
    source: Choose a health care representative and communicate treatment preferences for a time when you cannot decide for yourself.
    value: Elija un representante de atención médica y comunique sus preferencias de tratamiento para un momento en el que no pueda decidir por sí mismo.
  - path: sections.3.eyebrow
    source: How it works together
    value: Cómo funciona en conjunto
  - path: sections.3.title
    source: Different questions call for different documents.
    value: Diferentes preguntas requieren diferentes documentos.
  - path: sections.3.cards.0.title
    source: Your wishes and property
    value: Sus deseos y su propiedad
  - path: sections.3.cards.0.body
    source: A will—and, when appropriate, a trust—can address how selected assets should be managed and transferred.
    value: Un testamento y, cuando sea apropiado, un fideicomiso, pueden abordar cómo deben administrarse y transferirse los activos seleccionados.
  - path: sections.3.cards.1.title
    source: Financial incapacity
    value: Incapacidad financiera
  - path: sections.3.cards.1.body
    source: A power of attorney can identify who may act for you and define the authority that person receives.
    value: Un poder notarial puede identificar quién puede actuar en su nombre y definir la autoridad que esa persona recibe.
  - path: sections.3.cards.2.title
    source: Medical incapacity
    value: Incapacidad médica
  - path: sections.3.cards.2.body
    source: A health care directive can identify your representative and preserve guidance about treatment decisions.
    value: Una directiva de atención médica puede identificar a su representante y preservar las instrucciones sobre decisiones de tratamiento.
  - path: sections.4.eyebrow
    source: Who planning is for
    value: Para quién es esta planificación
  - path: sections.4.title
    source: You do not need to be wealthy to need a plan.
    value: No es necesario tener grandes riquezas para necesitar un plan.
  - path: sections.4.bullets.0
    source: Parents and guardians of minor children
    value: Padres y tutores de menores de edad
  - path: sections.4.bullets.1
    source: Homeowners and people with financial accounts or personal property
    value: Propietarios de viviendas y personas con cuentas financieras o bienes personales
  - path: sections.4.bullets.2
    source: Married and unmarried couples
    value: Parejas casadas y no casadas
  - path: sections.4.bullets.3
    source: Business owners and independent professionals
    value: Dueños de negocios y profesionales independientes
  - path: sections.4.bullets.4
    source: People preparing for retirement
    value: Personas que se preparan para la jubilación
  - path: sections.4.bullets.5
    source: Adults helping parents or caring for other relatives
    value: Adultos que ayudan a sus padres o cuidan de otros familiares
  - path: sections.4.bullets.6
    source: Anyone whose family, health, assets, or responsibilities have recently changed
    value: Cualquier persona cuya familia, salud, activos o responsabilidades hayan cambiado recientemente
  - path: sections.5.eyebrow
    source: The Miranda Law process
    value: El proceso de Miranda Law
  - path: sections.5.title
    source: A practical route from questions to signed documents.
    value: Una ruta práctica desde las preguntas hasta los documentos firmados.
  - path: sections.5.steps.0.title
    source: Schedule a Free Initial Consultation
    value: Programe una consulta inicial gratuita
  - path: sections.5.steps.0.body
    source: Start with a conversation about your family, existing documents, concerns, and goals.
    value: Comience con una conversación sobre su familia, sus documentos actuales, sus preocupaciones y sus objetivos.
  - path: sections.5.steps.1.title
    source: Review the planning options
    value: Revise las opciones de planificación
  - path: sections.5.steps.1.body
    source: Brian explains the available approaches in plain language and identifies the questions that matter most.
    value: Brian explica los enfoques disponibles en lenguaje sencillo e identifica las preguntas más importantes.
  - path: sections.5.steps.2.title
    source: Prepare and review
    value: Prepare y revise
  - path: sections.5.steps.2.body
    source: The firm drafts the agreed documents and walks through what they mean before anything is finalized.
    value: La firma redacta los documentos acordados y explica su significado antes de que se finalice cualquier trámite.
  - path: sections.5.steps.3.title
    source: Sign and carry the plan forward
    value: Firme y ponga en marcha el plan
  - path: sections.5.steps.3.body
    source: Complete the required formalities, understand where documents should be kept, and know when a future review may be useful.
    value: Complete las formalidades requeridas, comprenda dónde deben guardarse los documentos y sepa cuándo puede ser útil una revisión futura.
  - path: sections.6.eyebrow
    source: Why Miranda Law
    value: Por qué Miranda Law
  - path: sections.6.title
    source: Clear guidance, responsive communication, and room for questions.
    value: Orientación clara, comunicación receptiva y espacio para sus preguntas.
  - path: sections.6.bullets.0
    source: Personalized recommendations based on your circumstances and goals.
    value: Recomendaciones personalizadas basadas en sus circunstancias y objetivos.
  - path: sections.6.bullets.1
    source: Service in English, Spanish, and Portuguese.
    value: Servicio en inglés, español y portugués.
  - path: sections.6.bullets.2
    source: Phone, text, and WhatsApp communication with the office.
    value: Comunicación con la oficina por teléfono, mensaje de texto y WhatsApp.
  - path: sections.6.bullets.3
    source: A North Jersey practice serving Monmouth County and communities north of it.
    value: Una práctica en North Jersey que sirve al condado de Monmouth y a las comunidades al norte del mismo.
  - path: sections.6.bullets.4
    source: A free initial consultation.
    value: Una consulta inicial gratuita.
  - path: faqs.0.question
    source: What documents are commonly included in an estate plan?
    value: ¿Qué documentos se incluyen comúnmente en un plan patrimonial?
  - path: faqs.0.answer
    source: Many plans include a will, a financial power of attorney, and one or more health care directives. A trust may be appropriate depending on the assets, family circumstances, and goals involved.
    value: Muchos planes incluyen un testamento, un poder notarial financiero y una o más directivas de atención médica. Un fideicomiso puede ser apropiado dependiendo de los activos, las circunstancias familiares y los objetivos involucrados.
  - path: faqs.1.question
    source: Do I need an estate plan if I am not wealthy?
    value: ¿Necesito un plan patrimonial si no tengo grandes bienes?
  - path: faqs.1.answer
    source: Estate planning also addresses decision-making, incapacity, children, personal property, and the people who may be asked to act for you. Those questions can matter at many income and asset levels.
    value: La planificación patrimonial también aborda la toma de decisiones, la incapacidad, los hijos, la propiedad personal y las personas a quienes se les podría pedir que actúen en su nombre. Esas preguntas pueden ser importantes en muchos niveles de ingresos y activos.
  - path: faqs.2.question
    source: How often should I review my plan?
    value: ¿Con qué frecuencia debo revisar mi plan?
  - path: faqs.2.answer
    source: A review can be useful after a marriage, divorce, birth, death, move, retirement, significant financial change, or change in the people you named. Periodic reviews can also confirm that the plan still reflects your wishes.
    value: Una revisión puede ser útil después de un matrimonio, divorcio, nacimiento, fallecimiento, mudanza, jubilación, cambio financiero significativo o un cambio en las personas que usted designó. Las revisiones periódicas también pueden confirmar que el plan aún refleja sus deseos.
  - path: faqs.3.question
    source: What happens during the first consultation?
    value: ¿Qué sucede durante la primera consulta?
  - path: faqs.3.answer
    source: The conversation focuses on your family, assets, existing documents, concerns, and goals. You do not need to arrive with every decision already made.
    value: La conversación se centra en su familia, activos, documentos existentes, inquietudes y objetivos. No es necesario que llegue con todas las decisiones ya tomadas.
  - path: faqs.4.question
    source: How much does estate planning cost?
    value: ¿Cuánto cuesta la planificación patrimonial?
  - path: faqs.4.answer
    source: Fees depend on the documents and complexity involved. Miranda Law discusses the recommended scope and fee before legal work begins.
    value: Los honorarios dependen de los documentos y la complejidad involucrada. Miranda Law analiza el alcance recomendado y los honorarios antes de que comience el trabajo legal.
  - path: faqs.5.question
    source: Can Miranda Law assist me in Spanish or Portuguese?
    value: ¿Puede Miranda Law asistirme en español o portugués?
  - path: faqs.5.answer
    source: Yes. Miranda Law communicates with clients in English, Spanish, and Portuguese.
    value: Sí. Miranda Law se comunica con los clientes en inglés, español y portugués.
