"Communications and deadlines": "Comunicações e prazos"
"Do not send confidential information until the firm confirms that it is appropriate to do so. Do not rely on an unconfirmed website, email, text, or voicemail communication to protect a filing date, court date, response period, or other deadline.": "Não envie informações confidenciais até que o escritório confirme que é apropriado fazê-lo. Não dependa de uma comunicação não confirmada via website, e-mail, texto ou mensagem de voz para proteger uma data de protocolo, data de audiência, período de resposta ou outro prazo."
"Jurisdiction and availability": "Jurisdição e disponibilidade"
