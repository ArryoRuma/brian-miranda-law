"This policy describes the general categories of information that may be processed through the Miranda Law website. It should be reviewed again when the secure intake, scheduling, analytics, and hosting services are finalized.": "Esta política descreve as categorias gerais de informações que podem ser processadas através do site da Miranda Law. Ela deve ser revisada novamente quando os serviços de triagem segura, agendamento, análise e hospedagem forem finalizados."
"Information you choose to provide": "Informações que você opta por fornecer"
"You may choose to provide contact information and a general description of your legal needs when communicating with the firm. Do not submit confidential, highly sensitive, or time-sensitive information until Miranda Law confirms that the communication method is appropriate and that the firm represents you.": "Ao comunicar-se com o escritório, você pode optar por fornecer informações de contato e uma descrição geral de suas necessidades jurídicas. Não envie informações confidenciaentes, altamente sensíveis ou urgentes até que a Miranda Law confirme que o método de comunicação é apropriado e que o escritório o representa."
"Website and analytics information": "Informações do site e de análise"
"The website and its service providers may process technical information such as browser type, device type, referring page, pages visited, approximate location, and interaction data for security, performance, and website improvement.": "O site e seus provedores de serviços podem processar informações técnicas, como tipo de navegador, tipo de dispositivo, página de referência, páginas visitadas, localização aproximada e dados de interação para fins de segurança, desempenho e melhoria do site."
