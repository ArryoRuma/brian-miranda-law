"Analytics": "Análise de dados"
"The website may use privacy-conscious analytics to understand aggregate traffic and page usage. The final analytics configuration and retention settings should be confirmed before launch.": "O website pode utilizar ferramentas de análise que respeitam a privacidade para compreender o tráfego agregado e o uso das páginas. A configuração final da análise e as definições de retenção devem ser confirmadas antes do lançamento."
"Managing browser storage": "Gerenciamento de armazenamento do navegador"
"Most browsers allow you to delete or block cookies and other stored website data. Those controls are available in the privacy or site-settings area of your browser.": "A maioria dos navegadores permite excluir ou bloquear cookies e outros dados armazenados do website. Esses controles estão disponíveis na área de privacidade ou de configurações do site do seu navegador."
"Updates": "Atualizações"
"This notice may be updated when the website's hosting, analytics, intake, or scheduling services change. The updated date above identifies the current version.": "Este aviso pode ser atualizado quando os serviços de hospedagem, análise, triagem ou agendamento do website forem alterados. A data de atualização acima identifica a versão atual."
"Read the Miranda Law website disclaimer concerning general information, attorney-client relationships, communications, and results.": "Leia o aviso legal do website da Miranda Law referente a informações gerais, relação advogado-cliente, comunicações e resultados."
"This website provides general information about Miranda Law and selected legal topics. It is not a substitute for advice from an attorney who has reviewed your circumstances.": "Este website fornece informações gerais sobre a Miranda Law e tópicos jurídicos selecionados. Ele não substitui o aconselhamento de um advogado que tenha analisado as suas circunstâncias."
"No legal advice": "Ausência de aconselhamento jurídico"
"Website content is educational and may not reflect every legal development, exception, deadline, or fact that could affect a matter. Do not act or refrain from acting solely because of information on this website.": "O conteúdo do website é educativo e pode não refletir todos os desenvolvimentos jurídicos, exceções, prazos ou fatos que possam afetar uma questão. Não tome decisões ou deixe de tomá-las baseando-se exclusivamente nas informações contidas neste website."
