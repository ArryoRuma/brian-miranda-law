"Respond to inquiries and help schedule consultations": "Responder a consultas e auxiliar no agendamento de consultas"
"Evaluate whether the firm can consider a matter": "Avaliar se o escritório pode considerar um caso"
"Operate, secure, and improve the website": "Operar, proteger e melhorar o site"
"Maintain records and comply with legal or professional obligations": "Manter registros e cumprir obrigações legais ou profissionais"
"Prevent misuse, fraud, or threats to the website and its users": "Prevenir uso indevido, fraude ou ameaças ao site e aos seus usuários"
