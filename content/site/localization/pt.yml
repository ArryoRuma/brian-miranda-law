"Cookies and similar browser technologies can help a website function, remember preferences, measure performance, and protect against misuse.": "Cookies e tecnologias semelhantes do navegador podem ajudar um site a funcionar, lembrar preferências, medir o desempenho e proteger contra uso indevido."
"Essential technologies": "Tecnologias essenciais"
