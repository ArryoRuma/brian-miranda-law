"Information may be processed by service providers that support hosting, communications, scheduling, analytics, security, or intake. Information may also be disclosed when required by law, court process, professional obligation, or a good-faith need to protect rights and safety.": "As informações podem ser processadas por provedores de serviços que dão suporte à hospedagem, comunicações, agendamento, análise, segurança ou triagem. As informações também podem ser divulgadas quando exigido por lei, processo judicial, obrigação profissional ou por uma necessidade de boa-fé para proteger direitos e a segurança."
"Questions and requests": "Dúvidas e solicitações"
