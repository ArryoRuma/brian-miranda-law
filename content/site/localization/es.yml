"Children, stepchildren, and anyone who depends on you": "Hijos, hijastros y cualquier persona que dependa de usted"
"People you may trust as executor, trustee, agent, or health care representative": "Personas en las que pueda confiar como albacea, fiduciario, agente o representante de atención médica"
"Backup choices if a first choice cannot serve": "Opciones de respaldo en caso de que la primera opción no pueda ejercer el cargo"
