"Business agreements or succession documents": "Acuerdos comerciales o documentos de sucesión"
"Any document you no longer understand or believe is out of date": "Cualquier documento que ya no comprenda o que considere que está desactualizado"
"Property and accounts": "Propiedades y cuentas"
"Homes, other real estate, and how each property is titled": "Casas, otros bienes raíces y la titularidad de cada propiedad"
"Bank, investment, and retirement accounts": "Cuentas bancarias, de inversión y de jubilación"
"Life insurance and current beneficiary designations": "Seguros de vida y designaciones actuales de beneficiarios"
"Business ownership, vehicles, and significant personal property": "Propiedad de negocios, vehículos y bienes personales significativos"
"Debts, mortgages, and other major obligations": "Deudas, hipotecas y otras obligaciones importantes"
"Your wishes": "Sus deseos"
"Who should receive property and whether any gifts need special handling": "Quién debe recibir los bienes y si algún legado requiere un manejo especial"
"Who should administer the estate": "Quién debe administrar el patrimonio"
"Who should care for minor children if a guardian is needed": "Quién debería cuidar de los hijos menores si se requiere un tutor"
"Whether property should be managed over time for a beneficiary": "Si una propiedad debe ser administrada a lo largo del tiempo para un beneficiario"
"Charitable gifts or personal items with special meaning": "Donaciones caritativas o artículos personales con un significado especial"
"Financial decision-making": "Toma de decisiones financieras"
"Who should handle financial and legal matters if you cannot": "Quién debería encargarse de los asuntos financieros y legales en caso de que usted no pueda hacerlo"
"What authority that person may need": "Qué autoridad podría necesitar esa persona"
"Who should serve as the backup agent": "Quién debería actuar como agente suplente"
"Any business, property, benefits, or family responsibilities the agent should understand": "Cualquier negocio, propiedad, beneficio o responsabilidad familiar que el agente deba conocer"
"Health care decisions": "Decisiones de atención médica"
"Who should serve as health care representative and alternate": "Quién debe actuar como representante de atención médica y suplente"
"Treatment preferences or values you want that person to understand": "Preferencias de tratamiento o valores que desea que esa persona comprenda"
"Physicians and family members who should receive a copy": "Médicos y familiares que deberían recibir una copia"
"Existing forms that may need review or replacement": "Formularios existentes que pueden requerir revisión o reemplazo"
"Questions for the consultation": "Preguntas para la consulta"
"What prompted you to consider planning now?": "¿Qué le motivó a considerar la planificación en este momento?"
"What are you most concerned could become confusing or difficult?": "¿Qué es lo que más le preocupa que pueda volverse confuso o difícil?"
"Are there family relationships or special needs the documents should account for?": "¿Existen relaciones familiares o necesidades especiales que los documentos deban contemplar?"
"Which decisions are you ready to make, and which ones still feel uncertain?": "¿Qué decisiones está listo para tomar y cuáles aún siente que son inciertas?"
"How soon do you need assistance?": "¿Con qué prontitud necesita asistencia?"
"You do not need to finish the checklist before calling.": "No es necesario completar la lista de verificación antes de llamar."
"A free initial consultation can help you decide what information matters and what can wait until later.": "Una consulta inicial gratuita puede ayudarle a decidir qué información es importante y qué puede esperar hasta más adelante."
