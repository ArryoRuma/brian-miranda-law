entries:
  - path: intro.eyebrow
    source: Free initial consultation
    value: Consulta inicial gratuita
  - path: intro.title
    source: Choose the easiest way to reach the office.
    value: Escolha a maneira mais fácil de entrar em contato com o escritório.
  - path: intro.body
    source: The legal team handles initial intake and scheduling. A first conversation helps the firm understand the general nature of your matter and determine an appropriate next step.
    value: A equipe jurídica é responsável pelo atendimento inicial e agendamento. Uma primeira conversa ajuda o escritório a entender a natureza geral do seu caso e a determinar o próximo passo apropriado.
  - path: intro.note
    source: Contacting the firm does not create an attorney-client relationship. Please do not send confidential or time-sensitive information until the firm confirms representation.
    value: Entrar em contato com o escritório não cria uma relação advogado-cliente. Por favor, não envie informações confidenciais ou urgentes até que o escritório confirme a representação.
  - path: optionValues.call
    source: 908-424-1011
    value: 908-424-1011
  - path: optionValues.text
    source: Send a text message
    value: Enviar uma mensagem de texto
  - path: optionValues.whatsapp
    source: Message on WhatsApp
    value: Mensagem no WhatsApp
  - path: office.eyebrow
    source: Warren office
    value: Escritório em Warren
  - path: office.title
    source: Meet by appointment in North Jersey.
    value: Reuniões mediante agendamento em North Jersey.
  - path: office.body
    source: Miranda Law primarily serves clients in Monmouth County and communities north of it. Contact the office to arrange a consultation.
    value: A Miranda Law atende principalmente clientes em Monmouth County e comunidades ao norte desta. Entre em contato com o escritório para agendar uma consulta.
