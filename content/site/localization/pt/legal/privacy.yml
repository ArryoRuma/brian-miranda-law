title:
  source: Privacy Policy
  value: Política de Privacidade
description:
  source: Read how Miranda Law may handle information submitted through this website and how to contact the firm with privacy questions.
  value: Leia como a Miranda Law pode tratar as informações enviadas por meio deste site e como entrar em contato com o escritório para dúvidas sobre privacidade.
updated:
  source: August 14, 2026
  value: 14 de agosto de 2026
intro:
  source: This policy describes the general categories of information that may be processed through the Miranda Law website. It should be reviewed again when the secure intake, scheduling, analytics, and hosting services are finalized.
  value: Esta política descreve as categorias gerais de informações que podem ser processadas através do site da Miranda Law. Ela deve ser revisada novamente quando os serviços de triagem segura, agendamento, análise e hospedagem forem finalizados.
sections.0.title:
  source: Information you choose to provide
  value: Informações que você opta por fornecer
sections.0.paragraphs.0:
  source: You may choose to provide contact information and a general description of your legal needs when communicating with the firm. Do not submit confidential, highly sensitive, or time-sensitive information until Miranda Law confirms that the communication method is appropriate and that the firm represents you.
  value: Ao comunicar-se com o escritório, você pode optar por fornecer informações de contato e uma descrição geral de suas necessidades jurídicas. Não envie informações confidenciaentes, altamente sensíveis ou urgentes até que a Miranda Law confirme que o método de comunicação é apropriado e que o escritório o representa.
sections.1.title:
  source: Website and analytics information
  value: Informações do site e de análise
sections.1.paragraphs.0:
  source: The website and its service providers may process technical information such as browser type, device type, referring page, pages visited, approximate location, and interaction data for security, performance, and website improvement.
  value: O site e seus provedores de serviços podem processar informações técnicas, como tipo de navegador, tipo de dispositivo, página de referência, páginas visitadas, localização aproximada e dados de interação para fins de segurança, desempenho e melhoria do site.
sections.2.title:
  source: How information may be used
  value: Como as informações podem ser utilizadas
sections.2.bullets.0:
  source: Respond to inquiries and help schedule consultations
  value: Responder a consultas e auxiliar no agendamento de consultas
sections.2.bullets.1:
  source: Evaluate whether the firm can consider a matter
  value: Avaliar se o escritório pode considerar um caso
sections.2.bullets.2:
  source: Operate, secure, and improve the website
  value: Operar, proteger e melhorar o site
sections.2.bullets.3:
  source: Maintain records and comply with legal or professional obligations
  value: Manter registros e cumprir obrigações legais ou profissionais
sections.2.bullets.4:
  source: Prevent misuse, fraud, or threats to the website and its users
  value: Prevenir uso indevido, fraude ou ameaças ao site e aos seus usuários
sections.3.title:
  source: Service providers and legal requirements
  value: Provedores de serviços e requisitos legais
sections.3.paragraphs.0:
  source: Information may be processed by service providers that support hosting, communications, scheduling, analytics, security, or intake. Information may also be disclosed when required by law, court process, professional obligation, or a good-faith need to protect rights and safety.
  value: As informações podem ser processadas por provedores de serviços que dão suporte à hospedagem, comunicações, agendamento, análise, segurança ou triagem. As informações também podem ser divulgadas quando exigido por lei, processo judicial, obrigação profissional ou por uma necessidade de boa-fé para proteger direitos e a segurança.
sections.4.title:
  source: Questions and requests
  value: Dúvidas e solicitações
sections.4.paragraphs.0:
  source: Questions about this policy may be sent to bmiranda@bmirandalaw.com. The availability of particular privacy rights depends on the law that applies to the request.
  value: Dúvidas sobre esta política podem ser enviadas para bmiranda@bmirandalaw.com. A disponibilidade de direitos de privacidade específicos depende da lei aplicável à solicitação.
