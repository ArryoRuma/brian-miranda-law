faq.items.0.question:
  source: Do I need an estate plan if I am not wealthy?
  value: Eu preciso de um plano patrimonial se não for rico?
faq.items.0.answer:
  source: Estate planning is not only about wealth. It can help you name decision-makers, document your wishes, prepare for incapacity, and make important matters clearer for the people you love.
  value: O planejamento patrimonial não trata apenas de riqueza. Ele pode ajudá-lo a nomear tomadores de decisão, documentar seus desejos, preparar-se para uma incapacidade e tornar questões importantes mais claras para as pessoas que você ama.
faq.items.1.question:
  source: What documents are commonly included in an estate plan?
  value: Quais documentos são comumente incluídos em um plano patrimonial?
faq.items.1.answer:
  source: Depending on your circumstances, an estate plan may include a will, trust, power of attorney, and healthcare directive. We’ll help you understand which documents make sense for your situation.
  value: Dependendo das suas circunstâncias, um plano patrimonial pode incluir um testamento, trust (fideicomisso), procuração e diretiva de cuidados de saúde. Nós ajudaremos você a entender quais documentos fazem sentido para a sua situação.
faq.items.2.question:
  source: How much does estate planning cost?
  value: Quanto custa o planejamento patrimonial?
faq.items.2.answer:
  source: The cost depends on the documents and complexity involved. After your free initial consultation, we’ll explain what your situation requires and the associated fees before moving forward.
  value: O custo depende dos documentos e da complexidade envolvida. Após sua consulta inicial gratuita, explicaremos o que sua situação exige e as taxas associadas antes de prosseguirmos.
faq.items.3.question:
  source: What happens during the initial consultation?
  value: O que acontece durante a consulta inicial?
faq.items.3.answer:
  source: We’ll learn about your family, priorities, property, existing documents, and questions, then explain the options that may fit your goals. You do not need to arrive with every decision already made.
  value: Conheceremos sua família, prioridades, propriedades, documentos existentes e dúvidas, para então explicar as opções que podem se adequar aos seus objetivos. Você não precisa chegar com todas as decisões já tomadas.
faq.items.4.question:
  source: Can Miranda Law assist me in Spanish or Portuguese?
  value: A Miranda Law pode me atender em espanhol ou português?
faq.items.4.answer:
  source: Yes. Miranda Law serves clients in English, Spanish, and Portuguese so you can discuss important legal decisions in the language you’re most comfortable using.
  value: Sim. A Miranda Law atende clientes em inglês, espanhol e português, para que você possa discutir decisões jurídicas importantes no idioma com o qual se sente mais confortável.
faq.items.5.question:
  source: Does Miranda Law offer virtual consultations?
  value: A Miranda Law oferece consultas virtuais?
faq.items.5.answer:
  source: Consultation formats may depend on your circumstances. Contact Miranda Law to ask whether a virtual consultation is available for your matter.
  value: Os formatos de consulta podem depender das suas circunstâncias. Entre em contato com a Miranda Law para verificar se uma consulta virtual está disponível para o seu caso.
