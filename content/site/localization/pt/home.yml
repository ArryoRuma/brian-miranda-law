intro.eyebrow:
  source: Estate planning
  value: Planejamento patrimonial
intro.title:
  source: You Know You Should Have a Plan. You Just Haven’t Gotten Around to It.
  value: Você sabe que precisa de um plano. Você apenas ainda não teve oportunidade de fazê-lo.
intro.paragraphs.0:
  source: Maybe you’ve been meaning to make a will.
  value: Talvez você estivesse pretendendo fazer um testamento.
intro.paragraphs.1:
  source: Maybe you recently bought a home, had children, got married, or started thinking more seriously about retirement.
  value: Talvez você tenha comprado uma casa recentemente, tido filhos, se casado ou começado a pensar mais seriamente sobre a aposentadoria.
intro.paragraphs.2:
  source: Or maybe you’re simply not sure which documents you actually need.
  value: Ou talvez você simplesmente não tenha certeza de quais documentos realmente são necessários.
intro.paragraphs.3:
  source: You don’t have to figure it out yourself.
  value: Você não precisa descobrir tudo sozinho.
intro.paragraphs.4:
  source: Miranda Law helps New Jersey families create straightforward estate plans designed to protect the people they love and make their wishes clear.
  value: A Miranda Law ajuda as famílias de New Jersey a criar planos de planejamento patrimonial simplificados, projetados para proteger as pessoas que você ama e tornar seus desejos claros.
intro.ctaLabel:
  source: Start Your Estate Plan
  value: Inicie Seu Planejamento Patrimonial
