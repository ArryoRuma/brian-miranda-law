why.title:
  source: Estate Planning Doesn’t Have to Feel Complicated.
  value: O Planejamento Patrimonial não precisa ser complicado.
why.body:
  source: The goal isn’t to hand you a stack of legal documents. It’s to help you understand your options, make the right decisions for your family, and leave with a plan you feel confident about.
  value: Nosso objetivo não é entregar um monte de documentos jurídicos. É ajudar você a compreender suas opções, tomar as decisões corretas para sua família e sair com um plano em que você se sinta confiante.
