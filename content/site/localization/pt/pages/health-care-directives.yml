title:
  source: Health Care Directives in North Jersey
  value: Diretivas de Cuidados de Saúde em North Jersey
metaDescription:
  source: Learn how New Jersey health care directives can name a representative and communicate treatment preferences if you cannot decide for yourself.
  value: Saiba como as diretivas de cuidados de saúde de New Jersey podem nomear um representante e comunicar preferências de tratamento caso você não possa decidir por si mesmo.
hero.eyebrow:
  source: Health Care Directives
  value: Diretivas de Cuidados de Saúde
hero.title:
  source: Give the people you trust
  value: Ofereça às pessoas em quem você confia
hero.accent:
  source: clearer medical guidance.
  value: orientações médicas mais claras.
hero.lead:
  source: A health care directive can name a representative to make health care decisions if you become unable to decide and can record preferences that help guide difficult conversations.
  value: Uma diretiva de cuidados de saúde pode nomear um representante para tomar decisões médicas caso você fique impossibilitado de decidir, além de registrar preferências que auxiliem em conversas difíceis.
hero.secondaryLabel:
  source: See the complete estate plan
  value: Veja o planejamento patrimonial completo
sections.0.eyebrow:
  source: What is a health care directive?
  value: O que é uma diretiva de cuidados de saúde?
sections.0.title:
  source: A written plan for medical decision-making during incapacity.
  value: Um plano por escrito para a tomada de decisões médicas durante períodos de incapacidade.
sections.0.body.0:
  source: New Jersey recognizes a proxy directive, which names a health care representative, and an instruction directive, often called a living will, which communicates treatment preferences.
  value: New Jersey reconhece a diretiva de procurador (proxy directive), que nomeia um representante de cuidados de saúde, e a diretiva de instrução, frequentemente chamada de testamento vital (living will), que comunica preferências de tratamento.
sections.0.body.1:
  source: The representative's authority is intended for a time when you cannot make your own health care decisions. While you remain able to decide, your own decisions control.
  value: A autoridade do representante é destinada ao momento em que você não puder tomar suas próprias decisões de saúde. Enquanto você estiver apto a decidir, suas próprias decisões prevalecerão.
sections.1.eyebrow:
  source: Why you may need one
  value: Por que você pode precisar de um
sections.1.title:
  source: Make the conversation easier before a crisis.
  value: Facilite a conversa antes de uma crise.
sections.1.bullets.0:
  source: You want to choose who should speak with physicians and make decisions if you cannot.
  value: Você deseja escolher quem deve falar com médicos e tomar decisões caso você não possa fazê-lo.
sections.1.bullets.1:
  source: You want to name an alternate representative.
  value: Você deseja nomear um representante substituto.
sections.1.bullets.2:
  source: You have treatment preferences or values you want your representative to understand.
  value: Você possui preferências de tratamento ou valores que deseja que seu representante compreenda.
sections.1.bullets.3:
  source: You want family members and medical providers to have written guidance.
  value: Você deseja que familiares e profissionais médicos tenham orientações por escrito.
sections.1.bullets.4:
  source: You have an older directive that names the wrong person or no longer reflects your wishes.
  value: Você possui uma diretiva antiga que nomeia a pessoa errada ou que não reflete mais seus desejos.
sections.1.bullets.5:
  source: You are preparing for surgery, managing a health condition, or completing a broader estate plan.
  value: Você está se preparando para uma cirurgia, tratando uma condição de saúde ou concluindo um planejamento patrimonial mais amplo.
sections.2.eyebrow:
  source: What you can decide
  value: O que você pode decidir
sections.2.title:
  source: Choose a representative and communicate what matters to you.
  value: Escolha um representante e comunique o que é importante para você.
sections.2.cards.0.title:
  source: Health care representative
  value: Representante de cuidados de saúde
sections.2.cards.0.body:
  source: Name the person authorized to make health care decisions if you are unable to do so.
  value: Nomeie a pessoa autorizada a tomar decisões de cuidados de saúde caso você não possa fazê-lo.
sections.2.cards.1.title:
  source: Alternate representative
  value: Representante substituto
sections.2.cards.1.body:
  source: Choose a backup if the first person is unable, unwilling, or unavailable to serve.
  value: Escolha um reserva caso a primeira pessoa esteja impossibilitada, indisposta ou indisponível para exercer a função.
sections.2.cards.2.title:
  source: Treatment preferences
  value: Preferências de tratamento
sections.2.cards.2.body:
  source: Provide guidance about treatments, life-sustaining measures, and the values that should shape decisions.
  value: Forneça orientações sobre tratamentos, medidas de suporte à vida e os valores que devem nortear as decisões.
sections.2.cards.3.title:
  source: People who receive copies
  value: Pessoas que recebem cópias
sections.2.cards.3.body:
  source: Plan how representatives, family members, physicians, and health care facilities can access the directive when needed.
  value: Planeje como representantes, familiares, médicos e instituições de saúde podem acessar a diretiva quando necessário.
sections.3.eyebrow:
  source: Who should consider one
  value: Quem deve considerar uma
sections.3.title:
  source: Advance directives are not only for older adults.
  value: As diretivas antecipadas não são destinadas apenas a idosos.
sections.3.bullets.0:
  source: Any adult who wants to choose a health care representative
  value: Qualquer adulto que deseje escolher um representante para cuidados de saúde
sections.3.bullets.1:
  source: People preparing for surgery or managing an illness
  value: Pessoas em preparação para cirurgia ou tratando uma doença
sections.3.bullets.2:
  source: Parents, caregivers, and adults with family responsibilities
  value: Pais, cuidadores e adultos com responsabilidades familiares
sections.3.bullets.3:
  source: People whose relatives disagree about medical decisions
  value: Pessoas cujos parentes discordam sobre decisões médicas
sections.3.bullets.4:
  source: Adults whose closest trusted person may not otherwise be the obvious decision-maker
  value: Adultos cuja pessoa de confiança mais próxima possa não ser, de outra forma, o tomador de decisão óbvio
sections.3.bullets.5:
  source: Anyone completing or updating an estate plan
  value: Qualquer pessoa que esteja concluindo ou atualizando um planejamento patrimonial
sections.4.eyebrow:
  source: What happens without one
  value: O que acontece sem um
sections.4.title:
  source: Loved ones may be left without your written choice or instructions.
  value: Seus entes queridos podem ficar sem sua escolha ou instruções por escrito.
sections.4.body.0:
  source: Without a directive, medical providers and family members may have to determine who should participate in decisions and what you would have wanted without the benefit of your written guidance.
  value: Sem uma diretiva, os profissionais médicos e familiares podem ter que determinar quem deve participar das decisões e o que você desejaria, sem o benefício de suas orientações por escrito.
sections.4.body.1:
  source: A directive cannot anticipate every medical circumstance, but it can identify the person you trust and give that person a clearer understanding of your values.
  value: Uma diretiva não pode antecipar todas as circunstâncias médicas, mas pode identificar a pessoa em quem você confia e proporcionar a essa pessoa uma compreensão mais clara de seus valores.
sections.5.eyebrow:
  source: Common misconceptions
  value: Equívocos comuns
sections.5.title:
  source: The document protects your voice; it does not replace it.
  value: O documento protege sua voz; ele não a substitui.
sections.5.cards.0.title:
  source: “My representative decides while I still can.”
  value: “Meu representante decide enquanto eu ainda posso.”
sections.5.cards.0.body:
  source: Your representative acts only when you are unable to make your own health care decisions under the applicable standard.
  value: Seu representante atuará apenas quando você não for capaz de tomar suas próprias decisões de cuidados de saúde sob o padrão aplicável.
sections.5.cards.1.title:
  source: “A directive is only about end-of-life care.”
  value: “Uma diretiva trata apenas de cuidados de fim de vida.”
sections.5.cards.1.body:
  source: A proxy directive can address health care decision-making more broadly during incapacity.
  value: Uma diretiva de procuração pode abordar a tomada de decisões de cuidados de saúde de forma mais ampla durante um período de incapacidade.
sections.5.cards.2.title:
  source: “Completing the form ends the conversation.”
  value: “Preencher o formulário encerra a conversa.”
sections.5.cards.2.body:
  source: Discussing your values with the representative and sharing accessible copies are important parts of the plan.
  value: Discutir seus valores com o representante e compartilhar cópias acessíveis são partes importantes do planejamento.
sections.6.eyebrow:
  source: How it fits
  value: Como tudo se integra
sections.6.title:
  source: Coordinate medical and financial decision-makers.
  value: Coordene os tomadores de decisões médicas e financeiras.
sections.6.body.0:
  source: A health care representative addresses medical decisions, while an agent under a financial power of attorney may handle bills, insurance, accounts, and other practical matters. Both roles may be needed during the same period.
  value: Um representante de cuidados de saúde trata de decisões médicas, enquanto um agente sob uma procuração financeira pode lidar com contas, seguros, contas bancárias e outros assuntos práticos. Ambos os papéis podem ser necessários durante o mesmo período.
sections.7.eyebrow:
  source: The Miranda Law process
  value: O processo da Miranda Law
sections.7.title:
  source: From a first conversation to a finished document.
  value: Da primeira conversa ao documento finalizado.
sections.7.steps.0.title:
  source: Schedule a Free Initial Consultation
  value: Agende uma Consulta Inicial Gratuita
sections.7.steps.0.body:
  source: Discuss your current documents, family, property, concerns, and goals.
  value: Discutiremos seus documentos atuais, família, propriedades, preocupações e objetivos.
sections.7.steps.1.title:
  source: Review the options
  value: Analise as opções
sections.7.steps.1.body:
  source: Understand the purpose, limits, and decisions involved before choosing a direction.
  value: Compreenda o propósito, os limites e as decisões envolvidas antes de escolher um caminho.
sections.7.steps.2.title:
  source: Prepare and review
  value: Prepare e revise
sections.7.steps.2.body:
  source: The firm drafts the document and reviews its terms with you in plain language.
  value: O escritório redige o documento e revisa seus termos com você em linguagem clara e acessível.
sections.7.steps.3.title:
  source: Sign and finalize
  value: Assine e finalize
sections.7.steps.3.body:
  source: Complete the required formalities and understand how the document fits with the rest of the plan.
  value: Conclua as formalidades necessárias e compreenda como o documento se integra ao restante do planejamento patrimonial.
sections.8.eyebrow:
  source: Why work with Miranda Law
  value: Por que trabalhar com a Miranda Law
sections.8.title:
  source: Personal guidance with accessible communication.
  value: Orientação personalizada com comunicação acessível.
sections.8.bullets.0:
  source: Clear explanations centered on the decisions you need to make.
  value: Explicações claras focadas nas decisões que você precisa tomar.
sections.8.bullets.1:
  source: Recommendations based on your family, assets, and goals.
  value: Recomendações baseadas em sua família, patrimônio e objetivos.
sections.8.bullets.2:
  source: Service in English, Spanish, and Portuguese.
  value: Atendimento em inglês, espanhol e português.
sections.8.bullets.3:
  source: Phone, text, and WhatsApp communication with the office.
  value: Comunicação via telefone, SMS e WhatsApp com o escritório.
sections.8.bullets.4:
  source: A free initial consultation to understand the possible scope.
  value: Uma consulta inicial gratuita para entender o possível escopo.
faqs.0.question:
  source: What is the difference between a proxy directive and a living will?
  value: Qual é a diferença entre uma diretiva de procurador e um testamento vital?
faqs.0.answer:
  source: A proxy directive names a health care representative. An instruction directive, often called a living will, records treatment preferences. A person may use one or both.
  value: Uma diretiva de procurador nomeia um representante de cuidados de prestação de saúde. Uma diretiva de instrução, frequentemente chamada de testamento vital, registra preferências de tratamento. Uma pessoa pode utilizar apenas uma ou ambas.
faqs.1.question:
  source: When can my representative make decisions?
  value: Quando meu representante pode tomar decisões?
faqs.1.answer:
  source: The representative acts when you have been determined unable to make your own health care decisions under the applicable process. If you regain capacity, your own decisions control again.
  value: O representante atua quando for determinado que você não tem capacidade para tomar suas próprias decisões de cuidados de saúde, conforme o processo aplicável. Se você recuperar a capacidade, suas próprias decisões voltam a prevalecer.
faqs.2.question:
  source: Who should receive a copy?
  value: Quem deve receber uma cópia?
faqs.2.answer:
  source: Consider providing copies to the primary and alternate representatives, appropriate family members, physicians, and health care facilities involved in your care.
  value: Considere fornecer cópias aos representantes principal e substituto, familiares apropriados, médicos e instituições de saúde envolvidas em seu atendimento.
faqs.3.question:
  source: Can I change my directive?
  value: Posso alterar minha diretiva?
faqs.3.answer:
  source: A person with capacity can generally update or revoke a directive. New copies should be shared so older instructions are not used by mistake.
  value: Uma pessoa com capacidade pode, geralmente, atualizar ou revogar uma diretiva. Novas cópias devem ser compartilhadas para que instruções antigas não sejam utilizadas por engano.
faqs.4.question:
  source: Is a POLST the same as an advance directive?
  value: Um POLST é o mesmo que uma diretiva antecipada?
faqs.4.answer:
  source: No. A POLST is a medical order used in particular serious-illness circumstances. It can complement, but does not automatically replace, an advance directive.
  value: Não. Um POLST é uma ordem médica utilizada em circunstâncias particulares de doenças graves. Ele pode complementar, mas não substitui automaticamente, uma diretiva antecipada.
