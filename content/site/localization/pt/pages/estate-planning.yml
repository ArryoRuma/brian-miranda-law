title:
  source: Estate Planning in North Jersey
  value: Planejamento Patrimonial no North Jersey
metaDescription:
  source: Understand wills, trusts, powers of attorney, and health care directives with clear, multilingual estate-planning guidance from Miranda Law.
  value: Entenda testamentos, trust (fideicomisso), procurações e diretivas de cuidados de saúde com orientações claras e multilíngues sobre planejamento patrimonial da Miranda Law.
hero.eyebrow:
  source: Estate planning for North Jersey families
  value: Planejamento patrimonial para famílias do North Jersey
hero.title:
  source: Make the important decisions
  value: Tome as decisões importantes
hero.accent:
  source: before someone else has to.
  value: antes que outra pessoa precise tomá-las.
hero.lead:
  source: A thoughtful estate plan brings your wishes, decision-makers, and essential documents into one clear framework. Miranda Law helps families build that framework in English, Spanish, and Portuguese.
  value: Um planejamento patrimonial cuidadoso reúne seus desejos, tomadores de decisão e documentos essenciais em uma estrutura clara. A Miranda Law ajuda as famílias a construir essa estrutura em inglês, espanhol e português.
hero.secondaryLabel:
  source: Use the planning checklist
  value: Use o checklist de planejamento
sections.0.eyebrow:
  source: Why planning matters
  value: Por que o planejamento é importante
sections.0.title:
  source: Estate planning is about people as much as property.
  value: O planejamento patrimonial trata tanto de pessoas quanto de bens.
sections.0.body.0:
  source: An estate plan can give the people you trust useful direction if you die or become unable to make decisions. It can also reduce the number of urgent choices your family must make during an already difficult time.
  value: Um planejamento patrimonial pode fornecer uma orientação útil às pessoas em quem você confia, caso você faleça ou se torne incapaz de tomar decisões. Também pode reduzir o número de escolhas urgentes que sua família precisará fazer durante um período que já é difícil por si só.
sections.0.body.1:
  source: The right documents depend on your family, assets, responsibilities, and goals. The work begins by understanding those facts—not by reaching for a one-size-fits-all package.
  value: Os documentos corretos dependem da sua família, bens, responsabilidades e objetivos. O trabalho começa pela compreensão desses fatos — e não pela busca por um pacote padronizado.
sections.1.eyebrow:
  source: What a plan can do
  value: O que um plano pode fazer
sections.1.title:
  source: Put your decisions in writing.
  value: Registre suas decisões por escrito.
sections.1.bullets.0:
  source: Explain how you want property handled after your death.
  value: Explique como deseja que seus bens sejam administrados após o seu falecimento.
sections.1.bullets.1:
  source: Nominate the people you want to manage your estate and carry out your instructions.
  value: Nomeie as pessoas que você deseja que administrem seu espólio e cumpram suas instruções.
sections.1.bullets.2:
  source: Choose someone to address financial and legal matters if you cannot act for yourself.
  value: Escolha alguém para tratar de questões financeiras e jurídicas caso você não possa agir por si mesmo.
sections.1.bullets.3:
  source: Name a health care representative and communicate medical preferences.
  value: Nomeie um representante de cuidados de saúde e comunique suas preferências médicas.
sections.1.bullets.4:
  source: Create practical guidance for children, dependents, caregivers, and loved ones.
  value: Crie orientações práticas para filhos, dependentes, cuidadores e entes queridos.
sections.1.bullets.5:
  source: Coordinate existing documents after marriage, divorce, a birth, a death, retirement, or a major financial change.
  value: Coordene os documentos existentes após casamento, divórcio, nascimento, falecimento, aposentadoria ou uma mudança financeira significativa.
sections.2.eyebrow:
  source: Core documents
  value: Documentos essenciais
sections.2.title:
  source: The pieces of a coordinated estate plan.
  value: As partes de um planejamento patrimonial coordenado.
sections.2.cards.0.title:
  source: Wills
  value: Testamentos
sections.2.cards.0.body:
  source: State how property should be distributed, nominate an executor, and document other important wishes.
  value: Declare como os bens devem ser distribuídos, nomeie um executor e documente outros desejos importantes.
sections.2.cards.1.title:
  source: Trusts
  value: Trust (Fideicomisso)
sections.2.cards.1.body:
  source: Create a structure for holding, managing, and transferring selected assets under written terms.
  value: Crie uma estrutura para manter, gerir e transferir ativos selecionados sob termos escritos (fideicomisso/trust).
sections.2.cards.2.title:
  source: Powers of Attorney
  value: Procurações
sections.2.cards.2.body:
  source: Authorize a trusted person to handle defined financial or legal matters on your behalf.
  value: Autorize uma pessoa de confiança para tratar de questões financeiras ou jurídicas definidas em seu nome.
sections.2.cards.3.title:
  source: Health Care Directives
  value: Diretivas de Cuidados de Saúde
sections.2.cards.3.body:
  source: Choose a health care representative and communicate treatment preferences for a time when you cannot decide for yourself.
  value: Escolha um representante de cuidados de saúde e comunique suas preferências de tratamento para um período em que você não possa decidir por si mesmo.
sections.3.eyebrow:
  source: How it works together
  value: Como tudo funciona em conjunto
sections.3.title:
  source: Different questions call for different documents.
  value: Diferentes questões exigem diferentes documentos.
sections.3.cards.0.title:
  source: Your wishes and property
  value: Seus desejos e bens
sections.3.cards.0.body:
  source: A will—and, when appropriate, a trust—can address how selected assets should be managed and transferred.
  value: Um testamento — e, quando apropriado, um trust (fideicomisso) — pode tratar de como ativos selecionados devem ser administrados e transferidos.
sections.3.cards.1.title:
  source: Financial incapacity
  value: Incapacidade financeira
sections.3.cards.1.body:
  source: A power of attorney can identify who may act for you and define the authority that person receives.
  value: Uma procuração pode identificar quem pode agir por você e definir a autoridade que essa pessoa recebe.
sections.3.cards.2.title:
  source: Medical incapacity
  value: Incapacidade médica
sections.3.cards.2.body:
  source: A health care directive can identify your representative and preserve guidance about treatment decisions.
  value: Uma diretiva de cuidados de saúde pode identificar seu representante e preservar orientações sobre decisões de tratamento.
sections.4.eyebrow:
  source: Who planning is for
  value: Para quem é o planejamento
sections.4.title:
  source: You do not need to be wealthy to need a plan.
  value: Você não precisa ser rico para precisar de um plano.
sections.4.bullets.0:
  source: Parents and guardians of minor children
  value: Pais e tutores de menores de idade
sections.4.bullets.1:
  source: Homeowners and people with financial accounts or personal property
  value: Proprietários de imóveis e pessoas com contas financeiras ou bens pessoais
sections.4.bullets.2:
  source: Married and unmarried couples
  value: Casais casados e não casados
sections.4.bullets.3:
  source: Business owners and independent professionals
  value: Proprietários de empresas e profissionais autônomos
sections.4.bullets.4:
  source: People preparing for retirement
  value: Pessoas que estão se preparando para a aposentadoria
sections.4.bullets.5:
  source: Adults helping parents or caring for other relatives
  value: Adultos que auxiliam pais ou cuidam de outros parentes
sections.4.bullets.6:
  source: Anyone whose family, health, assets, or responsibilities have recently changed
  value: Qualquer pessoa cuja família, saúde, patrimônio ou responsabilidades tenham mudado recentemente
sections.5.eyebrow:
  source: The Miranda Law process
  value: O processo da Miranda Law
sections.5.title:
  source: A practical route from questions to signed documents.
  value: Um caminho prático, das perguntas aos documentos assinados.
sections.5.steps.0.title:
  source: Schedule a Free Initial Consultation
  value: Agende uma Consulta Inicial Gratuita
sections.5.steps.0.body:
  source: Start with a conversation about your family, existing documents, concerns, and goals.
  value: Comece com uma conversa sobre sua família, documentos existentes, preocupações e objetivos.
sections.5.steps.1.title:
  source: Review the planning options
  value: Revise as opções de planejamento
sections.5.steps.1.body:
  source: Brian explains the available approaches in plain language and identifies the questions that matter most.
  value: Brian explica as abordagens disponíveis em linguagem clara e identifica as perguntas mais importantes.
sections.5.steps.2.title:
  source: Prepare and review
  value: Prepare e revise
sections.5.steps.2.body:
  source: The firm drafts the agreed documents and walks through what they mean before anything is finalized.
  value: O escritório redige os documentos acordados e explica o significado de cada um antes que tudo seja finalizado.
sections.5.steps.3.title:
  source: Sign and carry the plan forward
  value: Assine e dê continuidade ao plano
sections.5.steps.3.body:
  source: Complete the required formalities, understand where documents should be kept, and know when a future review may be useful.
  value: Conclua as formalidades necessárias, entenda onde os documentos devem ser guardados e saiba quando uma revisão futura poderá ser útil.
sections.6.eyebrow:
  source: Why Miranda Law
  value: Por que escolher a Miranda Law
sections.6.title:
  source: Clear guidance, responsive communication, and room for questions.
  value: Orientação clara, comunicação ágil e espaço para suas dúvidas.
sections.6.bullets.0:
  source: Personalized recommendations based on your circumstances and goals.
  value: Recomendações personalizadas com base em suas circunstâncias e objetivos.
sections.6.bullets.1:
  source: Service in English, Spanish, and Portuguese.
  value: Atendimento em inglês, espanhol e português.
sections.6.bullets.2:
  source: Phone, text, and WhatsApp communication with the office.
  value: Comunicação via telefone, SMS e WhatsApp com o escritório.
sections.6.bullets.3:
  source: A North Jersey practice serving Monmouth County and communities north of it.
  value: Uma prática em North Jersey atendendo ao condado de Monmouth e comunidades ao norte deste.
sections.6.bullets.4:
  source: A free initial consultation.
  value: Uma consulta inicial gratuita.
faqs.0.question:
  source: What documents are commonly included in an estate plan?
  value: Quais documentos são comumente incluídos em um plano patrimonial?
faqs.0.answer:
  source: Many plans include a will, a financial power of attorney, and one or more health care directives. A trust may be appropriate depending on the assets, family circumstances, and goals involved.
  value: Muitos planos incluem um testamento, uma procuração financeira e uma ou mais diretivas de cuidados de saúde. Um trust (fideicomisso) pode ser apropriado dependendo dos ativos, das circunstâncias familiares e dos objetivos envolvidos.
faqs.1.question:
  source: Do I need an estate plan if I am not wealthy?
  value: Eu preciso de um plano patrimonial se não for rico?
faqs.1.answer:
  source: Estate planning also addresses decision-making, incapacity, children, personal property, and the people who may be asked to act for you. Those questions can matter at many income and asset levels.
  value: O planejamento patrimonial também aborda tomada de decisão, incapacidade, filhos, bens pessoais e as pessoas que podem ser solicitadas a agir em seu nome. Essas questões podem ser importantes em diversos níveis de renda e patrimônio.
faqs.2.question:
  source: How often should I review my plan?
  value: Com que frequência devo revisar meu plano?
faqs.2.answer:
  source: A review can be useful after a marriage, divorce, birth, death, move, retirement, significant financial change, or change in the people you named. Periodic reviews can also confirm that the plan still reflects your wishes.
  value: Uma revisão pode ser útil após um casamento, divórcio, nascimento, morte, mudança, aposentadoria, alteração financeira significativa ou mudança nas pessoas designadas por você. Revisões periódicas também podem confirmar se o plano ainda reflete seus desejos.
faqs.3.question:
  source: What happens during the first consultation?
  value: O que acontece durante a primeira consulta?
faqs.3.answer:
  source: The conversation focuses on your family, assets, existing documents, concerns, and goals. You do not need to arrive with every decision already made.
  value: A conversa foca em sua família, ativos, documentos existentes, preocupações e objetivos. Você não precisa comparecer com todas as decisões já tomadas.
faqs.4.question:
  source: How much does estate planning cost?
  value: Quanto custa o planejamento patrimonial?
faqs.4.answer:
  source: Fees depend on the documents and complexity involved. Miranda Law discusses the recommended scope and fee before legal work begins.
  value: Os honorários dependem dos documentos e da complexidade envolvida. A Miranda Law discute o escopo recomendado e os honorários antes do início do trabalho jurídico.
faqs.5.question:
  source: Can Miranda Law assist me in Spanish or Portuguese?
  value: A Miranda Law pode me atender em espanhol ou português?
faqs.5.answer:
  source: Yes. Miranda Law communicates with clients in English, Spanish, and Portuguese.
  value: Sim. A Miranda Law comunica-se com os clientes em inglês, espanhol e português.
