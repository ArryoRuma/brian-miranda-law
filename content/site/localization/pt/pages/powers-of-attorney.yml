title:
  source: Powers of Attorney in North Jersey
  value: Procurações em North Jersey
metaDescription:
  source: Learn how a financial power of attorney can authorize a trusted person to handle defined matters and speak with Miranda Law about your plan.
  value: Saiba como uma procuração financeira pode autorizar uma pessoa de confiança a lidar com assuntos definidos e fale com a Miranda Law sobre o seu plano.
hero.eyebrow:
  source: Powers of Attorney
  value: Procurações
hero.title:
  source: Choose who may act
  value: Escolha quem pode agir
hero.accent:
  source: when you cannot act for yourself.
  value: quando você não puder agir por si mesmo.
hero.lead:
  source: A power of attorney can authorize a trusted person to handle defined financial, legal, or practical matters on your behalf. Careful drafting helps make the authority clear before it is urgently needed.
  value: Uma procuração pode autorizar uma pessoa de confiança para lidar com assuntos financeiros, legais ou práticos definidos em seu nome. Uma redação cuidadosa ajuda a tornar a autoridade clara antes que ela seja necessária com urgência.
hero.secondaryLabel:
  source: See the complete estate plan
  value: Veja o planejamento patrimonial completo
sections.0.eyebrow:
  source: What is a power of attorney?
  value: O que é uma procuração?
sections.0.title:
  source: Written authority for a person you choose.
  value: Autoridade por escrito para uma pessoa de sua escolha.
sections.0.body.0:
  source: A power of attorney names an agent to act for you within the authority described in the document. Depending on its terms, that authority may cover financial accounts, property, taxes, contracts, benefits, business interests, or other legal and practical matters.
  value: Uma procuração nomeia um procurador para agir em seu nome dentro da autoridade descrita no documento. Dependendo de seus termos, essa autoridade pode abranger contas financeiras, propriedades, impostos, contratos, benefícios, interesses comerciais ou outros assuntos jurídicos e práticos.
sections.0.body.1:
  source: The document should be tailored to the authority you actually want to give and coordinated with institutions or arrangements that may have their own requirements.
  value: O documento deve ser adaptado à autoridade que você realmente deseja conceder e estar em conformidade com as instituições ou arranjos que possam ter seus próprios requisitos.
sections.1.eyebrow:
  source: Why you may need one
  value: Por que você pode precisar de um
sections.1.title:
  source: Prepare for a time when signatures and decisions cannot wait.
  value: Prepare-se para um momento em que assinaturas e decisões não puderem esperar.
sections.1.bullets.0:
  source: You want someone to manage bills or financial accounts during incapacity.
  value: Você deseja que alguém gerencie contas ou contas financeiras durante uma incapacidade.
sections.1.bullets.1:
  source: You own real estate or a business interest that may require ongoing action.
  value: Você possui imóveis ou interesses comerciais que podem exigir ações contínuas.
sections.1.bullets.2:
  source: You want an agent to address taxes, benefits, insurance, or legal documents.
  value: Você deseja que um procurador trate de impostos, benefícios, seguros ou documentos legais.
sections.1.bullets.3:
  source: You travel or may need help handling a limited transaction.
  value: Você viaja ou pode precisar de ajuda para realizar uma transação limitada.
sections.1.bullets.4:
  source: You want a backup agent if the first person cannot serve.
  value: Você deseja um procurador substituto caso a primeira pessoa não possa exercer a função.
sections.1.bullets.5:
  source: Your current document is old, too narrow, or names someone who is no longer appropriate.
  value: Seu documento atual é antigo, muito restrito ou nomeia alguém que não é mais apropriado.
sections.2.eyebrow:
  source: What you can decide
  value: O que você pode decidir
sections.2.title:
  source: Who acts, what they may do, and how the authority is limited.
  value: Quem age, o que pode fazer e como a autoridade é limitada.
sections.2.cards.0.title:
  source: Primary agent
  value: Procurador principal
sections.2.cards.0.body:
  source: Choose a person you trust to follow the document and act with care.
  value: Escolha uma pessoa em quem você confie para seguir o documento e agir com cautela.
sections.2.cards.1.title:
  source: Successor agent
  value: Procurador sucessor
sections.2.cards.1.body:
  source: Name a backup in case the first agent cannot or will not act.
  value: Nomeie um substituto caso o primeiro procurador não possa ou não queira agir.
sections.2.cards.2.title:
  source: Scope of authority
  value: Escopo da autoridade
sections.2.cards.2.body:
  source: Describe the financial, legal, property, business, or other matters the agent may handle.
  value: Descreva as questões financeiras, jurídicas, patrimoniais, comerciais ou outros assuntos que o procurador poderá gerenciar.
sections.2.cards.3.title:
  source: Timing and limits
  value: Cronograma e limites
sections.2.cards.3.body:
  source: Address when authority begins, whether it continues during incapacity, and any instructions or limits that should apply.
  value: Aborde quando a autoridade começa, se ela continua durante uma incapacidade e quaisquer instruções ou limites que devam ser aplicados.
sections.3.eyebrow:
  source: Who should consider one
  value: Quem deve considerar uma
sections.3.title:
  source: Incapacity planning belongs in many adult estate plans.
  value: O planejamento de incapacidade faz parte de muitos planos de planejamento patrimonial para adultos.
sections.3.bullets.0:
  source: Adults with financial accounts or recurring obligations
  value: Adultos com contas financeiras ou obrigações recorrentes
sections.3.bullets.1:
  source: Homeowners and business owners
  value: Proprietários de imóveis e empresários
sections.3.bullets.2:
  source: People approaching retirement
  value: Pessoas próximas da aposentadoria
sections.3.bullets.3:
  source: Caregivers and adults supporting family members
  value: Cuidadores e adultos que apoiam membros da família
sections.3.bullets.4:
  source: People with planned travel, medical procedures, or periods of limited availability
  value: Pessoas com viagens planejadas, procedimentos médicos ou períodos de disponibilidade limitada
sections.3.bullets.5:
  source: Anyone who wants to choose an agent before a court process may become necessary
  value: Qualquer pessoa que deseje escolher um procurador antes que um processo judicial se torne necessário
sections.4.eyebrow:
  source: What happens without one
  value: O que acontece sem um
sections.4.title:
  source: Family members do not always receive automatic financial authority.
  value: Membros da família nem sempre recebem autoridade financeira automática.
sections.4.body.0:
  source: If you become unable to manage financial or legal matters and no effective authority is in place, relatives may face delays, institutional barriers, or a court proceeding to obtain authority.
  value: Se você se tornar incapaz de gerir assuntos financeiros ou jurídicos e não houver uma autoridade efetiva estabelecida, os parentes podem enfrentar atrasos, barreiras institucionais ou um processo judicial para obter tal autoridade.
sections.4.body.1:
  source: A power of attorney cannot prevent every difficulty, but it can provide a documented starting point and identify the person you chose.
  value: Uma procuração não pode evitar todas as dificuldades, mas pode fornecer um ponto de partida documentado e identificar a pessoa que você escolheu.
sections.5.eyebrow:
  source: Common misconceptions
  value: Equívocos comuns
sections.5.title:
  source: Authority should be deliberate, not vague.
  value: A autoridade deve ser deliberada, não vaga.
sections.5.cards.0.title:
  source: “My spouse or child can automatically handle everything.”
  value: “Meu cônjuge ou filho pode cuidar de tudo automaticamente.”
sections.5.cards.0.body:
  source: Relationships alone may not give another person authority over individually held accounts or legal matters.
  value: Os relacionamentos por si só podem não conferir a outra pessoa autoridade sobre contas individuais ou questões jurídicas.
sections.5.cards.1.title:
  source: “A power of attorney replaces a will.”
  value: “Uma procuração substitui um testamento.”
sections.5.cards.1.body:
  source: A power of attorney generally concerns authority during life; a will addresses instructions after death.
  value: Uma procuração geralmente diz respeito à autoridade durante a vida; um testamento trata de instruções após o falecimento.
sections.5.cards.2.title:
  source: “The broadest document is always best.”
  value: “O documento mais abrangente é sempre o melhor.”
sections.5.cards.2.body:
  source: The appropriate authority depends on your goals, risks, and trust in the people being named.
  value: A autoridade apropriada depende dos seus objetivos, riscos e da confiança nas pessoas que estão sendo nomeadas.
sections.6.eyebrow:
  source: How it fits
  value: Como tudo se integra
sections.6.title:
  source: Pair financial authority with health care planning.
  value: Combine a autoridade financeira com o planejamento de cuidados de saúde.
sections.6.body.0:
  source: A financial power of attorney handles a different set of decisions from a health care directive. Keeping both documents current can create a more complete incapacity plan.
  value: Uma procuração financeira trata de um conjunto de decisões diferente de uma diretiva de cuidados de saúde. Manter ambos os documentos atualizados pode criar um plano de incapacidade mais completo.
sections.7.eyebrow:
  source: The Miranda Law process
  value: O processo da Miranda Law
sections.7.title:
  source: From a first conversation to a finished document.
  value: Da primeira conversa ao documento finalizado.
sections.7.steps.0.title:
  source: Schedule a Free Initial Consultation
  value: Agende uma Consulta Inicial Gratuita
sections.7.steps.0.body:
  source: Discuss your current documents, family, property, concerns, and goals.
  value: Discutiremos seus documentos atuais, família, propriedades, preocupações e objetivos.
sections.7.steps.1.title:
  source: Review the options
  value: Analise as opções
sections.7.steps.1.body:
  source: Understand the purpose, limits, and decisions involved before choosing a direction.
  value: Compreenda o propósito, os limites e as decisões envolvidas antes de escolher um caminho.
sections.7.steps.2.title:
  source: Prepare and review
  value: Prepare e revise
sections.7.steps.2.body:
  source: The firm drafts the document and reviews its terms with you in plain language.
  value: O escritório redige o documento e revisa seus termos com você em linguagem clara e acessível.
sections.7.steps.3.title:
  source: Sign and finalize
  value: Assine e finalize
sections.7.steps.3.body:
  source: Complete the required formalities and understand how the document fits with the rest of the plan.
  value: Conclua as formalidades necessárias e compreenda como o documento se integra ao restante do planejamento patrimonial.
sections.8.eyebrow:
  source: Why work with Miranda Law
  value: Por que trabalhar com a Miranda Law
sections.8.title:
  source: Personal guidance with accessible communication.
  value: Orientação personalizada com comunicação acessível.
sections.8.bullets.0:
  source: Clear explanations centered on the decisions you need to make.
  value: Explicações claras focadas nas decisões que você precisa tomar.
sections.8.bullets.1:
  source: Recommendations based on your family, assets, and goals.
  value: Recomendações baseadas em sua família, patrimônio e objetivos.
sections.8.bullets.2:
  source: Service in English, Spanish, and Portuguese.
  value: Atendimento em inglês, espanhol e português.
sections.8.bullets.3:
  source: Phone, text, and WhatsApp communication with the office.
  value: Comunicação via telefone, SMS e WhatsApp com o escritório.
sections.8.bullets.4:
  source: A free initial consultation to understand the possible scope.
  value: Uma consulta inicial gratuita para entender o possível escopo.
faqs.0.question:
  source: When does a power of attorney take effect?
  value: Quando uma procuração entra em vigor?
faqs.0.answer:
  source: That depends on the document's terms and applicable law. The timing should be discussed and written clearly.
  value: Isso depende dos termos do documento e da lei aplicável. O momento deve ser discutido e escrito de forma clara.
faqs.1.question:
  source: Does the authority continue if I become incapacitated?
  value: A autoridade continua se eu ficar incapacitado?
faqs.1.answer:
  source: A durable power of attorney is designed to continue during incapacity, but the actual document must be reviewed for its terms and validity.
  value: Uma procuração durável é projetada para continuar durante a incapacidade, mas o documento real deve ser revisado quanto aos seus termos e validade.
faqs.2.question:
  source: Can I name more than one agent?
  value: Posso nomear mais de um procurador?
faqs.2.answer:
  source: A document may name co-agents or successors, but multiple agents can create practical questions about signatures, coordination, and disagreements.
  value: Um documento pode nomear co-procuradores ou sucessores, mas múltiplos procuradores podem gerar questões práticas sobre assinaturas, coordenação e divergências.
faqs.3.question:
  source: Can I revoke a power of attorney?
  value: Posso revogar uma procuração?
faqs.3.answer:
  source: A person with capacity can generally revoke authority, but effective revocation also requires practical notice to the agent and relevant institutions.
  value: Uma pessoa com capacidade mental pode, geralmente, revogar a autoridade, mas a revogação eficaz também exige a notificação prática ao procurador e às instituições relevantes.
faqs.4.question:
  source: Is a power of attorney the same as a health care proxy?
  value: Uma procuração é o mesmo que um procurador de cuidados de saúde?
faqs.4.answer:
  source: No. Financial powers of attorney and health care directives address different decisions and are usually documented separately.
  value: Não. Procurações financeiras e diretivas de cuidados de saúde tratam de decisões diferentes e geralmente são documentadas separadamente.
