entries:
  - path: title
    source: Trusts Attorney in North Jersey
    value: Advogado de Trust (Fideicomisso) em North Jersey
  - path: metaDescription
    source: Understand how trusts can hold and manage assets under written terms and speak with Miranda Law about whether a trust fits your estate plan.
    value: Entenda como os trusts podem deter e gerir ativos sob termos escritos e fale com a Miranda Law sobre se um trust se adequa ao seu planejamento patrimonial.
  - path: hero.eyebrow
    source: Trusts
    value: Trust (Fideicomisso)
  - path: hero.title
    source: Create structure for
    value: Crie uma estrutura para
  - path: hero.accent
    source: how selected assets are managed.
    value: como ativos selecionados são gerenciados.
  - path: hero.lead
    source: A trust can place selected property under written terms for the benefit of the people or purposes you choose. Whether one belongs in your plan depends on what you own, what you want to accomplish, and how the trust will be maintained.
    value: Um trust pode colocar propriedades selecionadas sob termos escritos para o benefício das pessoas ou finalidades que você escolher. Se um deve integrar seu plano depende do que você possui, do que deseja alcançar e de como o trust será mantido.
  - path: hero.secondaryLabel
    source: See the complete estate plan
    value: Veja o planejamento patrimonial completo
  - path: sections.0.eyebrow
    source: What is a trust?
    value: O que é um trust?
  - path: sections.0.title
    source: A legal relationship built around property, instructions, and responsibility.
    value: Uma relação jurídica construída em torno de propriedade, instruções e responsabilidade.
  - path: sections.0.body.0
    source: A trust generally involves a trustee who holds or manages property under written terms for one or more beneficiaries. The person creating the trust decides its purpose and the rules that apply, within the limits of the law.
    value: Um trust geralmente envolve um administrador (trustee) que detém ou gere propriedades sob termos escritos para um ou mais beneficiários. A pessoa que cria o trust decide seu propósito e as regras aplicáveis, dentro dos limites da lei.
  - path: sections.0.body.1
    source: There are many kinds of trusts. The right structure—and whether a trust is useful at all—depends on the goals and assets involved.
    value: Existem muitos tipos de trusts. A estrutura correta — e se um trust é útil ou não — depende dos objetivos e dos ativos envolvidos.
  - path: sections.1.eyebrow
    source: Why you may need one
    value: Por que você pode precisar de um
  - path: sections.1.title
    source: Add control where a simple transfer may not be enough.
    value: Adicione controle onde uma transferência simples pode não ser suficiente.
  - path: sections.1.bullets.0
    source: You want property managed for a child or another beneficiary over time.
    value: Você deseja que propriedades sejam gerenciadas para um filho ou outro beneficiário ao longo do tempo.
  - path: sections.1.bullets.1
    source: You want a successor trustee to manage trust property if you cannot.
    value: Você deseja um administrador sucessor para gerir os bens do trust caso você não possa fazê-lo.
  - path: sections.1.bullets.2
    source: You want to set conditions or timing for distributions.
    value: Você deseja estabelecer condições ou prazos para distribuições.
  - path: sections.1.bullets.3
    source: You have a blended family or responsibilities that require careful coordination.
    value: Você possui uma família reconstituída ou responsabilidades que exigem uma coordenação cuidadosa.
  - path: sections.1.bullets.4
    source: You want a plan for selected property that continues beyond your lifetime.
    value: Você deseja um plano para propriedades selecionadas que continue além da sua vida.
  - path: sections.1.bullets.5
    source: You have an existing trust that has not been reviewed or properly coordinated with current assets.
    value: Você possui um trust existente que não foi revisado ou devidamente coordenado com seus ativos atuais.
  - path: sections.2.eyebrow
    source: What you can decide
    value: O que você pode decidir
  - path: sections.2.title
    source: Define who manages, who benefits, and how the terms work.
    value: Defina quem administra, quem se beneficia e como os termos funcionam.
  - path: sections.2.cards.0.title
    source: Trustee
    value: Administrador (Trustee)
  - path: sections.2.cards.0.body
    source: Choose the person or institution responsible for following the trust terms and name appropriate successors.
    value: Escolha a pessoa ou instituição responsável por seguir os termos do trust e nomeie sucessores apropriados.
  - path: sections.2.cards.1.title
    source: Beneficiaries
    value: Beneficiários
  - path: sections.2.cards.1.body
    source: Identify who may benefit and under what circumstances distributions may be made.
    value: Identifique quem pode ser beneficiado e sob quais circunstâncias as distribuições podem ser feitas.
  - path: sections.2.cards.2.title
    source: Property
    value: Patrimônio
  - path: sections.2.cards.2.body
    source: Determine which assets should be transferred to or coordinated with the trust.
    value: Determine quais ativos devem ser transferidos para o trust (fideicomisso) ou coordenados com ele.
  - path: sections.2.cards.3.title
    source: Timing and purpose
    value: Cronograma e finalidade
  - path: sections.2.cards.3.body
    source: Set a framework for when property may be used, distributed, or retained for future needs.
    value: Estabeleca uma estrutura para definir quando o patrimônio poderá ser utilizado, distribuído ou retido para necessidades futuras.
  - path: sections.3.eyebrow
    source: Who should consider a trust
    value: Quem deve considerar um trust (fideicomisso)
  - path: sections.3.title
    source: Useful in the right plan—not automatically necessary in every plan.
    value: Útil no plano adequado — não é automaticamente necessário em todos os planos.
  - path: sections.3.bullets.0
    source: Parents planning for minor children
    value: Pais que estão planejando o futuro de filhos menores
  - path: sections.3.bullets.1
    source: Families supporting a beneficiary who may need ongoing management
    value: Famílias que apoiam um beneficiário que possa necessitar de gestão contínua
  - path: sections.3.bullets.2
    source: Homeowners and people with property in more than one jurisdiction
    value: Proprietários de imóveis e pessoas com bens em mais de uma jurisdição
  - path: sections.3.bullets.3
    source: Blended families
    value: Famílias recompostas
  - path: sections.3.bullets.4
    source: Business owners
    value: Proprietários de empresas
  - path: sections.3.bullets.5
    source: People who want a successor structure for managing selected assets during incapacity
    value: Pessoas que desejam uma estrutura sucessora para a gestão de ativos selecionados durante períodos de incapacidade
  - path: sections.4.eyebrow
    source: What happens without one
    value: O que acontece sem um
  - path: sections.4.title
    source: The result depends on the rest of the plan.
    value: O resultado depende do restante do planejamento.
  - path: sections.4.body.0
    source: A trust is not required for every estate. Without one, property may still pass through a will, beneficiary designation, joint ownership, or other legal arrangement.
    value: Um trust (fideicomisso) não é obrigatório para todo espólio. Sem ele, os bens ainda podem ser transmitidos por meio de um testamento, designação de beneficiários, propriedade conjunta ou outros arranjos legais.
  - path: sections.4.body.1
    source: The practical question is whether those alternatives provide enough control, continuity, and coordination for your circumstances.
    value: A questão prática é se essas alternativas oferecem controle, continuidade e coordenação suficientes para as suas circunstâncias.
  - path: sections.5.eyebrow
    source: Common misconceptions
    value: Equívocos comuns
  - path: sections.5.title
    source: A signed trust is only the beginning.
    value: Um trust (fideicomisso) assinado é apenas o começo.
  - path: sections.5.cards.0.title
    source: “Every family needs a trust.”
    value: “Toda família precisa de um trust (fideicomisso).”
  - path: sections.5.cards.0.body
    source: Some goals can be handled effectively through other documents and ownership arrangements.
    value: Alguns objetivos podem ser alcançados de forma eficaz por meio de outros documentos e arranjos de propriedade.
  - path: sections.5.cards.1.title
    source: “A trust works automatically once signed.”
    value: “Um trust (fideicomisso) funciona automaticamente após a assinatura.”
  - path: sections.5.cards.1.body
    source: A trust generally must be funded or coordinated with the relevant assets to do the work it was designed to do.
    value: Geralmente, um trust (fideicomisso) deve ser integralizado ou coordenado com os ativos relevantes para cumprir a função para a qual foi projetado.
  - path: sections.5.cards.2.title
    source: “A trust replaces every other document.”
    value: “Um trust (fideicomisso) substitui todos os outros documentos.”
  - path: sections.5.cards.2.body
    source: Wills, powers of attorney, health care directives, and beneficiary designations may still be essential.
    value: Testamentos, procurações, diretivas de cuidados de saúde e designações de beneficiários ainda podem ser essenciais.
  - path: sections.6.eyebrow
    source: How it fits
    value: Como tudo se integra
  - path: sections.6.title
    source: Connect the trust to the will, titles, and beneficiary designations.
    value: Conecte o trust (fideicomisso) ao testamento, títulos de propriedade e designações de beneficiários.
  - path: sections.6.body.0
    source: Trust planning is as much about coordination as drafting. The document, selected assets, ownership records, beneficiary designations, and the rest of the estate plan should point in the same direction.
    value: O planejamento de trust (fideilcomisso) trata tanto de coordenação quanto de redação. O documento, os ativos selecionados, os registros de propriedade, as designações de beneficiários e o restante do planejamento patrimonial devem apontar na mesma direção.
  - path: sections.7.eyebrow
    source: The Miranda Law process
    value: O processo da Miranda Law
  - path: sections.7.title
    source: From a first conversation to a finished document.
    value: Da primeira conversa ao documento finalizado.
  - path: sections.7.steps.0.title
    source: Schedule a Free Initial Consultation
    value: Agende uma Consulta Inicial Gratuita
  - path: sections.7.steps.0.body
    source: Discuss your current documents, family, property, concerns, and goals.
    value: Discutiremos seus documentos atuais, família, propriedades, preocupações e objetivos.
  - path: sections.7.steps.1.title
    source: Review the options
    value: Analise as opções
  - path: sections.7.steps.1.body
    source: Understand the purpose, limits, and decisions involved before choosing a direction.
    value: Compreenda o propósito, os limites e as decisões envolvidas antes de escolher um caminho.
  - path: sections.7.steps.2.title
    source: Prepare and review
    value: Prepare e revise
  - path: sections.7.steps.2.body
    source: The firm drafts the document and reviews its terms with you in plain language.
    value: O escritório redige o documento e revisa seus termos com você em linguagem clara e acessível.
  - path: sections.7.steps.3.title
    source: Sign and finalize
    value: Assine e finalize
  - path: sections.7.steps.3.body
    source: Complete the required formalities and understand how the document fits with the rest of the plan.
    value: Conclua as formalidades necessárias e compreenda como o documento se integra ao restante do planejamento patrimonial.
  - path: sections.8.eyebrow
    source: Why work with Miranda Law
    value: Por que trabalhar com a Miranda Law
  - path: sections.8.title
    source: Personal guidance with accessible communication.
    value: Orientação personalizada com comunicação acessível.
  - path: sections.8.bullets.0
    source: Clear explanations centered on the decisions you need to make.
    value: Explicações claras focadas nas decisões que você precisa tomar.
  - path: sections.8.bullets.1
    source: Recommendations based on your family, assets, and goals.
    value: Recomendações baseadas em sua família, patrimônio e objetivos.
  - path: sections.8.bullets.2
    source: Service in English, Spanish, and Portuguese.
    value: Atendimento em inglês, espanhol e português.
  - path: sections.8.bullets.3
    source: Phone, text, and WhatsApp communication with the office.
    value: Comunicação via telefone, SMS e WhatsApp com o escritório.
  - path: sections.8.bullets.4
    source: A free initial consultation to understand the possible scope.
    value: Uma consulta inicial gratuita para entender o possível escopo.
  - path: faqs.0.question
    source: What is the difference between a will and a trust?
    value: Qual é a diferença entre um testamento e um trust (fideicomisso)?
  - path: faqs.0.answer
    source: A will gives instructions for property governed by the will after death. A trust can hold and manage selected property under written terms during life, after death, or both.
    value: Um testamento fornece instruções para propriedades regidas pelo testamento após o falecimento. Um trust (fideicomisso) pode deter e gerir propriedades selecionadas sob termos escritos durante a vida, após a morte, ou ambos.
  - path: faqs.1.question
    source: Does a trust avoid probate?
    value: Um trust (fideicomisso) evita o inventário (probate)?
  - path: faqs.1.answer
    source: Property properly held in a trust may be administered under the trust terms rather than through probate, but assets left outside the trust may follow a different path.
    value: Propriedades devidamente mantidas em um trust (fideicomisso) podem ser administradas sob os termos do trust, em vez de passarem pelo processo de inventário, mas ativos deixados fora do trust podem seguir um caminho diferente.
  - path: faqs.2.question
    source: Can I change a trust?
    value: Eu posso alterar um trust (fideicomisso)?
  - path: faqs.2.answer
    source: That depends on the type of trust and its terms. Revocable and irrevocable trusts operate differently, so the document must be reviewed.
    value: Isso depende do tipo de trust (fideicomisso) e de seus termos. Trusts revogáveis e irrevogáveis operam de forma diferente, portanto, o documento deve ser revisado.
  - path: faqs.3.question
    source: Who should serve as trustee?
    value: Quem deve atuar como administrador (trustee)?
  - path: faqs.3.answer
    source: The choice depends on the responsibility involved, the people affected, the complexity of the property, and the candidate's judgment and availability.
    value: A escolha depende da responsabilidade envolvida, das pessoas afetadas, da complexidade da propriedade e do julgamento e disponibilidade do candidato.
  - path: faqs.4.question
    source: What does it mean to fund a trust?
    value: O que significa financiar um trust (fideicomisso)?
  - path: faqs.4.answer
    source: Funding generally means transferring or coordinating selected assets so the trust can govern them. The necessary steps depend on the asset.
    value: Financiar geralmente significa transferir ou coordenar ativos selecionados para que o trust (fideicomisso) possa geri-los. As etapas necessárias dependem do ativo.
