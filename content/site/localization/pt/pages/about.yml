title:
  source: About Brian Miranda
  value: Sobre Brian Miranda
metaDescription:
  source: Meet Brian M. Miranda, Esq. and learn about Miranda Law's clear, responsive, multilingual approach to serving North Jersey families.
  value: Conheça Brian M. Miranda, Esq. e saiba mais sobre a abordagem clara, ágil e multilíngue da Miranda Law para atender as famílias de North Jersey.
hero.eyebrow:
  source: About Brian
  value: Sobre Brian
hero.title:
  source: Meet Brian Miranda
  value: Conheça Brian Miranda
hero.lead:
  source: Brian M. Miranda, Esq. helps North Jersey individuals and families with estate planning. His approach is personal and practical, with clear explanations and service available in English, Spanish, and Portuguese.
  value: Brian M. Miranda, Esq. ajuda pessoas e famílias do norte de New Jersey com o planejamento patrimonial. Sua abordagem é pessoal e prática, com explicações claras e atendimento disponível em inglês, espanhol e português.
