title:
  source: About Brian Miranda
  value: Sobre Brian Miranda
metaDescription:
  source: Meet Brian M. Miranda, Esq. and learn about Miranda Law's clear, responsive, multilingual approach to serving North Jersey families.
  value: Conheça Brian M. Miranda, Esq. e saiba mais sobre a abordagem clara, ágil e multilíngue da Miranda Law para atender as famílias de North Jersey.
hero.eyebrow:
  source: Meet Brian Miranda
  value: Conheça Brian Miranda
hero.title:
  source: Legal guidance should feel
  value: A orientação jurídica deve parecer
hero.accent:
  source: clear, personal, and useful.
  value: clara, pessoal e útil.
hero.lead:
  source: Brian Miranda is from Hillside, New Jersey. His approach to legal guidance is shaped by the work ethic he learned from his blue-collar parents and by the practical experience he gained working construction alongside his father and uncle.
  value: Brian Miranda é natural de Hillside, New Jersey. Sua abordagem à orientação jurídica é formada pela ética de trabalho que aprendeu com seus pais, da classe trabalhadora, e pela experiência prática que adquiriu trabalhando na construção civil ao lado do pai e do tio.
hero.imageAlt:
  source: A linen-bound planning book with organized legal documents
  value: Um livro de planejamento encadernado em linho com documentos jurídicos organizados
hero.secondaryLabel:
  source: Explore estate planning
  value: Explore o planejamento patrimonial
sections.0.eyebrow:
  source: A Hillside foundation
  value: Uma base em Hillside
sections.0.title:
  source: Hard work, clear guidance, and a personal perspective.
  value: Trabalho árduo, orientação clara e uma perspectiva pessoal.
sections.0.body.0:
  source: Brian Miranda grew up in Hillside, New Jersey, in a blue-collar family where hard work was a daily example. He worked in construction with his father and uncle. Brian grew up bilingual and learned English as a second language. That experience gives him a personal understanding of how much clear communication matters when legal issues feel unfamiliar.
  value: Brian Miranda cresceu em Hillside, New Jersey, em uma família da classe trabalhadora na qual o trabalho árduo era um exemplo diário. Trabalhou na construção civil com o pai e o tio. Brian cresceu falando dois idiomas e aprendeu inglês como segunda língua. Essa experiência lhe permite compreender, por vivência própria, o quanto a comunicação clara é importante quando se está diante de questões jurídicas pouco familiares.
sections.0.body.1:
  source: He earned a Bachelor of Science in Business Administration from Seton Hall University and a Juris Doctor from New York Law School. He is admitted to practice in New Jersey, New York, and the U.S. District Court for the District of New Jersey.
  value: Obteve um Bachelor of Science in Business Administration pela Seton Hall University e um Juris Doctor pela New York Law School. É habilitado a exercer a advocacia em New Jersey e New York, bem como perante o U.S. District Court for the District of New Jersey.
sections.1.eyebrow:
  source: What clients can expect
  value: O que os clientes podem esperar
sections.1.title:
  source: Clear answers without unnecessary distance.
  value: Respostas claras, sem distanciamento desnecessário.
sections.1.cards.0.title:
  source: Plain-language explanations
  value: Explicações em linguagem simples
sections.1.cards.0.body:
  source: Understand the purpose of each option, the decisions it requires, and how it relates to the rest of the plan.
  value: Compreenda o propósito de cada opção, as decisões que ela exige e como ela se relaciona com o restante do plano.
sections.1.cards.1.title:
  source: Personal recommendations
  value: Recomendações personalizadas
sections.1.cards.1.body:
  source: The conversation begins with your actual family, assets, responsibilities, and priorities.
  value: A conversa começa com sua família real, bens, responsabilidades e prioridades.
sections.1.cards.2.title:
  source: Responsive communication
  value: Comunicação responsiva
sections.1.cards.2.body:
  source: The legal team handles intake and scheduling through phone, text, and WhatsApp.
  value: A equipe jurídica realiza o atendimento inicial e o agendamento por meio de telefone, SMS e WhatsApp.
sections.1.cards.3.title:
  source: Multilingual service
  value: Atendimento multilíngue
sections.1.cards.3.body:
  source: English, Spanish, and Portuguese communication is available throughout the client experience.
  value: Comunicação em inglês, espanhol e português está disponível durante toda a experiência do cliente.
sections.2.eyebrow:
  source: Serving North Jersey
  value: Atendendo North Jersey
sections.2.title:
  source: Local counsel for multilingual families.
  value: Assessoria jurídica local para famílias multilíngues.
sections.2.body.0:
  source: Miranda Law primarily serves North Jersey, including Monmouth County and communities north of it. The Warren office gives clients a local place to begin, while the firm's phone, text, and WhatsApp options help make communication easier.
  value: A Miranda Law atende principalmente North Jersey, incluindo o condado de Monmouth e as comunidades ao norte deste. O escritório de Warren oferece aos clientes um local local para iniciar, enquanto as opções de telefone, SMS e WhatsApp do escritório ajudam a facilitar a comunicação.
sections.2.body.1:
  source: Approximately half of the firm's clients are Spanish- or Portuguese-speaking. Multilingual service is not an add-on; it is part of how the practice works every day.
  value: Aproximadamente metade dos clientes do escritório fala espanhol ou português. O atendimento multilíngue não é um adicional; é parte da forma como a prática opera todos os dias.
sections.3.eyebrow:
  source: Approach to estate planning
  value: Abordagem ao planejamento patrimonial
sections.3.title:
  source: Listen first. Explain the options. Build the plan carefully.
  value: Primeiro ouvir. Explicar as opções. Elaborar o plano cuidadosamente.
sections.3.steps.0.title:
  source: Understand
  value: Compreender
sections.3.steps.0.body:
  source: Discuss the people, property, responsibilities, and changes that bring you to the conversation.
  value: Discutir as pessoas, propriedades, responsabilidades e mudanças que o trouxeram a esta conversa.
sections.3.steps.1.title:
  source: Explain
  value: Explicar
sections.3.steps.1.body:
  source: Review possible documents and tradeoffs in language that makes the choices easier to follow.
  value: Revisar possíveis documentos e compensações em uma linguagem que torne as escolhas mais fáceis de compreender.
sections.3.steps.2.title:
  source: Prepare
  value: Preparar
sections.3.steps.2.body:
  source: Draft and review the agreed plan with enough room to ask questions before signing.
  value: Redigir e revisar o plano acordado com margem suficiente para fazer perguntas antes da assinatura.
sections.3.steps.3.title:
  source: Carry forward
  value: Dar continuidade
sections.3.steps.3.body:
  source: Leave knowing what was signed, where it belongs, and what kinds of future changes may call for another review.
  value: Sair sabendo o que foi assinado, onde o documento deve ser guardado e quais tipos de mudanças futuras podem exigir uma nova revisão.
finalCta.title:
  source: Bring the questions you have now.
  value: Traga as perguntas que você tem agora.
finalCta.body:
  source: You do not need to solve every decision before calling. A free initial consultation is a place to understand what may come next.
  value: Você não precisa resolver todas as decisões antes de ligar. Uma consulta inicial gratuita é um espaço para compreender o que pode vir a seguir.
