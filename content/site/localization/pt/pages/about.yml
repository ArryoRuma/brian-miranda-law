sections.3.title:
  source: Working with Brian
  value: Trabalhar com Brian
sections.3.cards.0.title:
  source: Clear explanations
  value: Explicações claras
sections.3.cards.0.body:
  source: Brian explains the available options and their tradeoffs in plain language. You have room to ask questions as the agreed documents are prepared and reviewed, and to understand what was signed and what comes next.
  value: Brian explica as opções disponíveis e suas vantagens e desvantagens em linguagem simples. Você tem espaço para fazer perguntas durante a preparação e revisão dos documentos acordados e para entender o que foi assinado e quais são os próximos passos.
sections.3.cards.1.title:
  source: Personal recommendations
  value: Recomendações pessoais
sections.3.cards.1.body:
  source: The conversation begins with your family, property, responsibilities, and goals. Those details guide the recommendations, including what future changes may call for another review of your plan.
  value: A conversa começa com sua família, seus bens, suas responsabilidades e seus objetivos. Esses detalhes orientam as recomendações, incluindo quais mudanças futuras podem exigir uma nova revisão do seu plano.
sections.3.cards.2.title:
  source: Responsive communication
  value: Comunicação responsiva
sections.3.cards.2.body:
  source: The legal team handles intake and scheduling through phone, text, and WhatsApp.
  value: A equipe jurídica realiza o atendimento inicial e o agendamento por meio de telefone, SMS e WhatsApp.
sections.4.eyebrow:
  source: Serving North Jersey
  value: Atendendo North Jersey
sections.4.title:
  source: Serving North Jersey’s multilingual families
  value: Atendendo às famílias multilíngues do norte de New Jersey
sections.4.body.0:
  source: Miranda Law primarily serves North Jersey, including Monmouth County and communities north of it. The Warren office gives clients a local place to begin, while the firm's phone, text, and WhatsApp options help make communication easier.
  value: A Miranda Law atende principalmente North Jersey, incluindo o condado de Monmouth e as comunidades ao norte deste. O escritório de Warren oferece aos clientes um local local para iniciar, enquanto as opções de telefone, SMS e WhatsApp do escritório ajudam a facilitar a comunicação.
sections.4.body.1:
  source: Approximately half of the firm's clients are Spanish- or Portuguese-speaking. Multilingual service is not an add-on; it is part of how the practice works every day.
  value: Aproximadamente metade dos clientes do escritório fala espanhol ou português. O atendimento multilíngue não é um adicional; é parte da forma como a prática opera todos os dias.
sections.4.body.2:
  source: English, Spanish, and Portuguese communication is available throughout the client experience.
  value: Comunicação em inglês, espanhol e português está disponível durante toda a experiência do cliente.
finalCta.title:
  source: Bring the questions you have now.
  value: Traga as perguntas que você tem agora.
finalCta.body:
  source: You do not need to solve every decision before calling. A free initial consultation is a place to understand what may come next.
  value: Você não precisa resolver todas as decisões antes de ligar. Uma consulta inicial gratuita é um espaço para compreender o que pode vir a seguir.
