title:
  source: Other Legal Services
  value: Outros Serviços Jurídicos
metaDescription:
  source: Miranda Law assists North Jersey clients with select real estate, corporate, litigation, municipal, immigration, and landlord-tenant matters.
  value: A Miranda Law auxilia clientes de North Jersey em questões selecionadas de direito imobiliário, empresarial, contencioso, municipal, imigração e locação (landlord-tenant).
hero.eyebrow:
  source: Other legal services
  value: Outros serviços jurídicos
hero.title:
  source: Practical counsel for
  value: Assessoria prática para
hero.accent:
  source: the matters around the plan.
  value: as questões relacionadas ao seu plano.
hero.lead:
  source: In addition to estate planning, Miranda Law assists clients with select legal matters affecting property, business, immigration, and everyday disputes.
  value: Além do planejamento patrimonial, a Miranda Law auxilia clientes em questões jurídicas selecionadas que afetam propriedades, negócios, imigração e disputas cotidianas.
hero.secondaryLabel:
  source: Ask about your matter
  value: Consulte-nos sobre o seu caso
sections.0.eyebrow:
  source: Areas of assistance
  value: Áreas de assistência
sections.0.title:
  source: Tell us what brings you here.
  value: Conte-nos o que o trouxe aqui.
sections.0.cards.0.title:
  source: Real Estate
  value: Setor Imobiliário
sections.0.cards.0.body:
  source: Guidance for select residential and related property matters, from questions and documents through the next practical step.
  value: Orientação para questões residenciais selecionadas e propriedades relacionadas, desde dúvidas e documentos até a próxima etapa prática.
sections.0.cards.1.title:
  source: Corporate Matters
  value: Questões Corporativas
sections.0.cards.1.body:
  source: Counsel for select business questions and transactions where clear documentation and risk awareness matter.
  value: Assessoria para questões e transações comerciais selecionadas, onde a documentação clara e a ciência de riscos são fundamentais.
sections.0.cards.2.title:
  source: Civil Litigation & Defense
  value: Litígios Cíveis e Defesa
sections.0.cards.2.body:
  source: Representation in select civil disputes, with an early focus on the facts, available options, and proportionate next steps.
  value: Representação em disputas cíveis selecionadas, com foco inicial nos fatos, opções disponíveis e próximos passos proporcionais.
sections.0.cards.3.title:
  source: Municipal Matters
  value: Questões Municipais
sections.0.cards.3.body:
  source: Assistance with select matters handled through New Jersey municipal courts and local processes.
  value: Assistência em questões selecionadas tratadas por meio dos tribunais municipais de New Jersey e processos locais.
sections.0.cards.4.title:
  source: Immigration
  value: Imigração
sections.0.cards.4.body:
  source: Support with select immigration matters for individuals and families, available in English, Spanish, and Portuguese.
  value: Suporte em questões de imigração selecionadas para indivíduos e famílias, disponível em inglês, espanhol e português.
sections.0.cards.5.title:
  source: Landlord & Tenant
  value: Locador e Locatário
sections.0.cards.5.body:
  source: Guidance for select landlord-tenant questions and disputes involving rights, documents, and next steps.
  value: Orientação para questões e disputas selecionadas entre locadores e locatários que envolvam direitos, documentos e próximos passos.
sections.0.note:
  source: The availability of representation depends on the facts, timing, jurisdiction, and any conflicts. Contact the office so the legal team can determine whether the matter is one Miranda Law can consider.
  value: A disponibilidade de representação depende dos fatos, prazos, jurisdição e eventuais conflitos de interesse. Entre em contato com o escritório para que a equipe jurídica possa determinar se o caso é algo que a Miranda Law pode assumir.
sections.1.eyebrow:
  source: A coordinated perspective
  value: Uma perspectiva coordenada
sections.1.title:
  source: Legal matters rarely stay in one neat category.
  value: Questões jurídicas raramente permanecem em uma única categoria definida.
sections.1.body.0:
  source: A real estate transaction can affect an estate plan. A business interest may need to be considered alongside family goals. An immigration or litigation matter can change what requires attention first.
  value: Uma transação imobiliária pode afetar um planejamento patrimonial. Um interesse comercial pode precisar ser considerado juntamente com os objetivos familiares. Uma questão de imigração ou litígio pode alterar o que exige atenção prioritária.
sections.1.body.1:
  source: Miranda Law begins by understanding the immediate issue and its connection to the rest of the client's legal picture.
  value: A Miranda Law começa compreendendo o problema imediato e sua conexão com o panorama jurídico completo do cliente.
