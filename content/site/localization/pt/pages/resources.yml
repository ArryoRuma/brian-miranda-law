title:
  source: Estate Planning Resources
  value: Recursos de Planejamento Patrimonial
metaDescription:
  source: Use Miranda Law's estate-planning FAQs, preparation checklist, and video resources to organize questions before a consultation.
  value: Utilize o FAQ de planejamento patrimonial, o checklist de preparação e os recursos em vídeo da Miranda Law para organizar suas dúvidas antes de uma consulta.
hero.eyebrow:
  source: Estate planning resources
  value: Recursos de planejamento patrimonial
hero.title:
  source: Start informed.
  value: Comece informado.
hero.accent:
  source: You do not have to start certain.
  value: Você não precisa começar com certezas.
hero.lead:
  source: These resources are designed to help you organize the people, property, documents, and questions you may want to discuss with an attorney.
  value: Estes recursos foram desenvolvamente projetados para ajudá-lo a organizar as pessoas, propriedades, documentos e perguntas que você pode desejar discutir com um advogado.
hero.secondaryLabel:
  source: Read common questions
  value: Leia as perguntas comuns
sections.0.eyebrow:
  source: Prepare at your pace
  value: Prepare-se no seu próprio ritmo
sections.0.title:
  source: Three ways to make the first conversation easier.
  value: Três formas de tornar a primeira conversa mais fácil.
sections.0.cards.0.title:
  source: Estate Planning FAQs
  value: Perguntas Frequentes sobre Planejamento Patrimonial
sections.0.cards.0.body:
  source: Plain-language answers to common questions about documents, timing, cost, and the first consultation.
  value: Respostas em linguagem clara para perguntas comuns sobre documentos, prazos, custos e a primeira consulta.
sections.0.cards.0.linkLabel:
  source: Browse the FAQs
  value: Navegue pelo FAQ
sections.0.cards.1.title:
  source: Estate Planning Checklist
  value: Checklist de Planejamento Patrimonial
sections.0.cards.1.body:
  source: A practical list of information and decisions to gather. Complete what you can and leave the rest for the conversation.
  value: Uma lista prática de informações e decisões a serem reunidas. Conclua o que for possível e deixe o restante para a conversa.
sections.0.cards.1.linkLabel:
  source: Open the checklist
  value: Abra o checklist
sections.0.cards.2.title:
  source: Video Library
  value: Biblioteca de Vídeos
sections.0.cards.2.body:
  source: Short explanations of estate-planning concepts and the questions families commonly bring to the office.
  value: Explicações breves sobre conceitos de planejamento patrimonial e as perguntas que as famílias comumente trazem ao escritório.
sections.0.cards.2.linkLabel:
  source: Visit the video library
  value: Visite a biblioteca de vídeos
sections.1.eyebrow:
  source: A useful reminder
  value: Um lembrete útil
sections.1.title:
  source: General information is a starting point, not a personal legal plan.
  value: Informações gerais são um ponto de partida, não um plano jurídico pessoal.
sections.1.body.0:
  source: Online resources can help you identify questions, but they cannot account for every family, asset, document, or legal issue. A consultation is where general information becomes a conversation about your circumstances.
  value: Recursos online podem ajudá-lo a identificar perguntas, mas não podem prever cada família, patrimônio, documento ou questão jurídica. Uma consulta é o momento em que as informações gerais se transformam em uma conversa sobre as suas circunstâncias particulares.
