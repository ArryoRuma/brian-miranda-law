topics.0.title:
  source: Do I need an estate plan if I am not wealthy?
  value: Eu preciso de um plano patrimonial se não for rico?
topics.0.summary:
  source: Why decision-makers, incapacity, children, and personal property matter at many asset levels.
  value: Por que tomadores de decisão, incapacidade, filhos e bens pessoais são importantes em diversos níveis de patrimônio.
topics.1.title:
  source: What does a will actually control?
  value: O que um testamento realmente controla?
topics.1.summary:
  source: A plain-language look at probate property, executors, guardians, and written wishes.
  value: Uma análise em linguagem simples sobre bens sujeitos a inventário, executores, tutores e desejos por escrito.
topics.2.title:
  source: When might a trust be useful?
  value: Quando um trust (fideicomisso) pode ser útil?
topics.2.summary:
  source: How management, continuity, and distribution goals can shape the conversation.
  value: Como os objetivos de gestão, continuidade e distribuição podem moldar a conversa.
topics.3.title:
  source: Who should I name to act for me?
  value: Quem devo nomear para agir em meu nome?
topics.3.summary:
  source: Practical considerations when choosing financial and health care decision-makers.
  value: Considerações práticas ao escolher tomadores de decisão financeiros e de cuidados de saúde.
