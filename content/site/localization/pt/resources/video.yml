    source: Explore Miranda Law's planned video topics covering wills, trusts, powers of attorney, health care directives, and consultation preparation.
    value: Explore os tópicos de vídeo planejados da Miranda Law, abrangendo testamentos, trust (fideicomisso), procurações, diretivas de cuidados de saúde e preparação para consultas.
