    source: What does a will actually control?
    value: O que um testamento realmente controla?
  - path: topics.1.summary
    source: A plain-language look at probate property, executors, guardians, and written wishes.
    value: Uma análise em linguagem simples sobre bens sujeitos a inventário, executores, tutores e desejos por escrito.
  - path: topics.2.title
    source: When might a trust be useful?
    value: Quando um trust (fideicomisso) pode ser útil?
  - path: topics.2.summary
