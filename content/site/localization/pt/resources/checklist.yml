seo.title:
  source: Estate Planning Checklist
  value: Checklist de Planejamento Patrimonial
seo.description:
  source: Prepare for an estate-planning consultation with a practical checklist covering family, documents, property, decision-makers, and questions.
  value: Prepare-se para uma consulta de planejamento patrimonial com um checklist prático abrangendo família, documentos, propriedades, tomadores de decisão e perguntas.
hero.eyebrow:
  source: Estate planning checklist
  value: Checklist de planejamento patrimonial
hero.title:
  source: Gather what you can.
  value: Reúna o que for possível.
hero.accent:
  source: Bring the questions you still have.
  value: Traga as perguntas que você ainda tiver.
hero.lead:
  source: You do not need every account number or every decision before a consultation. This checklist helps you collect the information that can make the conversation more productive.
  value: Você não precisa de todos os números de conta ou de todas as decisões antes de uma consulta. Este checklist ajuda você a coletar as informações que podem tornar a conversa mais produtiva.
hero.secondaryLabel:
  source: Read the FAQs
  value: Leia o FAQ
intro.eyebrow:
  source: Preparation guide
  value: Guia de preparação
intro.title:
  source: Use this as a working list—not a test.
  value: Use isto como uma lista de trabalho — não como um teste.
intro.body:
  source: Check what is easy to gather. Make a note beside anything you cannot find or do not understand. Those gaps are useful topics for the consultation.
  value: Verifique o que é fácil de reunir. Faça uma nota ao lado de qualquer item que não conseguir encontrar ou não compreender. Essas lacunas serão tópicos úteis para a consulta.
groups.0.title:
  source: People and family
  value: Pessoas e família
groups.0.items.0:
  source: Legal names and contact information for close family members
  value: Nomes legais e informações de contato de familiares próximos
groups.0.items.1:
  source: Children, stepchildren, and anyone who depends on you
  value: Filhos, enteados e qualquer pessoa que dependa de você
groups.0.items.2:
  source: People you may trust as executor, trustee, agent, or health care representative
  value: Pessoas em quem você pode confiar como executor, administrador de trust (fideicomisso), agente ou representante de cuidados de saúde
groups.0.items.3:
  source: Backup choices if a first choice cannot serve
  value: Opções de reserva caso a primeira escolha não possa assumir o encargo
groups.1.title:
  source: Existing documents
  value: Documentos existentes
groups.1.items.0:
  source: Current wills, trusts, powers of attorney, and health care directives
  value: Testamentos, trusts (fideicomissos), procurações e diretivas de cuidados de saúde atuais
groups.1.items.1:
  source: Prenuptial, postnuptial, divorce, or separation agreements that may affect planning
  value: Acordos pré-nupciais, pós-nupciais, de divórcio ou de separação que possam afetar o planejamento
groups.1.items.2:
  source: Business agreements or succession documents
  value: Acordos comerciais ou documentos de sucessão
groups.1.items.3:
  source: Any document you no longer understand or believe is out of date
  value: Qualquer documento que você não compreenda mais ou que acredite estar desatualizado
groups.2.title:
  source: Property and accounts
  value: Propriedades e contas
groups.2.items.0:
  source: Homes, other real estate, and how each property is titled
  value: Casas, outros imóveis e como a titularidade de cada propriedade está registrada
groups.2.items.1:
  source: Bank, investment, and retirement accounts
  value: Contas bancárias, de investimento e de aposentadoria
groups.2.items.2:
  source: Life insurance and current beneficiary designations
  value: Seguro de vida e designações atuais de beneficiários
groups.2.items.3:
  source: Business ownership, vehicles, and significant personal property
  value: Propriedade de empresas, veículos e bens pessoais significativos
groups.2.items.4:
  source: Debts, mortgages, and other major obligations
  value: Dívidas, hipotecas e outras obrigações principais
groups.3.title:
  source: Your wishes
  value: Seus desejos
groups.3.items.0:
  source: Who should receive property and whether any gifts need special handling
  value: Quem deve receber bens e se quaisquer doações necessitam de tratamento especial
groups.3.items.1:
  source: Who should administer the estate
  value: Quem deve administrar o espólio
groups.3.items.2:
  source: Who should care for minor children if a guardian is needed
  value: Quem deve cuidar de filhos menores caso um tutor seja necessário
groups.3.items.3:
  source: Whether property should be managed over time for a beneficiary
  value: Se os bens devem ser administrados ao longo do tempo para um beneficiário
groups.3.items.4:
  source: Charitable gifts or personal items with special meaning
  value: Doações beneficentes ou itens pessoais com significado especial
groups.4.title:
  source: Financial decision-making
  value: Tomada de decisões financeiras
groups.4.items.0:
  source: Who should handle financial and legal matters if you cannot
  value: Quem deve tratar de questões financeiras e jurídicas caso você não possa fazê-lo
groups.4.items.1:
  source: What authority that person may need
  value: Qual autoridade essa pessoa pode precisar
groups.4.items.2:
  source: Who should serve as the backup agent
  value: Quem deve atuar como agente substituto
groups.4.items.3:
  source: Any business, property, benefits, or family responsibilities the agent should understand
  value: Quais negócios, propriedades, benefícios ou responsabilidades familiares o agente deve compreender
groups.5.title:
  source: Health care decisions
  value: Decisões de cuidados de saúde
groups.5.items.0:
  source: Who should serve as health care representative and alternate
  value: Quem deve atuar como representante de cuidados de saúde e substituto
groups.5.items.1:
  source: Treatment preferences or values you want that person to understand
  value: Preferências de tratamento ou valores que você deseja que essa pessoa compreenda
groups.5.items.2:
  source: Physicians and family members who should receive a copy
  value: Médicos e familiares que devem receber uma cópia
groups.5.items.3:
  source: Existing forms that may need review or replacement
  value: Formulários existentes que podem precisar de revisão ou substituição
groups.6.title:
  source: Questions for the consultation
  value: Perguntas para a consulta
groups.6.items.0:
  source: What prompted you to consider planning now?
  value: O que o motivou a considerar o planejamento agora?
groups.6.items.1:
  source: What are you most concerned could become confusing or difficult?
  value: O que mais o preocupa quanto à possibilidade de tornar-se confuso ou difícil?
groups.6.items.2:
  source: Are there family relationships or special needs the documents should account for?
  value: Existem relacionamentos familiares ou necessidades especiais que os documentos devem prever?
groups.6.items.3:
  source: Which decisions are you ready to make, and which ones still feel uncertain?
  value: Quais decisões você está pronto para tomar e quais ainda parecem incertas?
groups.6.items.4:
  source: How soon do you need assistance?
  value: Com que brevidade você precisa de assistência?
finalCta.title:
  source: You do not need to finish the checklist before calling.
  value: Você não precisa terminar o checklist antes de ligar.
finalCta.body:
  source: A free initial consultation can help you decide what information matters and what can wait until later.
  value: Uma consulta inicial gratuita pode ajudar você a decidir quais informações são importantes e o que pode esperar até mais tarde.
