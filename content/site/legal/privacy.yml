title: Privacy Policy
description: Read how Miranda Law may handle information submitted through this website and how to contact the firm with privacy questions.
updated: October 9, 2026
intro: This policy describes the general categories of information that may be processed through the Miranda Law website and related communications. It does not replace the firm's engagement agreement or explain the handling of an active client matter.
sections:
  - title: Information you choose to provide
    paragraphs:
      - You may choose to provide contact information and a general description of your legal needs when communicating with the firm. Do not submit confidential, highly sensitive, or time-sensitive information until Miranda Law confirms that the communication method is appropriate and that the firm represents you.
  - title: Website and analytics information
    paragraphs:
      - The website and its service providers may process technical information such as browser type, device type, referring page, pages visited, approximate location, and interaction data for security, performance, and website improvement.
      - The website may use analytics tools to understand aggregate traffic and page usage. The specific tools and settings may change as the website develops.
  - title: How information may be used
    paragraphs: []
    bullets:
      - Respond to inquiries and help schedule consultations
      - Evaluate whether the firm can consider a matter
      - Operate, secure, and improve the website
      - Maintain records and comply with legal or professional obligations
      - Prevent misuse, fraud, or threats to the website and its users
  - title: Service providers and legal requirements
    paragraphs:
      - Information may be received through the website, email, phone, text, WhatsApp, or other communication methods made available by the firm. Information may be processed by service providers that support hosting, communications, scheduling, analytics, security, or intake.
      - Brian Miranda and the office team monitor phone, text, WhatsApp, and email. The channels are not continuously monitored; inquiries are reviewed during the next business day. Do not use the website or these channels for emergencies, urgent deadlines, or confidential highly sensitive information.
      - Miranda Law retains or deletes inquiry records under its existing firm retention policy. Provider logs and records remain subject to the applicable provider terms. Information may also be disclosed when required by law, court process, professional obligation, or a good-faith need to protect rights and safety.
  - title: Questions and requests
    paragraphs:
      - Questions about this policy may be sent to bmiranda@bmirandalaw.com. The availability of particular privacy rights depends on the law that applies to the request.
