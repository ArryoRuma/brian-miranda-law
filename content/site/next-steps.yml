    en:
      title: What Happens Next
      eyebrow: What happens next
      heading: The next step is a conversation, not a commitment.
      lead: The questionnaire structure helps organize the consultation. Secure online intake is not connected yet; call or text the legal team to begin.
      steps:
        - id: documents
          title: Review the initial questions
          body: Use the preview to organize family, planning, and contact information.
        - id: schedule
          title: Schedule your free initial consultation
          body: Choose a time to discuss your questions and the general scope of assistance.
        - id: communicate
          title: Review possible options
          body: Brian explains what documents or next steps may fit your circumstances.
      cta: Return to the questionnaire
