about:
  path: /about
  title: About Brian Miranda
  metaDescription: Meet Brian M. Miranda, Esq. and learn about Miranda Law's clear, responsive, multilingual approach to serving North Jersey families.
  hero:
    eyebrow: About Brian
    title: Meet Brian Miranda
    lead: Brian M. Miranda, Esq. helps North Jersey individuals and families with estate planning. His approach is personal and practical, with clear explanations and service available in English, Spanish, and Portuguese.
    image: /images/brian-old-headshot.jpg
    imageAlt: Brian M. Miranda, Esq.
    secondaryHref: /contact
    secondaryLabel: Schedule a Free Initial Consultation
  sections:
    - type: narrative
      id: background
      title: A Hillside foundation.
      body:
        - Brian Miranda grew up in Hillside, New Jersey, in a blue-collar family where hard work was a daily example. Working in construction with his father and uncle helped shape his practical approach.
        - Brian grew up bilingual and learned English as a second language. That experience gives him a personal understanding of how much clear communication matters when legal issues feel unfamiliar.
    - type: checklist
      id: education
      title: Education
      bullets:
        - Bachelor of Science in Business Administration — Seton Hall University
        - Juris Doctor — New York Law School
    - type: checklist
      id: admissions
      title: Bar admissions
      bullets:
        - New Jersey
        - New York
        - U.S. District Court for the District of New Jersey
    - type: cards
      id: approach
      title: Working with Brian
      cards:
        - title: Clear explanations
          body: Brian explains the available options and their tradeoffs in plain language. You have room to ask questions as the agreed documents are prepared and reviewed, and to understand what was signed and what comes next.
        - title: Personal recommendations
          body: The conversation begins with your family, property, responsibilities, and goals. Those details guide the recommendations, including what future changes may call for another review of your plan.
        - title: Responsive communication
          body: The legal team handles intake and scheduling through phone, text, and WhatsApp.
    - type: narrative
      eyebrow: Serving North Jersey
      title: Serving North Jersey’s multilingual families
      body:
        - Miranda Law primarily serves North Jersey, including Monmouth County and communities north of it. The Warren office gives clients a local place to begin, while the firm's phone, text, and WhatsApp options help make communication easier.
        - Approximately half of the firm's clients are Spanish- or Portuguese-speaking. Multilingual service is not an add-on; it is part of how the practice works every day.
        - English, Spanish, and Portuguese communication is available throughout the client experience.
      id: community
  finalCta:
    title: Bring the questions you have now.
    body: You do not need to solve every decision before calling. A free initial consultation is a place to understand what may come next.
