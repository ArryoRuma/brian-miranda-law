intro:
  eyebrow: Free initial consultation
  title: Choose the easiest way to reach the office.
  body: The legal team handles initial intake and scheduling. A first conversation helps the firm understand the general nature of your matter and determine an appropriate next step.
  note: Contacting the firm does not create an attorney-client relationship. Please do not send confidential or time-sensitive information until the firm confirms representation.
