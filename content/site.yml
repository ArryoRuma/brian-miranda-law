      "Approved Google reviews and client testimonials will be published here after they have been verified and cleared for use.": "Avaliações aprovadas do Google e depoimentos de clientes serão publicados aqui após serem verificados e autorizados para uso."
      "Verified client reviews coming soon": "Avaliações de clientes verificadas em breve"
      "Estate planning FAQs": "Perguntas Frequentes sobre Planejamento Patrimonial"
      "Questions About Estate Planning?": "Dúvidas Sobre Planejamento Patrimonial?"
      "Start with clear answers to a few of the questions New Jersey families ask most often.": "Comece com respostas claras para algumas das perguntas que as famílias de New Jersey mais fazem."
      "View Estate Planning FAQs": "Ver Perguntas Fiduciárias de Planejamento Patrimonial"
      "Do I need an estate plan if I am not wealthy?": "Eu preciso de um plano patrimonial se não for rico?"
      "Estate planning is not only about wealth. It can help you name decision-makers, document your wishes, prepare for incapacity, and make important matters clearer for the people you love.": "O planejamento patrimonial não trata apenas de riqueza. Ele pode ajudá-lo a nomear tomadores de decisão, documentar seus desejos, preparar-se para uma incapacidade e tornar questões importantes mais claras para as pessoas que você ama."
      "What documents are commonly included in an estate plan?": "Quais documentos são comumente incluídos em um plano patrimonial?"
      "Depending on your circumstances, an estate plan may include a will, trust, power of attorney, and healthcare directive. We’ll help you understand which documents make sense for your situation.": "Dependendo das suas circunstâncias, um plano patrimonial pode incluir um testamento, trust (fideicomisso), procuração e diretiva de cuidados de saúde. Nós ajudaremos você a entender quais documentos fazem sentido para a sua situação."
      "How much does estate planning cost?": "Quanto custa o planejamento patrimonial?"
      "The cost depends on the documents and complexity involved. After your free initial consultation, we’ll explain what your situation requires and the associated fees before moving forward.": "O custo depende dos documentos e da complexidade envolvida. Após sua consulta inicial gratuita, explicaremos o que sua situação exige e as taxas associadas antes de prosseguirmos."
      "What happens during the initial consultation?": "O que acontece durante a consulta inicial?"
      "We’ll learn about your family, priorities, property, existing documents, and questions, then explain the options that may fit your goals. You do not need to arrive with every decision already made.": "Conheceremos sua família, prioridades, propriedades, documentos existentes e dúvidas, para então explicar as opções que podem se adequar aos seus objetivos. Você não precisa chegar com todas as decisões já tomadas."
      "Can Miranda Law assist me in Spanish or Portuguese?": "A Miranda Law pode me atender em espanhol ou português?"
      "Yes. Miranda Law serves clients in English, Spanish, and Portuguese so you can discuss important legal decisions in the language you’re most comfortable using.": "Sim. A Miranda Law atende clientes em inglês, espanhol e português, para que você possa discutir decisões jurídicas importantes no idioma com o qual se sente mais confortável."
      "Does Miranda Law offer virtual consultations?": "A Miranda Law oferece consultas virtuais?"
      "Consultation formats may depend on your circumstances. Contact Miranda Law to ask whether a virtual consultation is available for your matter.": "Os formatos de consulta podem depender das suas circunstâncias. Entre em contato com a Miranda Law para verificar se uma consulta virtual está disponível para o seu caso."
      "Start your estate plan": "Inicie seu planejamento patrimonial"
      "The Best Time to Make a Plan Is Before Your Family Needs It.": "O melhor momento para fazer um plano é antes que sua família precise dele."
      "You don’t need to know which documents you need before contacting us. That’s what the consultation is for. Tell us a little about your situation and we’ll help you understand the next step.": "Você não precisa saber quais documentos são necessários antes de nos contatar. É para isso que serve a consulta. Conte-nos um pouco sobre sua situação e nós o ajudaremos a entender o próximo passo."
      "Available in": "Disponível em"
      "English · Español · Português": "English · Español · Português"
      "Estate Planning in North Jersey": "Planejamento Patrimonial no North Jersey"
      "Understand wills, trusts, powers of attorney, and health care directives with clear, multilingual estate-planning guidance from Miranda Law.": "Entenda testamentos, trust (fideicomisso), procurações e diretivas de cuidados de saúde com orientações claras e multilíngues sobre planejamento patrimonial da Miranda Law."
      "Estate planning for North Jersey families": "Planejamento patrimonial para famílias do North Jersey"
      "Make the important decisions": "Tome as decisões importantes"
      "before someone else has to.": "antes que outra pessoa precise tomá-las."
      "A thoughtful estate plan brings your wishes, decision-makers, and essential documents into one clear framework. Miranda Law helps families build that framework in English, Spanish, and Portuguese.": "Um planejamento patrimonial cuidadoso reúne seus desejos, tomadores de decisão e documentos essenciais em uma estrutura clara. A Miranda Law ajuda as famílias a construir essa estrutura em inglês, espanhol e português."
      "Use the planning checklist": "Use o checklist de planejamento"
      "Why planning matters": "Por que o planejamento é importante"
      "Estate planning is about people as much as property.": "O planejamento patrimonial trata tanto de pessoas quanto de bens."
      "An estate plan can give the people you trust useful direction if you die or become unable to make decisions. It can also reduce the number of urgent choices your family must make during an already difficult time.": "Um planejamento patrimonial pode fornecer uma orientação útil às pessoas em quem você confia, caso você faleça ou se torne incapaz de tomar decisões. Também pode reduzir o número de escolhas urgentes que sua família precisará fazer durante um período que já é difícil por si só."
      "The right documents depend on your family, assets, responsibilities, and goals. The work begins by understanding those facts—not by reaching for a one-size-fits-all package.": "Os documentos corretos dependem da sua família, bens, responsabilidades e objetivos. O trabalho começa pela compreensão desses fatos — e não pela busca por um pacote padronizado."
      "What a plan can do": "O que um plano pode fazer"
      "Put your decisions in writing.": "Registre suas decisões por escrito."
      "Explain how you want property handled after your death.": "Explique como deseja que seus bens sejam administrados após o seu falecimento."
      "Nominate the people you want to manage your estate and carry out your instructions.": "Nomeie as pessoas que você deseja que administrem seu espólio e cumpram suas instruções."
      "Choose someone to address financial and legal matters if you cannot act for yourself.": "Escolha alguém para tratar de questões financeiras e jurídicas caso você não possa agir por si mesmo."
      "Name a health care representative and communicate medical preferences.": "Nomeie um representante de cuidados de saúde e comunique suas preferências médicas."
      "Create practical guidance for children, dependents, caregivers, and loved ones.": "Crie orientações práticas para filhos, dependentes, cuidadores e entes queridos."
      "Coordinate existing documents after marriage, divorce, a birth, a death, retirement, or a major financial change.": "Coordene os documentos existentes após casamento, divórcio, nascimento, falecimento, aposentadoria ou uma mudança financeira significativa."
      "Core documents": "Documentos essenciais"
      "The pieces of a coordinated estate plan.": "As partes de um planejamento patrimonial coordenado."
      "State how property should be distributed, nominate an executor, and document other important wishes.": "Declare como os bens devem ser distribuídos, nomeie um executor e documente outros desejos importantes."
      "Create a structure for holding, managing, and transferring selected assets under written terms.": "Crie uma estrutura para manter, gerir e transferir ativos selecionados sob termos escritos (fideicomisso/trust)."
      "Authorize a trusted person to handle defined financial or legal matters on your behalf.": "Autorize uma pessoa de confiança para tratar de questões financeiras ou jurídicas definidas em seu nome."
      "Choose a health care representative and communicate treatment preferences for a time when you cannot decide for yourself.": "Escolha um representante de cuidados de saúde e comunique suas preferências de tratamento para um período em que você não possa decidir por si mesmo."
      "How it works together": "Como tudo funciona em conjunto"
      "Different questions call for different documents.": "Diferentes questões exigem diferentes documentos."
      "Your wishes and property": "Seus desejos e bens"
      "A will—and, when appropriate, a trust—can address how selected assets should be managed and transferred.": "Um testamento — e, quando apropriado, um trust (fideicomisso) — pode tratar de como ativos selecionados devem ser administrados e transferidos."
      "Financial incapacity": "Incapacidade financeira"
      "A power of attorney can identify who may act for you and define the authority that person receives.": "Uma procuração pode identificar quem pode agir por você e definir a autoridade que essa pessoa recebe."
      "Medical incapacity": "Incapacidade médica"
      "A health care directive can identify your representative and preserve guidance about treatment decisions.": "Uma diretiva de cuidados de saúde pode identificar seu representante e preservar orientações sobre decisões de tratamento."
      "Who planning is for": "Para quem é o planejamento"
      "You do not need to be wealthy to need a plan.": "Você não precisa ser rico para precisar de um plano."
      "Parents and guardians of minor children": "Pais e tutores de menores de idade"
      "Homeowners and people with financial accounts or personal property": "Proprietários de imóveis e pessoas com contas financeiras ou bens pessoais"
      "Married and unmarried couples": "Casais casados e não casados"
      "Business owners and independent professionals": "Proprietários de empresas e profissionais autônomos"
      "People preparing for retirement": "Pessoas que estão se preparando para a aposentadoria"
      "Adults helping parents or caring for other relatives": "Adultos que auxiliam pais ou cuidam de outros parentes"
      "Anyone whose family, health, assets, or responsibilities have recently changed": "Qualquer pessoa cuja família, saúde, patrimônio ou responsabilidades tenham mudado recentemente"
      "The Miranda Law process": "O processo da Miranda Law"
      "A practical route from questions to signed documents.": "Um caminho prático, das perguntas aos documentos assinados."
      "Start with a conversation about your family, existing documents, concerns, and goals.": "Comece com uma conversa sobre sua família, documentos existentes, preocupações e objetivos."
      "Review the planning options": "Revise as opções de planejamento"
      "Brian explains the available approaches in plain language and identifies the questions that matter most.": "Brian explica as abordagens disponíveis em linguagem clara e identifica as perguntas mais importantes."
      "Prepare and review": "Prepare e revise"
      "The firm drafts the agreed documents and walks through what they mean before anything is finalized.": "O escritório redige os documentos acordados e explica o significado de cada um antes que tudo seja finalizado."
      "Sign and carry the plan forward": "Assine e dê continuidade ao plano"
      "Complete the required formalities, understand where documents should be kept, and know when a future review may be useful.": "Conclua as formalidades necessárias, entenda onde os documentos devem ser guardados e saiba quando uma revisão futura poderá ser útil."
      "Why Miranda Law": "Por que escolher a Miranda Law"
      "Clear guidance, responsive communication, and room for questions.": "Orientação clara, comunicação ágil e espaço para suas dúvidas."
      "Personalized recommendations based on your circumstances and goals.": "Recomendações personalizadas com base em suas circunstâncias e objetivos."
      "Service in English, Spanish, and Portuguese.": "Atendimento em inglês, espanhol e português."
      "Phone, text, and WhatsApp communication with the office.": "Comunicação via telefone, SMS e WhatsApp com o escritório."
      "A North Jersey practice serving Monmouth County and communities north of it.": "Uma prática em North Jersey atendendo ao condado de Monmouth e comunidades ao norte deste."
      "A free initial consultation.": "Uma consulta inicial gratuita."
      "Many plans include a will, a financial power of attorney, and one or more health care directives. A trust may be appropriate depending on the assets, family circumstances, and goals involved.": "Muitos planos incluem um testamento, uma procuração financeira e uma ou mais diretivas de cuidados de saúde. Um trust (fideicomisso) pode ser apropriado dependendo dos ativos, das circunstâncias familiares e dos objetivos envolvidos."
      "Estate planning also addresses decision-making, incapacity, children, personal property, and the people who may be asked to act for you. Those questions can matter at many income and asset levels.": "O planejamento patrimonial também aborda tomada de decisão, incapacidade, filhos, bens pessoais e as pessoas que podem ser solicitadas a agir em seu nome. Essas questões podem ser importantes em diversos níveis de renda e patrimônio."
      "How often should I review my plan?": "Com que frequência devo revisar meu plano?"
      "A review can be useful after a marriage, divorce, birth, death, move, retirement, significant financial change, or change in the people you named. Periodic reviews can also confirm that the plan still reflects your wishes.": "Uma revisão pode ser útil após um casamento, divórcio, nascimento, morte, mudança, aposentadoria, alteração financeira significativa ou mudança nas pessoas designadas por você. Revisões periódicas também podem confirmar se o plano ainda reflete seus desejos."
      "What happens during the first consultation?": "O que acontece durante a primeira consulta?"
      "The conversation focuses on your family, assets, existing documents, concerns, and goals. You do not need to arrive with every decision already made.": "A conversa foca em sua família, ativos, documentos existentes, preocupações e objetivos. Você não precisa comparecer com todas as decisões já tomadas."
      "Fees depend on the documents and complexity involved. Miranda Law discusses the recommended scope and fee before legal work begins.": "Os honorários dependem dos documentos e da complexidade envolvida. A Miranda Law discute o escopo recomendado e os honorários antes do início do trabalho jurídico."
      "Yes. Miranda Law communicates with clients in English, Spanish, and Portuguese.": "Sim. A Miranda Law comunica-se com os clientes em inglês, espanhol e português."
      "About Brian Miranda": "Sobre Brian Miranda"
      "Meet Brian M. Miranda, Esq. and learn about Miranda Law's clear, responsive, multilingual approach to serving North Jersey families.": "Conheça Brian M. Miranda, Esq. e saiba mais sobre a abordagem clara, ágil e multilíngue da Miranda Law para atender as famílias de North Jersey."
      "Legal guidance should feel": "A orientação jurídica deve parecer"
      "clear, personal, and useful.": "clara, pessoal e útil."
      "Brian M. Miranda, Esq. leads a North Jersey practice built around direct communication, practical next steps, and long-term client relationships.": "Brian M. Miranda, Esq. lidera uma prática em North Jersey estruturada em torno da comunicação direta, próximos passos práticos e relacionamentos de longo prazo com os clientes."
      "A linen-bound planning book with organized legal documents": "Um livro de planejamento encadernado em linho com documentos jurídicos organizados"
      "Explore estate planning": "Explore o planejamento patrimonial"
      "The practice": "A prática"
      "A steady point of contact for important legal decisions.": "Um ponto de contato constante para decisões jurídicas importantes."
      "Miranda Law works with individuals and families who want straightforward explanations and a plan they can understand. The estate-planning process is designed to turn broad concerns—about family, property, health, and the future—into a practical set of decisions.": "A Miranda Law trabalha com indivíduos e famílias que buscam explicações diretas e um plano que possam compreender. O processo de planejamento patrimonial é projetado para transformar preocupações amplas — sobre família, propriedades, saúde e o futuro — em um conjunto prático de decisões."
      "The firm also assists with select real estate, corporate, civil litigation and defense, municipal, immigration, and landlord-tenant matters.": "O escritório também presta assistência em questões selecionadas de direito imobiliário, empresarial, contencioso cível e defesa, municipal, imigração e locação (landlord-tenant)."
      "What clients can expect": "O que os clientes podem esperar"
      "Clear answers without unnecessary distance.": "Respostas claras, sem distanciamento desnecessário."
      "Plain-language explanations": "Explicações em linguagem simples"
      "Understand the purpose of each option, the decisions it requires, and how it relates to the rest of the plan.": "Compreenda o propósito de cada opção, as decisões que ela exige e como ela se relaciona com o restante do plano."
      "Personal recommendations": "Recomendações personalizadas"
      "The conversation begins with your actual family, assets, responsibilities, and priorities.": "A conversa começa com sua família real, bens, responsabilidades e prioridades."
      "Responsive communication": "Comunicação responsiva"
      "The legal team handles intake and scheduling through phone, text, and WhatsApp.": "A equipe jurídica realiza o atendimento inicial e o agendamento por meio de telefone, SMS e WhatsApp."
      "Multilingual service": "Atendimento multilíngue"
      "English, Spanish, and Portuguese communication is available throughout the client experience.": "Comunicação em inglês, espanhol e português está disponível durante toda a experiência do cliente."
      "Serving North Jersey": "Atendendo North Jersey"
      "Local counsel for multilingual families.": "Assessoria jurídica local para famílias multilíngues."
      "Miranda Law primarily serves North Jersey, including Monmouth County and communities north of it. The Warren office gives clients a local place to begin, while the firm's phone, text, and WhatsApp options help make communication easier.": "A Miranda Law atende principalmente North Jersey, incluindo o condado de Monmouth e as comunidades ao norte deste. O escritório de Warren oferece aos clientes um local local para iniciar, enquanto as opções de telefone, SMS e WhatsApp do escritório ajudam a facilitar a comunicação."
      "Approximately half of the firm's clients are Spanish- or Portuguese-speaking. Multilingual service is not an add-on; it is part of how the practice works every day.": "Aproximadamente metade dos clientes do escritório fala espanhol ou português. O atendimento multilíngue não é um adicional; é parte da forma como a prática opera todos os dias."
      "Approach to estate planning": "Abordagem ao planejamento patrimonial"
      "Listen first. Explain the options. Build the plan carefully.": "Primeiro ouvir. Explicar as opções. Elaborar o plano cuidadosamente."
      "Understand": "Compreender"
      "Discuss the people, property, responsibilities, and changes that bring you to the conversation.": "Discutir as pessoas, propriedades, responsabilidades e mudanças que o trouxeram a esta conversa."
      "Explain": "Explicar"
      "Review possible documents and tradeoffs in language that makes the choices easier to follow.": "Revisar possíveis documentos e compensações em uma linguagem que torne as escolhas mais fáceis de compreender."
      "Prepare": "Preparar"
      "Draft and review the agreed plan with enough room to ask questions before signing.": "Redigir e revisar o plano acordado com margem suficiente para fazer perguntas antes da assinatura."
      "Carry forward": "Dar continuidade"
      "Leave knowing what was signed, where it belongs, and what kinds of future changes may call for another review.": "Sair sabendo o que foi assinado, onde o documento deve ser guardado e quais tipos de mudanças futuras podem exigir uma nova revisão."
      "Bring the questions you have now.": "Traga as perguntas que você tem agora."
      "You do not need to solve every decision before calling. A free initial consultation is a place to understand what may come next.": "Você não precisa resolver todas as decisões antes de ligar. Uma consulta inicial gratuita é um espaço para compreender o que pode vir a seguir."
      "Estate Planning Resources": "Recursos de Planejamento Patrimonial"
      "Use Miranda Law's estate-planning FAQs, preparation checklist, and video resources to organize questions before a consultation.": "Utilize o FAQ de planejamento patrimonial, o checklist de preparação e os recursos em vídeo da Miranda Law para organizar suas dúvidas antes de uma consulta."
      "Estate planning resources": "Recursos de planejamento patrimonial"
      "Start informed.": "Comece informado."
      "You do not have to start certain.": "Você não precisa começar com certezas."
      "These resources are designed to help you organize the people, property, documents, and questions you may want to discuss with an attorney.": "Estes recursos foram desenvolvamente projetados para ajudá-lo a organizar as pessoas, propriedades, documentos e perguntas que você pode desejar discutir com um advogado."
      "Read common questions": "Leia as perguntas comuns"
      "Prepare at your pace": "Prepare-se no seu próprio ritmo"
      "Three ways to make the first conversation easier.": "Três formas de tornar a primeira conversa mais fácil."
      "Plain-language answers to common questions about documents, timing, cost, and the first consultation.": "Respostas em linguagem clara para perguntas comuns sobre documentos, prazos, custos e a primeira consulta."
      "Browse the FAQs": "Navegue pelo FAQ"
      "A practical list of information and decisions to gather. Complete what you can and leave the rest for the conversation.": "Uma lista prática de informações e decisões a serem reunidas. Conclua o que for possível e deixe o restante para a conversa."
      "Open the checklist": "Abra o checklist"
      "Short explanations of estate-planning concepts and the questions families commonly bring to the office.": "Explicações breves sobre conceitos de planejamento patrimonial e as perguntas que as famílias comumente trazem ao escritório."
      "Visit the video library": "Visite a biblioteca de vídeos"
      "A useful reminder": "Um lembrete útil"
      "General information is a starting point, not a personal legal plan.": "Informações gerais são um ponto de partida, não um plano jurídico pessoal."
      "Online resources can help you identify questions, but they cannot account for every family, asset, document, or legal issue. A consultation is where general information becomes a conversation about your circumstances.": "Recursos online podem ajudá-lo a identificar perguntas, mas não podem prever cada família, patrimônio, documento ou questão jurídica. Uma consulta é o momento em que as informações gerais se transformam em uma conversa sobre as suas circunstâncias particulares."
      "Miranda Law assists North Jersey clients with select real estate, corporate, litigation, municipal, immigration, and landlord-tenant matters.": "A Miranda Law auxilia clientes de North Jersey em questões selecionadas de direito imobiliário, empresarial, contencioso, municipal, imigração e locação (landlord-tenant)."
      "Practical counsel for": "Assessoria prática para"
      "the matters around the plan.": "as questões relacionadas ao seu plano."
      "In addition to estate planning, Miranda Law assists clients with select legal matters affecting property, business, immigration, and everyday disputes.": "Além do planejamento patrimonial, a Miranda Law auxilia clientes em questões jurídicas selecionadas que afetam propriedades, negócios, imigração e disputas cotidianas."
      "Ask about your matter": "Consulte-nos sobre o seu caso"
      "Areas of assistance": "Áreas de assistência"
      "Tell us what brings you here.": "Conte-nos o que o trouxe aqui."
      "Guidance for select residential and related property matters, from questions and documents through the next practical step.": "Orientação para questões residenciais selecionadas e propriedades relacionadas, desde dúvidas e documentos até a próxima etapa prática."
      "Corporate Matters": "Questões Corporativas"
      "Counsel for select business questions and transactions where clear documentation and risk awareness matter.": "Assessoria para questões e transações comerciais selecionadas, onde a documentação clara e a ciência de riscos são fundamentais."
      "Civil Litigation & Defense": "Litígios Cíveis e Defesa"
      "Representation in select civil disputes, with an early focus on the facts, available options, and proportionate next steps.": "Representação em disputas cíveis selecionadas, com foco inicial nos fatos, opções disponíveis e próximos passos proporcionais."
      "Municipal Matters": "Questões Municipais"
      "Assistance with select matters handled through New Jersey municipal courts and local processes.": "Assistência em questões selecionadas tratadas por meio dos tribunais municipais de New Jersey e processos locais."
      "Support with select immigration matters for individuals and families, available in English, Spanish, and Portuguese.": "Suporte em questões de imigração selecionadas para indivíduos e famílias, disponível em inglês, espanhol e português."
      "Landlord & Tenant": "Locador e Locatário"
      "Guidance for select landlord-tenant questions and disputes involving rights, documents, and next steps.": "Orientação para questões e disputas selecionadas entre locadores e locatários que envolvam direitos, documentos e próximos passos."
      "The availability of representation depends on the facts, timing, jurisdiction, and any conflicts. Contact the office so the legal team can determine whether the matter is one Miranda Law can consider.": "A disponibilidade de representação depende dos fatos, prazos, jurisdição e eventuais conflitos de interesse. Entre em contato com o escritório para que a equipe jurídica possa determinar se o caso é algo que a Miranda Law pode assumir."
      "A coordinated perspective": "Uma perspectiva coordenada"
      "Legal matters rarely stay in one neat category.": "Questões jurídicas raramente permanecem em uma única categoria definida."
      "A real estate transaction can affect an estate plan. A business interest may need to be considered alongside family goals. An immigration or litigation matter can change what requires attention first.": "Uma transação imobiliária pode afetar um planejamento patrimonial. Um interesse comercial pode precisar ser considerado juntamente com os objetivos familiares. Uma questão de imigração ou litígio pode alterar o que exige atenção prioritária."
      "Miranda Law begins by understanding the immediate issue and its connection to the rest of the client's legal picture.": "A Miranda Law começa compreendendo o problema imediato e sua conexão com o panorama jurídico completo do cliente."
      "Contact Miranda Law": "Contate a Miranda Law"
      "Schedule a free initial consultation with Miranda Law in Warren, New Jersey by phone, text, WhatsApp, or email.": "Agende uma consulta inicial gratuita com a Miranda Law em Warren, New Jersey, por telefone, SMS, WhatsApp ou e-mail."
      "Take the first step": "Dê o primeiro passo"
      "toward a clearer plan.": "em direção a um plano mais claro."
      "Tell the legal team what brings you here. A free initial consultation is available, and the office can communicate by phone, text, WhatsApp, or email.": "Conte à equipe jurídica o que o trouxe aqui. Uma consulta inicial gratuita está disponível, e o escritório pode se comunicar por telefone, SMS, WhatsApp ou e-mail."
      "Organized planning documents and a linen-bound book": "Documentos de planejamento organizados e um livro encadernado em linho"
      "Wills Attorney in North Jersey": "Advogado de Testamentos no North Jersey"
      "Learn what a New Jersey will can address and speak with Miranda Law about documenting your wishes, executor, and estate plan.": "Saiba o que um testamento em New Jersey pode abranger e fale com a Miranda Law sobre a documentação de seus desejos, executor e planejamento patrimonial."
      "Put your wishes": "Coloque seus desejos"
      "into a plan others can follow.": "em um plano que outros possam seguir."
      "A will can state how property should be distributed, nominate the person who will administer your estate, and record other important decisions for the people you leave behind.": "Um testamento pode declarar como os bens devem ser distribuídos, nomear a pessoa que administrará seu espólio e registrar outras decisões importantes para as pessoas que você deixará."
      "See the complete estate plan": "Veja o planejamento patrimonial completo"
      "What is a will?": "O que é um testamento?"
      "A legal document for decisions that take effect after death.": "Um documento jurídico para decisões que entram em vigor após o falecimento."
      "A will records instructions for property governed by the will and nominates an executor to administer the estate. Parents may also use a will to nominate a guardian for minor children, subject to court review.": "Um testamento registra instruções para os bens regidos pelo testamento e nomeia um executor para administrar o espólio. Os pais também podem usar um testamento para nomear um tutor para filhos menores, sujeito à revisão judicial."
      "A will does not control every asset. Beneficiary designations, jointly owned property, trust assets, and other arrangements may operate separately, which is why coordination matters.": "Um testamento não controla todos os ativos. Designações de beneficiários, propriedades de propriedade conjunta, ativos em trust (fideicomisso) e outros arranjos podem operar separadamente, e é por isso que a coordenação é importante."
      "Why you may need one": "Por que você pode precisar de um"
      "Give your family written direction.": "Ofereça uma orientação por escrito à sua família."
      "You want to identify who should receive property governed by the will.": "Você deseja identificar quem deve receber os bens regidos pelo testamento."
      "You want to nominate an executor and a backup.": "Você deseja nomear um executor e um substituto."
      "You have minor children and want to record a guardian nomination.": "Você possui filhos menores de idade e deseja registrar a nomeação de um tutor."
      "You want to make selected gifts to people or organizations.": "Você deseja realizar legados específicos para pessoas ou organizações."
      "Your family structure or wishes differ from the default rules that may otherwise apply.": "A estrutura ou os desejos de sua família diferem das regras padrão que poderiam ser aplicadas de outra forma."
      "You already have a will, but the people, property, or instructions are out of date.": "Você já possui um testamento, mas as pessoas, os bens ou as instruções estão desatualizados."
      "What you can decide": "O que você pode decidir"
      "The people, gifts, and instructions at the center of the estate.": "As pessoas, os legados e as instruções no centro do planejamento patrimonial."
      "Executor": "Executor"
      "Nominate the person who should handle the estate and name an alternate if the first choice cannot serve.": "Nomeie a pessoa que deve administrar o espólio e indique um substituto caso a primeira escolha não possa assumir o cargo."
      "Beneficiaries": "Beneficiários"
      "Identify who should receive property governed by the will and how the remaining estate should be divided.": "Identifique quem deve receber os bens regidos pelo testamento e como o restante do espólio deve ser dividido."
      "Specific gifts": "Legados específicos"
      "Record selected gifts of property or amounts, while coordinating those instructions with the overall plan.": "Registre legados selecionados de bens ou valores, coordenando essas instruções com o plano geral."
      "Guardian nomination": "Nomeação de tutor"
      "Parents can state whom they want considered to care for minor children if a guardian becomes necessary.": "Os pais podem declarar quem desejam que seja considerado para cuidar de filhos menores, caso a nomeação de um tutor se torne necessária."
      "Who should consider a will": "Quem deve considerar um testamento"
      "A foundational document for many adults.": "Um documento fundamental para muitos adultos."
      "Parents and guardians": "Pais e tutores"
      "Homeowners and people with personal property": "Proprietários de imóveis e pessoas com bens pessoais"
      "Married and unmarried partners": "Parceiros casados e não casados"
      "People with stepchildren or blended families": "Pessoas com enteados ou famílias reconstituídas"
      "Business owners": "Proprietários de empresas"
      "Anyone who wants to choose an executor rather than leave administration entirely to default procedures": "Qualquer pessoa que deseje escolher um executor em vez de deixar a administração inteiramente a cargo dos procedimentos padrão"
      "What happens without one": "O que acontece sem um"
      "New Jersey's default rules may decide what your document did not.": "As regras padrão de New Jersey podem decidir o que o seu documento não previu."
      "When a person dies without a valid will, New Jersey's intestacy rules govern the distribution of probate property. A court process may also be needed to appoint an administrator rather than confirm an executor named in a will.": "Quando uma pessoa falece sem um testamento válido, as regras de sucessão legítima de New Jersey regem a distribuição dos bens sujeitos ao inventário. Um processo judicial também pode ser necessário para nomear um administrador, em vez de confirmar um executor nomeado em um testamento."
      "Those default rules cannot account for every personal relationship or informal promise. A properly prepared will gives the legal process written instructions to work from.": "Essas regras padrão não podem considerar todos os relacionamentos pessoais ou promessas informais. Um testamento devidamente preparado fornece instruções escritas para orientar o processo legal."
      "Common misconceptions": "Equívocos comuns"
      "A will is important, but it is not the whole plan.": "Um testamento é importante, mas não é o plano completo."
      "“A will avoids probate.”": "“Um testamento evita o inventário.”"
      "A will generally provides instructions for probate rather than eliminating the process by itself.": "Um testamento geralmente fornece instruções para o inventário, em vez de eliminar o processo por si só."
      "“My family already knows what I want.”": "“Minha família já sabe o que eu quero.”"
      "Conversations are valuable, but they do not replace a properly executed legal document.": "Conversas são valiosas, mas não substituem um documento legal devidamente executado."
      "“A will covers incapacity.”": "“Um testamento cobre incapacidade.”"
      "Financial powers of attorney and health care directives address decisions during life if you cannot act for yourself.": "Procurações financeiras e diretivas de cuidados de saúde tratam de decisões durante a vida, caso você não possa agir por si mesmo."
      "How it fits": "Como tudo se integra"
      "Coordinate the will with the rest of the estate plan.": "Coordene o testamento com o restante do planejamento patrimonial."
      "A will works alongside beneficiary designations, ownership arrangements, trusts, powers of attorney, and health care directives. Reviewing those pieces together can reveal gaps or conflicting instructions before they become someone else's problem.": "Um testamento funciona em conjunto com designações de beneficiários, arranjos de propriedade, trust (fideicomisso), procurações e diretivas de cuidados de saúde. Revisar esses elementos em conjunto pode revelar lacunas ou instruções conflitantes antes que se tornem um problema para outra pessoa."
      "From a first conversation to a finished document.": "Da primeira conversa ao documento finalizado."
      "Discuss your current documents, family, property, concerns, and goals.": "Discutiremos seus documentos atuais, família, propriedades, preocupações e objetivos."
      "Review the options": "Analise as opções"
      "Understand the purpose, limits, and decisions involved before choosing a direction.": "Compreenda o propósito, os limites e as decisões envolvidas antes de escolher um caminho."
      "The firm drafts the document and reviews its terms with you in plain language.": "O escritório redige o documento e revisa seus termos com você em linguagem clara e acessível."
      "Sign and finalize": "Assine e finalize"
      "Complete the required formalities and understand how the document fits with the rest of the plan.": "Conclua as formalidades necessárias e compreenda como o documento se integra ao restante do planejamento patrimonial."
      "Why work with Miranda Law": "Por que trabalhar com a Miranda Law"
      "Personal guidance with accessible communication.": "Orientação personalizada com comunicação acessível."
      "Clear explanations centered on the decisions you need to make.": "Explicações claras focadas nas decisões que você precisa tomar."
      "Recommendations based on your family, assets, and goals.": "Recomendações baseadas em sua família, patrimônio e objetivos."
      "A free initial consultation to understand the possible scope.": "Uma consulta inicial gratuita para entender o possível escopo."
      "Can I write my own will?": "Eu posso escrever meu próprio testamento?"
      "A will must satisfy legal requirements to be valid. Legal guidance can also help coordinate the document with beneficiary designations, jointly owned property, and the rest of the estate plan.": "Um testamento deve satisfazer os requisitos legais para ser válido. A orientação jurídica também pode ajudar a coordenar o documento com designações de beneficiários, bens de propriedade conjunta e o restante do planejamento patrimonial."
      "Does a will control every asset I own?": "O testamento controla todos os bens que possuo?"
      "Not necessarily. Assets with beneficiary designations, jointly owned property, and trust assets may pass under separate arrangements.": "Não necessariamente. Bens com designações de beneficiários, propriedades em regime de copropriedade e ativos em um trust (fideicomisso) podem ser transferidos por meio de arranjos distintos."
      "Can I name a guardian for my children?": "Posso nomear um tutor para meus filhos?"
      "A parent can use a will to nominate a guardian for minor children. A court makes the final appointment based on the applicable law and circumstances.": "Um pai ou mãe pode usar um testamento para nomear um tutor para filhos menores. O tribunal fará a nomeação final com base na lei aplicável e nas circunstâncias."
      "When should I update my will?": "Quando devo atualizar meu testamento?"
      "A review can be useful after marriage, divorce, a birth, a death, a move, a major change in property, or a change in the people you named.": "Uma revisão pode ser útil após casamento, divórcio, nascimento, falecimento, mudança de residência, uma alteração importante no patrimônio ou uma mudança nas pessoas que você nomeou."
      "Where should I keep the signed will?": "Onde devo guardar o testamento assinado?"
      "Keep it somewhere secure but accessible to the people who may need it. The firm can discuss practical storage and whether any registry or other arrangement is appropriate.": "Guarde-o em um local seguro, mas acessível às pessoas que possam precisar dele. O escritório pode discutir métodos práticos de armazenamento e se algum registro ou outro arranjo é apropriado."
      "Trusts Attorney in North Jersey": "Advogado de Trust (Fideicomisso) em North Jersey"
      "Understand how trusts can hold and manage assets under written terms and speak with Miranda Law about whether a trust fits your estate plan.": "Entenda como os trusts podem deter e gerir ativos sob termos escritos e fale com a Miranda Law sobre se um trust se adequa ao seu planejamento patrimonial."
      "Create structure for": "Crie uma estrutura para"
      "how selected assets are managed.": "como ativos selecionados são gerenciados."
      "A trust can place selected property under written terms for the benefit of the people or purposes you choose. Whether one belongs in your plan depends on what you own, what you want to accomplish, and how the trust will be maintained.": "Um trust pode colocar propriedades selecionadas sob termos escritos para o benefício das pessoas ou finalidades que você escolher. Se um deve integrar seu plano depende do que você possui, do que deseja alcançar e de como o trust será mantido."
      "What is a trust?": "O que é um trust?"
      "A legal relationship built around property, instructions, and responsibility.": "Uma relação jurídica construída em torno de propriedade, instruções e responsabilidade."
      "A trust generally involves a trustee who holds or manages property under written terms for one or more beneficiaries. The person creating the trust decides its purpose and the rules that apply, within the limits of the law.": "Um trust geralmente envolve um administrador (trustee) que detém ou gere propriedades sob termos escritos para um ou mais beneficiários. A pessoa que cria o trust decide seu propósito e as regras aplicáveis, dentro dos limites da lei."
      "There are many kinds of trusts. The right structure—and whether a trust is useful at all—depends on the goals and assets involved.": "Existem muitos tipos de trusts. A estrutura correta — e se um trust é útil ou não — depende dos objetivos e dos ativos envolvidos."
      "Add control where a simple transfer may not be enough.": "Adicione controle onde uma transferência simples pode não ser suficiente."
      "You want property managed for a child or another beneficiary over time.": "Você deseja que propriedades sejam gerenciadas para um filho ou outro beneficiário ao longo do tempo."
      "You want a successor trustee to manage trust property if you cannot.": "Você deseja um administrador sucessor para gerir os bens do trust caso você não possa fazê-lo."
      "You want to set conditions or timing for distributions.": "Você deseja estabelecer condições ou prazos para distribuições."
      "You have a blended family or responsibilities that require careful coordination.": "Você possui uma família reconstituída ou responsabilidades que exigem uma coordenação cuidadosa."
      "You want a plan for selected property that continues beyond your lifetime.": "Você deseja um plano para propriedades selecionadas que continue além da sua vida."
      "You have an existing trust that has not been reviewed or properly coordinated with current assets.": "Você possui um trust existente que não foi revisado ou devidamente coordenado com seus ativos atuais."
      "Define who manages, who benefits, and how the terms work.": "Defina quem administra, quem se beneficia e como os termos funcionam."
      "Trustee": "Administrador (Trustee)"
      "Choose the person or institution responsible for following the trust terms and name appropriate successors.": "Escolha a pessoa ou instituição responsável por seguir os termos do trust e nomeie sucessores apropriados."
      "Identify who may benefit and under what circumstances distributions may be made.": "Identifique quem pode ser beneficiado e sob quais circunstâncias as distribuições podem ser feitas."
      "Property": "Patrimônio"
      "Determine which assets should be transferred to or coordinated with the trust.": "Determine quais ativos devem ser transferidos para o trust (fideicomisso) ou coordenados com ele."
      "Timing and purpose": "Cronograma e finalidade"
      "Set a framework for when property may be used, distributed, or retained for future needs.": "Estabeleca uma estrutura para definir quando o patrimônio poderá ser utilizado, distribuído ou retido para necessidades futuras."
      "Who should consider a trust": "Quem deve considerar um trust (fideicomisso)"
      "Useful in the right plan—not automatically necessary in every plan.": "Útil no plano adequado — não é automaticamente necessário em todos os planos."
      "Parents planning for minor children": "Pais que estão planejando o futuro de filhos menores"
      "Families supporting a beneficiary who may need ongoing management": "Famílias que apoiam um beneficiário que possa necessitar de gestão contínua"
      "Homeowners and people with property in more than one jurisdiction": "Proprietários de imóveis e pessoas com bens em mais de uma jurisdição"
      "Blended families": "Famílias recompostas"
      "People who want a successor structure for managing selected assets during incapacity": "Pessoas que desejam uma estrutura sucessora para a gestão de ativos selecionados durante períodos de incapacidade"
      "The result depends on the rest of the plan.": "O resultado depende do restante do planejamento."
      "A trust is not required for every estate. Without one, property may still pass through a will, beneficiary designation, joint ownership, or other legal arrangement.": "Um trust (fideicomisso) não é obrigatório para todo espólio. Sem ele, os bens ainda podem ser transmitidos por meio de um testamento, designação de beneficiários, propriedade conjunta ou outros arranjos legais."
      "The practical question is whether those alternatives provide enough control, continuity, and coordination for your circumstances.": "A questão prática é se essas alternativas oferecem controle, continuidade e coordenação suficientes para as suas circunstâncias."
      "A signed trust is only the beginning.": "Um trust (fideicomisso) assinado é apenas o começo."
      "“Every family needs a trust.”": "“Toda família precisa de um trust (fideicomisso).”"
      "Some goals can be handled effectively through other documents and ownership arrangements.": "Alguns objetivos podem ser alcançados de forma eficaz por meio de outros documentos e arranjos de propriedade."
      "“A trust works automatically once signed.”": "“Um trust (fideicomisso) funciona automaticamente após a assinatura.”"
      "A trust generally must be funded or coordinated with the relevant assets to do the work it was designed to do.": "Geralmente, um trust (fideicomisso) deve ser integralizado ou coordenado com os ativos relevantes para cumprir a função para a qual foi projetado."
      "“A trust replaces every other document.”": "“Um trust (fideicomisso) substitui todos os outros documentos.”"
      "Wills, powers of attorney, health care directives, and beneficiary designations may still be essential.": "Testamentos, procurações, diretivas de cuidados de saúde e designações de beneficiários ainda podem ser essenciais."
      "Connect the trust to the will, titles, and beneficiary designations.": "Conecte o trust (fideicomisso) ao testamento, títulos de propriedade e designações de beneficiários."
      "Trust planning is as much about coordination as drafting. The document, selected assets, ownership records, beneficiary designations, and the rest of the estate plan should point in the same direction.": "O planejamento de trust (fideilcomisso) trata tanto de coordenação quanto de redação. O documento, os ativos selecionados, os registros de propriedade, as designações de beneficiários e o restante do planejamento patrimonial devem apontar na mesma direção."
      "What is the difference between a will and a trust?": "Qual é a diferença entre um testamento e um trust (fideicomisso)?"
      "A will gives instructions for property governed by the will after death. A trust can hold and manage selected property under written terms during life, after death, or both.": "Um testamento fornece instruções para propriedades regidas pelo testamento após o falecimento. Um trust (fideicomisso) pode deter e gerir propriedades selecionadas sob termos escritos durante a vida, após a morte, ou ambos."
      "Does a trust avoid probate?": "Um trust (fideicomisso) evita o inventário (probate)?"
      "Property properly held in a trust may be administered under the trust terms rather than through probate, but assets left outside the trust may follow a different path.": "Propriedades devidamente mantidas em um trust (fideicomisso) podem ser administradas sob os termos do trust, em vez de passarem pelo processo de inventário, mas ativos deixados fora do trust podem seguir um caminho diferente."
      "Can I change a trust?": "Eu posso alterar um trust (fideicomisso)?"
      "That depends on the type of trust and its terms. Revocable and irrevocable trusts operate differently, so the document must be reviewed.": "Isso depende do tipo de trust (fideicomisso) e de seus termos. Trusts revogáveis e irrevogáveis operam de forma diferente, portanto, o documento deve ser revisado."
      "Who should serve as trustee?": "Quem deve atuar como administrador (trustee)?"
      "The choice depends on the responsibility involved, the people affected, the complexity of the property, and the candidate's judgment and availability.": "A escolha depende da responsabilidade envolvida, das pessoas afetadas, da complexidade da propriedade e do julgamento e disponibilidade do candidato."
      "What does it mean to fund a trust?": "O que significa financiar um trust (fideicomisso)?"
      "Funding generally means transferring or coordinating selected assets so the trust can govern them. The necessary steps depend on the asset.": "Financiar geralmente significa transferir ou coordenar ativos selecionados para que o trust (fideicomisso) possa geri-los. As etapas necessárias dependem do ativo."
      "Powers of Attorney in North Jersey": "Procurações em North Jersey"
      "Learn how a financial power of attorney can authorize a trusted person to handle defined matters and speak with Miranda Law about your plan.": "Saiba como uma procuração financeira pode autorizar uma pessoa de confiança a lidar com assuntos definidos e fale com a Miranda Law sobre o seu plano."
      "Choose who may act": "Escolha quem pode agir"
      "when you cannot act for yourself.": "quando você não puder agir por si mesmo."
      "A power of attorney can authorize a trusted person to handle defined financial, legal, or practical matters on your behalf. Careful drafting helps make the authority clear before it is urgently needed.": "Uma procuração pode autorizar uma pessoa de confiança para lidar com assuntos financeiros, legais ou práticos definidos em seu nome. Uma redação cuidadosa ajuda a tornar a autoridade clara antes que ela seja necessária com urgência."
      "What is a power of attorney?": "O que é uma procuração?"
      "Written authority for a person you choose.": "Autoridade por escrito para uma pessoa de sua escolha."
      "A power of attorney names an agent to act for you within the authority described in the document. Depending on its terms, that authority may cover financial accounts, property, taxes, contracts, benefits, business interests, or other legal and practical matters.": "Uma procuração nomeia um procurador para agir em seu nome dentro da autoridade descrita no documento. Dependendo de seus termos, essa autoridade pode abranger contas financeiras, propriedades, impostos, contratos, benefícios, interesses comerciais ou outros assuntos jurídicos e práticos."
      "The document should be tailored to the authority you actually want to give and coordinated with institutions or arrangements that may have their own requirements.": "O documento deve ser adaptado à autoridade que você realmente deseja conceder e estar em conformidade com as instituições ou arranjos que possam ter seus próprios requisitos."
      "Prepare for a time when signatures and decisions cannot wait.": "Prepare-se para um momento em que assinaturas e decisões não puderem esperar."
      "You want someone to manage bills or financial accounts during incapacity.": "Você deseja que alguém gerencie contas ou contas financeiras durante uma incapacidade."
      "You own real estate or a business interest that may require ongoing action.": "Você possui imóveis ou interesses comerciais que podem exigir ações contínuas."
      "You want an agent to address taxes, benefits, insurance, or legal documents.": "Você deseja que um procurador trate de impostos, benefícios, seguros ou documentos legais."
      "You travel or may need help handling a limited transaction.": "Você viaja ou pode precisar de ajuda para realizar uma transação limitada."
      "You want a backup agent if the first person cannot serve.": "Você deseja um procurador substituto caso a primeira pessoa não possa exercer a função."
      "Your current document is old, too narrow, or names someone who is no longer appropriate.": "Seu documento atual é antigo, muito restrito ou nomeia alguém que não é mais apropriado."
      "Who acts, what they may do, and how the authority is limited.": "Quem age, o que pode fazer e como a autoridade é limitada."
      "Primary agent": "Procurador principal"
      "Choose a person you trust to follow the document and act with care.": "Escolha uma pessoa em quem você confie para seguir o documento e agir com cautela."
      "Successor agent": "Procurador sucessor"
      "Name a backup in case the first agent cannot or will not act.": "Nomeie um substituto caso o primeiro procurador não possa ou não queira agir."
      "Scope of authority": "Escopo da autoridade"
      "Describe the financial, legal, property, business, or other matters the agent may handle.": "Descreva as questões financeiras, jurídicas, patrimoniais, comerciais ou outros assuntos que o procurador poderá gerenciar."
      "Timing and limits": "Cronograma e limites"
      "Address when authority begins, whether it continues during incapacity, and any instructions or limits that should apply.": "Aborde quando a autoridade começa, se ela continua durante uma incapacidade e quaisquer instruções ou limites que devam ser aplicados."
      "Who should consider one": "Quem deve considerar uma"
      "Incapacity planning belongs in many adult estate plans.": "O planejamento de incapacidade faz parte de muitos planos de planejamento patrimonial para adultos."
      "Adults with financial accounts or recurring obligations": "Adultos com contas financeiras ou obrigações recorrentes"
      "Homeowners and business owners": "Proprietários de imóveis e empresários"
      "People approaching retirement": "Pessoas próximas da aposentadoria"
      "Caregivers and adults supporting family members": "Cuidadores e adultos que apoiam membros da família"
      "People with planned travel, medical procedures, or periods of limited availability": "Pessoas com viagens planejadas, procedimentos médicos ou períodos de disponibilidade limitada"
      "Anyone who wants to choose an agent before a court process may become necessary": "Qualquer pessoa que deseje escolher um procurador antes que um processo judicial se torne necessário"
      "Family members do not always receive automatic financial authority.": "Membros da família nem sempre recebem autoridade financeira automática."
      "If you become unable to manage financial or legal matters and no effective authority is in place, relatives may face delays, institutional barriers, or a court proceeding to obtain authority.": "Se você se tornar incapaz de gerir assuntos financeiros ou jurídicos e não houver uma autoridade efetiva estabelecida, os parentes podem enfrentar atrasos, barreiras institucionais ou um processo judicial para obter tal autoridade."
      "A power of attorney cannot prevent every difficulty, but it can provide a documented starting point and identify the person you chose.": "Uma procuração não pode evitar todas as dificuldades, mas pode fornecer um ponto de partida documentado e identificar a pessoa que você escolheu."
      "Authority should be deliberate, not vague.": "A autoridade deve ser deliberada, não vaga."
      "“My spouse or child can automatically handle everything.”": "“Meu cônjuge ou filho pode cuidar de tudo automaticamente.”"
      "Relationships alone may not give another person authority over individually held accounts or legal matters.": "Os relacionamentos por si só podem não conferir a outra pessoa autoridade sobre contas individuais ou questões jurídicas."
      "“A power of attorney replaces a will.”": "“Uma procuração substitui um testamento.”"
      "A power of attorney generally concerns authority during life; a will addresses instructions after death.": "Uma procuração geralmente diz respeito à autoridade durante a vida; um testamento trata de instruções após o falecimento."
      "“The broadest document is always best.”": "“O documento mais abrangente é sempre o melhor.”"
      "The appropriate authority depends on your goals, risks, and trust in the people being named.": "A autoridade apropriada depende dos seus objetivos, riscos e da confiança nas pessoas que estão sendo nomeadas."
      "Pair financial authority with health care planning.": "Combine a autoridade financeira com o planejamento de cuidados de saúde."
      "A financial power of attorney handles a different set of decisions from a health care directive. Keeping both documents current can create a more complete incapacity plan.": "Uma procuração financeira trata de um conjunto de decisões diferente de uma diretiva de cuidados de saúde. Manter ambos os documentos atualizados pode criar um plano de incapacidade mais completo."
      "When does a power of attorney take effect?": "Quando uma procuração entra em vigor?"
      "That depends on the document's terms and applicable law. The timing should be discussed and written clearly.": "Isso depende dos termos do documento e da lei aplicável. O momento deve ser discutido e escrito de forma clara."
      "Does the authority continue if I become incapacitated?": "A autoridade continua se eu ficar incapacitado?"
      "A durable power of attorney is designed to continue during incapacity, but the actual document must be reviewed for its terms and validity.": "Uma procuração durável é projetada para continuar durante a incapacidade, mas o documento real deve ser revisado quanto aos seus termos e validade."
      "Can I name more than one agent?": "Posso nomear mais de um procurador?"
      "A document may name co-agents or successors, but multiple agents can create practical questions about signatures, coordination, and disagreements.": "Um documento pode nomear co-procuradores ou sucessores, mas múltiplos procuradores podem gerar questões práticas sobre assinaturas, coordenação e divergências."
      "Can I revoke a power of attorney?": "Posso revogar uma procuração?"
      "A person with capacity can generally revoke authority, but effective revocation also requires practical notice to the agent and relevant institutions.": "Uma pessoa com capacidade mental pode, geralmente, revogar a autoridade, mas a revogação eficaz também exige a notificação prática ao procurador e às instituições relevantes."
      "Is a power of attorney the same as a health care proxy?": "Uma procuração é o mesmo que um procurador de cuidados de saúde?"
      "No. Financial powers of attorney and health care directives address different decisions and are usually documented separately.": "Não. Procurações financeiras e diretivas de cuidados de saúde tratam de decisões diferentes e geralmente são documentadas separadamente."
      "Health Care Directives in North Jersey": "Diretivas de Cuidados de Saúde em North Jersey"
      "Learn how New Jersey health care directives can name a representative and communicate treatment preferences if you cannot decide for yourself.": "Saiba como as diretivas de cuidados de saúde de New Jersey podem nomear um representante e comunicar preferências de tratamento caso você não possa decidir por si mesmo."
      "Give the people you trust": "Ofereça às pessoas em quem você confia"
      "clearer medical guidance.": "orientações médicas mais claras."
      "A health care directive can name a representative to make health care decisions if you become unable to decide and can record preferences that help guide difficult conversations.": "Uma diretiva de cuidados de saúde pode nomear um representante para tomar decisões médicas caso você fique impossibilitado de decidir, além de registrar preferências que auxiliem em conversas difíceis."
      "What is a health care directive?": "O que é uma diretiva de cuidados de saúde?"
      "A written plan for medical decision-making during incapacity.": "Um plano por escrito para a tomada de decisões médicas durante períodos de incapacidade."
      "New Jersey recognizes a proxy directive, which names a health care representative, and an instruction directive, often called a living will, which communicates treatment preferences.": "New Jersey reconhece a diretiva de procurador (proxy directive), que nomeia um representante de cuidados de saúde, e a diretiva de instrução, frequentemente chamada de testamento vital (living will), que comunica preferências de tratamento."
      "The representative's authority is intended for a time when you cannot make your own health care decisions. While you remain able to decide, your own decisions control.": "A autoridade do representante é destinada ao momento em que você não puder tomar suas próprias decisões de saúde. Enquanto você estiver apto a decidir, suas próprias decisões prevalecerão."
      "Make the conversation easier before a crisis.": "Facilite a conversa antes de uma crise."
      "You want to choose who should speak with physicians and make decisions if you cannot.": "Você deseja escolher quem deve falar com médicos e tomar decisões caso você não possa fazê-lo."
      "You want to name an alternate representative.": "Você deseja nomear um representante substituto."
      "You have treatment preferences or values you want your representative to understand.": "Você possui preferências de tratamento ou valores que deseja que seu representante compreenda."
      "You want family members and medical providers to have written guidance.": "Você deseja que familiares e profissionais médicos tenham orientações por escrito."
      "You have an older directive that names the wrong person or no longer reflects your wishes.": "Você possui uma diretiva antiga que nomeia a pessoa errada ou que não reflete mais seus desejos."
      "You are preparing for surgery, managing a health condition, or completing a broader estate plan.": "Você está se preparando para uma cirurgia, tratando uma condição de saúde ou concluindo um planejamento patrimonial mais amplo."
      "Choose a representative and communicate what matters to you.": "Escolha um representante e comunique o que é importante para você."
      "Health care representative": "Representante de cuidados de saúde"
      "Name the person authorized to make health care decisions if you are unable to do so.": "Nomeie a pessoa autorizada a tomar decisões de cuidados de saúde caso você não possa fazê-lo."
      "Alternate representative": "Representante substituto"
      "Choose a backup if the first person is unable, unwilling, or unavailable to serve.": "Escolha um reserva caso a primeira pessoa esteja impossibilitada, indisposta ou indisponível para exercer a função."
      "Treatment preferences": "Preferências de tratamento"
      "Provide guidance about treatments, life-sustaining measures, and the values that should shape decisions.": "Forneça orientações sobre tratamentos, medidas de suporte à vida e os valores que devem nortear as decisões."
      "People who receive copies": "Pessoas que recebem cópias"
      "Plan how representatives, family members, physicians, and health care facilities can access the directive when needed.": "Planeje como representantes, familiares, médicos e instituições de saúde podem acessar a diretiva quando necessário."
      "Advance directives are not only for older adults.": "As diretivas antecipadas não são destinadas apenas a idosos."
      "Any adult who wants to choose a health care representative": "Qualquer adulto que deseje escolher um representante para cuidados de saúde"
      "People preparing for surgery or managing an illness": "Pessoas em preparação para cirurgia ou tratando uma doença"
      "Parents, caregivers, and adults with family responsibilities": "Pais, cuidadores e adultos com responsabilidades familiares"
      "People whose relatives disagree about medical decisions": "Pessoas cujos parentes discordam sobre decisões médicas"
      "Adults whose closest trusted person may not otherwise be the obvious decision-maker": "Adultos cuja pessoa de confiança mais próxima possa não ser, de outra forma, o tomador de decisão óbvio"
      "Anyone completing or updating an estate plan": "Qualquer pessoa que esteja concluindo ou atualizando um planejamento patrimonial"
      "Loved ones may be left without your written choice or instructions.": "Seus entes queridos podem ficar sem sua escolha ou instruções por escrito."
      "Without a directive, medical providers and family members may have to determine who should participate in decisions and what you would have wanted without the benefit of your written guidance.": "Sem uma diretiva, os profissionais médicos e familiares podem ter que determinar quem deve participar das decisões e o que você desejaria, sem o benefício de suas orientações por escrito."
      "A directive cannot anticipate every medical circumstance, but it can identify the person you trust and give that person a clearer understanding of your values.": "Uma diretiva não pode antecipar todas as circunstâncias médicas, mas pode identificar a pessoa em quem você confia e proporcionar a essa pessoa uma compreensão mais clara de seus valores."
      "The document protects your voice; it does not replace it.": "O documento protege sua voz; ele não a substitui."
      "“My representative decides while I still can.”": "“Meu representante decide enquanto eu ainda posso.”"
      "Your representative acts only when you are unable to make your own health care decisions under the applicable standard.": "Seu representante atuará apenas quando você não for capaz de tomar suas próprias decisões de cuidados de saúde sob o padrão aplicável."
      "“A directive is only about end-of-life care.”": "“Uma diretiva trata apenas de cuidados de fim de vida.”"
      "A proxy directive can address health care decision-making more broadly during incapacity.": "Uma diretiva de procuração pode abordar a tomada de decisões de cuidados de saúde de forma mais ampla durante um período de incapacidade."
      "“Completing the form ends the conversation.”": "“Preencher o formulário encerra a conversa.”"
      "Discussing your values with the representative and sharing accessible copies are important parts of the plan.": "Discutir seus valores com o representante e compartilhar cópias acessíveis são partes importantes do planejamento."
      "Coordinate medical and financial decision-makers.": "Coordene os tomadores de decisões médicas e financeiras."
      "A health care representative addresses medical decisions, while an agent under a financial power of attorney may handle bills, insurance, accounts, and other practical matters. Both roles may be needed during the same period.": "Um representante de cuidados de saúde trata de decisões médicas, enquanto um agente sob uma procuração financeira pode lidar com contas, seguros, contas bancárias e outros assuntos práticos. Ambos os papéis podem ser necessários durante o mesmo período."
      "What is the difference between a proxy directive and a living will?": "Qual é a diferença entre uma diretiva de procurador e um testamento vital?"
      "A proxy directive names a health care representative. An instruction directive, often called a living will, records treatment preferences. A person may use one or both.": "Uma diretiva de procurador nomeia um representante de cuidados de prestação de saúde. Uma diretiva de instrução, frequentemente chamada de testamento vital, registra preferências de tratamento. Uma pessoa pode utilizar apenas uma ou ambas."
      "When can my representative make decisions?": "Quando meu representante pode tomar decisões?"
      "The representative acts when you have been determined unable to make your own health care decisions under the applicable process. If you regain capacity, your own decisions control again.": "O representante atua quando for determinado que você não tem capacidade para tomar suas próprias decisões de cuidados de saúde, conforme o processo aplicável. Se você recuperar a capacidade, suas próprias decisões voltam a prevalecer."
      "Who should receive a copy?": "Quem deve receber uma cópia?"
      "Consider providing copies to the primary and alternate representatives, appropriate family members, physicians, and health care facilities involved in your care.": "Considere fornecer cópias aos representantes principal e substituto, familiares apropriados, médicos e instituições de saúde envolvidas em seu atendimento."
      "Can I change my directive?": "Posso alterar minha diretiva?"
      "A person with capacity can generally update or revoke a directive. New copies should be shared so older instructions are not used by mistake.": "Uma pessoa com capacidade pode, geralmente, atualizar ou revogar uma diretiva. Novas cópias devem ser compartilhadas para que instruções antigas não sejam utilizadas por engano."
      "Is a POLST the same as an advance directive?": "Um POLST é o mesmo que uma diretiva antecipada?"
      "No. A POLST is a medical order used in particular serious-illness circumstances. It can complement, but does not automatically replace, an advance directive.": "Não. Um POLST é uma ordem médica utilizada em circunstâncias particulares de doenças graves. Ele pode complementar, mas não substitui automaticamente, uma diretiva antecipada."
      "Plain-language answers to common estate-planning questions about wills, trusts, incapacity documents, and working with Miranda Law.": "Respostas em linguagem clara para perguntas comuns sobre planejamento patrimonial, incluindo testamentos, trust (fideicomisso), documentos de incapacidade e a colaboração com a Miranda Law."
      "Clear answers create": "Respostas claras geram"
      "better questions.": "melhores perguntas."
      "Use these general answers to organize what you want to discuss. Your own plan should be based on your family, property, responsibilities, and goals.": "Use estas respostas gerais para organizar o que você deseja discutir. Seu próprio plano deve ser baseado em sua família, propriedades, responsabilidades e objetivos."
      "Open the planning checklist": "Abrir a lista de verificação do planejamento"
      "General information to help you prepare for a conversation.": "Informações gerais para ajudar você a se preparar para uma conversa."
      "Getting started": "Primeiros passos"
      "What documents are usually included in an estate plan?": "Quais documentos costumam ser incluídos em um planejamento patrimonial?"
      "Many plans include a will, financial power of attorney, and health care directives. A trust may be appropriate depending on the family, property, and goals involved.": "Muitos planos incluem um testamento, uma procuração financeira e diretivas de cuidados de saúde. Um trust (fideicomisso) pode ser apropriado dependendo da família, dos bens e dos objetivos envolvidos."
      "Do I need an estate plan if I do not have significant wealth?": "Eu preciso de um planejamento patrimonial se não possuo um patrimônio significativo?"
      "Planning also addresses decision-makers, incapacity, minor children, personal property, and family guidance. Those issues can matter regardless of wealth.": "O planejamento também aborda tomadores de decisão, incapacidade, filhos menores, bens pessoais e orientação familiar. Essas questões podem ser importantes independentemente da riqueza."
      "What should I bring to the first consultation?": "O que devo levar para a primeira consulta?"
      "Bring any existing estate-planning documents you can locate and a general list of family members, property, accounts, insurance, business interests, and questions. You do not need perfect numbers or final decisions.": "Traga quaisquer documentos de planejamento patrimonial existentes que conseguir localizar e uma lista geral de membros da família, propriedades, contas, seguros, interesses comerciais e perguntas. Você não precisa de números exatos ou decisões finais."
      "Is the initial consultation free?": "A consulta inicial é gratuita?"
      "Yes. Miranda Law provides a free initial consultation and discusses the recommended scope and fee before legal work begins.": "Sim. A Miranda Law oferece uma consulta inicial gratuita e discute o escopo recomendado e os honorários antes do início do trabalho jurídico."
      "Wills and trusts": "Testamentos e trusts (fideicomissos)"
      "What happens if I die without a will in New Jersey?": "O que acontece se eu morrer sem um testamento em New Jersey?"
      "New Jersey's intestacy rules govern the distribution of probate property, and a court process may be needed to appoint an administrator. The result may not reflect every personal wish or relationship.": "As regras de sucessão legítima de New Jersey regem a distribuição de bens sob inventário, e um processo judicial pode ser necessário para nomear um administrador. O resultado pode não refletir todos os desejos ou relacionamentos pessoais."
      "Does a will avoid probate?": "Um testamento evita o inventário?"
      "A will generally provides instructions for probate rather than avoiding the process by itself. Other ownership and trust arrangements may affect how particular assets are handled.": "Um testamento geralmente fornece instruções para o inventário, em vez de evitar o processo por si só. Outras formas de propriedade e arranjos de trust (fideicomisso) podem afetar como ativos específicos são tratados."
      "Does everyone need a trust?": "Todos precisam de um trust (fideicomisso)?"
      "No. A trust can be useful for particular management, continuity, or distribution goals, but some plans can be handled effectively through other documents and arrangements.": "Não. Um trust (fideicomisso) pode ser útil para objetivos específicos de gestão, continuidade ou distribuição, mas alguns planos podem ser tratados de forma eficaz por meio de outros documentos e arranjos."
      "Funding generally means transferring or coordinating selected assets so the trust can govern them. A signed trust that is not connected to the intended assets may not accomplish the expected result.": "A integralização (funding) geralmente significa transferir ou coordenar ativos selecionados para que o trust (fideicomisso) possa administrá-los. Um trust (fideicomisso) assinado que não esteja conectado aos ativos pretendidos pode não alcançar o resultado esperado."
      "Planning for incapacity": "Planejamento para incapacidade"
      "What does a financial power of attorney do?": "O que faz uma procuração financeira?"
      "It authorizes a person you choose to handle the financial, legal, property, or other matters described in the document.": "Ela autoriza uma pessoa de sua escolha a lidar com as questões financeiras, jurídicas, patrimoniais ou outras descritas no documento."
      "Is a health care directive the same as a financial power of attorney?": "Uma diretiva de cuidados de saúde é o mesmo que uma procuração financeira?"
      "No. A health care directive concerns medical decision-making. A financial power of attorney concerns the financial and legal authority written into that document.": "Não. Uma diretiva de cuidados de saúde refere-se à tomada de decisões médicas. Uma procuração financeira refere-se à autoridade financeira e jurídica estabelecida naquele documento."
      "Can my health care representative decide for me while I still can?": "Meu representante de cuidados de saúde pode decidir por mim enquanto eu ainda for capaz?"
      "No. Under New Jersey guidance, the representative acts when you have been determined unable to make your own health care decisions. If you regain that ability, your own decisions control again.": "Não. De acordo com as diretrizes de New Jersey, o representante atua quando for determinado que você não é mais capaz de tomar suas próprias decisões de saúde. Se você recuperar essa capacidade, suas próprias decisões voltam a prevalecer."
      "Who should receive copies of my health care directive?": "Quem deve receber cópias da minha diretiva de cuidados de saúde?"
      "Consider giving copies to your primary and alternate representatives, appropriate family members, physicians, and health care facilities involved in your care.": "Considere fornecer cópias aos seus representantes principal e substituto, familiares apropriados, médicos e instituições de saúde envolvidas em seu atendimento."
      "Working with Miranda Law": "Trabalhando com a Miranda Law"
      "Yes. The firm communicates with clients in English, Spanish, and Portuguese.": "Sim. O escritório comunica-se com os clientes em inglês, espanhol e português."
      "How can I contact the office?": "Como posso entrar em contato com o escritório?"
      "The legal team handles intake and scheduling by phone, text, WhatsApp, and email.": "A equipe jurídica realiza o atendimento inicial e o agendamento por telefone, mensagem de texto, WhatsApp e e-mail."
      "How much does an estate plan cost?": "Quanto custa um planejamento patrimonial?"
      "The fee depends on the documents and complexity involved. The firm discusses the proposed work and fee after understanding your needs.": "Os honorários dependem dos documentos e da complexidade envolvida. O escritório discutirá o trabalho proposto e os honorários após compreender suas necessidades."
      "How often should I update my plan?": "Com que frequência devo atualizar meu plano?"
      "Consider a review after major family, health, property, or financial changes and when the people named in the documents are no longer the right choices.": "Considere uma revisão após grandes mudanças familiares, de saúde, de propriedade ou financeiras, e quando as pessoas nomeadas nos documentos não forem mais as escolhas adequadas."
      "Prepare for an estate-planning consultation with a practical checklist covering family, documents, property, decision-makers, and questions.": "Prepare-se para uma consulta de planejamento patrimonial com um checklist prático abrangendo família, documentos, propriedades, tomadores de decisão e perguntas."
      "Estate planning checklist": "Checklist de planejamento patrimonial"
      "Gather what you can.": "Reúna o que for possível."
      "Bring the questions you still have.": "Traga as perguntas que você ainda tiver."
      "You do not need every account number or every decision before a consultation. This checklist helps you collect the information that can make the conversation more productive.": "Você não precisa de todos os números de conta ou de todas as decisões antes de uma consulta. Este checklist ajuda você a coletar as informações que podem tornar a conversa mais produtiva."
      "Read the FAQs": "Leia o FAQ"
      "Preparation guide": "Guia de preparação"
      "Use this as a working list—not a test.": "Use isto como uma lista de trabalho — não como um teste."
      "Check what is easy to gather. Make a note beside anything you cannot find or do not understand. Those gaps are useful topics for the consultation.": "Verifique o que é fácil de reunir. Faça uma nota ao lado de qualquer item que não conseguir encontrar ou não compreender. Essas lacunas serão tópicos úteis para a consulta."
      "People and family": "Pessoas e família"
      "Legal names and contact information for close family members": "Nomes legais e informações de contato de familiares próximos"
      "Children, stepchildren, and anyone who depends on you": "Filhos, enteados e qualquer pessoa que dependa de você"
      "People you may trust as executor, trustee, agent, or health care representative": "Pessoas em quem você pode confiar como executor, administrador de trust (fideicomisso), agente ou representante de cuidados de saúde"
      "Backup choices if a first choice cannot serve": "Opções de reserva caso a primeira escolha não possa assumir o encargo"
      "Existing documents": "Documentos existentes"
      "Current wills, trusts, powers of attorney, and health care directives": "Testamentos, trusts (fideicomissos), procurações e diretivas de cuidados de saúde atuais"
      "Prenuptial, postnuptial, divorce, or separation agreements that may affect planning": "Acordos pré-nupciais, pós-nupciais, de divórcio ou de separação que possam afetar o planejamento"
      "Business agreements or succession documents": "Acordos comerciais ou documentos de sucessão"
      "Any document you no longer understand or believe is out of date": "Qualquer documento que você não compreenda mais ou que acredite estar desatualizado"
      "Property and accounts": "Propriedades e contas"
      "Homes, other real estate, and how each property is titled": "Casas, outros imóveis e como a titularidade de cada propriedade está registrada"
      "Bank, investment, and retirement accounts": "Contas bancárias, de investimento e de aposentadoria"
      "Life insurance and current beneficiary designations": "Seguro de vida e designações atuais de beneficiários"
      "Business ownership, vehicles, and significant personal property": "Propriedade de empresas, veículos e bens pessoais significativos"
      "Debts, mortgages, and other major obligations": "Dívidas, hipotecas e outras obrigações principais"
      "Your wishes": "Seus desejos"
      "Who should receive property and whether any gifts need special handling": "Quem deve receber bens e se quaisquer doações necessitam de tratamento especial"
      "Who should administer the estate": "Quem deve administrar o espólio"
      "Who should care for minor children if a guardian is needed": "Quem deve cuidar de filhos menores caso um tutor seja necessário"
      "Whether property should be managed over time for a beneficiary": "Se os bens devem ser administrados ao longo do tempo para um beneficiário"
      "Charitable gifts or personal items with special meaning": "Doações beneficentes ou itens pessoais com significado especial"
      "Financial decision-making": "Tomada de decisões financeiras"
      "Who should handle financial and legal matters if you cannot": "Quem deve tratar de questões financeiras e jurídicas caso você não possa fazê-lo"
      "What authority that person may need": "Qual autoridade essa pessoa pode precisar"
      "Who should serve as the backup agent": "Quem deve atuar como agente substituto"
      "Any business, property, benefits, or family responsibilities the agent should understand": "Quais negócios, propriedades, benefícios ou responsabilidades familiares o agente deve compreender"
      "Health care decisions": "Decisões de cuidados de saúde"
      "Who should serve as health care representative and alternate": "Quem deve atuar como representante de cuidados de saúde e substituto"
      "Treatment preferences or values you want that person to understand": "Preferências de tratamento ou valores que você deseja que essa pessoa compreenda"
      "Physicians and family members who should receive a copy": "Médicos e familiares que devem receber uma cópia"
      "Existing forms that may need review or replacement": "Formulários existentes que podem precisar de revisão ou substituição"
      "Questions for the consultation": "Perguntas para a consulta"
      "What prompted you to consider planning now?": "O que o motivou a considerar o planejamento agora?"
      "What are you most concerned could become confusing or difficult?": "O que mais o preocupa quanto à possibilidade de tornar-se confuso ou difícil?"
      "Are there family relationships or special needs the documents should account for?": "Existem relacionamentos familiares ou necessidades especiais que os documentos devem prever?"
      "Which decisions are you ready to make, and which ones still feel uncertain?": "Quais decisões você está pronto para tomar e quais ainda parecem incertas?"
      "How soon do you need assistance?": "Com que brevidade você precisa de assistência?"
      "You do not need to finish the checklist before calling.": "Você não precisa terminar o checklist antes de ligar."
      "A free initial consultation can help you decide what information matters and what can wait until later.": "Uma consulta inicial gratuita pode ajudar você a decidir quais informações são importantes e o que pode esperar até mais tarde."
      "Estate Planning Video Library": "Biblioteca de Vídeos sobre Planejamento Patrimonial"
      "Explore Miranda Law's planned video topics covering wills, trusts, powers of attorney, health care directives, and consultation preparation.": "Explore os tópicos de vídeo planejados da Miranda Law, abrangendo testamentos, trust (fideicomisso), procurações, diretivas de cuidados de saúde e preparação para consultas."
      "Video library": "Biblioteca de vídeos"
      "Estate planning explained": "Planejamento patrimonial explicado"
      "with clarity.": "com clareza."
      "Short videos are being prepared to answer common questions in a direct, useful format.": "Vídeos curtos estão sendo preparados para responder a perguntas comuns em um formato direto e útil."
      "Read the FAQs now": "Leia o FAQ agora"
      "Coming soon": "Em breve"
      "Reviewed videos are in production.": "Vídeos revisados estão em produção."
      "Topics are listed as a preview. No recording, client story, or legal outcome is represented before final review and publication.": "Os tópicos são listados apenas como uma prévia. Nenhum registro, história de cliente ou resultado jurídico é representado antes da revisão final e publicação."
      "Video coming soon": "Vídeo em breve"
      "Why decision-makers, incapacity, children, and personal property matter at many asset levels.": "Por que tomadores de decisão, incapacidade, filhos e bens pessoais são importantes em diversos níveis de patrimônio."
      "What does a will actually control?": "O que um testamento realmente controla?"
      "A plain-language look at probate property, executors, guardians, and written wishes.": "Uma análise em linguagem simples sobre bens sujeitos a inventário, executores, tutores e desejos por escrito."
      "When might a trust be useful?": "Quando um trust (fideicomisso) pode ser útil?"
      "How management, continuity, and distribution goals can shape the conversation.": "Como os objetivos de gestão, continuidade e distribuição podem moldar a conversa."
      "Who should I name to act for me?": "Quem devo nomear para agir em meu nome?"
      "Practical considerations when choosing financial and health care decision-makers.": "Considerações práticas ao escolher tomadores de decisão financeiros e de cuidados de saúde."
      "Estate Planning Blog": "Blog de Planejamento Patrimonial"
      "Read clear estate-planning articles from Miranda Law about wills, trusts, decision-makers, and preparing for a consultation.": "Leia artigos claros sobre planejamento patrimonial da Miranda Law sobre testamentos, fideicomissos (trusts), tomadores de decisão e como se preparar para uma consulta."
      "Miranda Law blog": "Blog da Miranda Law"
      "Estate planning guidance": "Orientação em planejamento patrimonial"
      "in plain language.": "em linguagem simples."
      "Practical articles to help New Jersey families understand common planning questions and prepare for a conversation with an attorney.": "Artigos práticos para ajudar famílias de New Jersey a compreender dúvidas comuns de planejamento e a se prepararem para uma conversa com um advogado."
