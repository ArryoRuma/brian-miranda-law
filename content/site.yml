      "You Know You Should Have a Plan. You Just Haven’t Gotten Around to It.": "Você sabe que precisa de um plano. Você apenas ainda não teve oportunidade de fazê-lo."
      "Maybe you’ve been meaning to make a will.": "Talvez você estivesse pretendendo fazer um testamento."
      "Maybe you recently bought a home, had children, got married, or started thinking more seriously about retirement.": "Talvez você tenha comprado uma casa recentemente, tido filhos, se casado ou começado a pensar mais seriamente sobre a aposentadoria."
      "Or maybe you’re simply not sure which documents you actually need.": "Ou talvez você simplesmente não tenha certeza de quais documentos realmente são necessários."
      "You don’t have to figure it out yourself.": "Você não precisa descobrir tudo sozinho."
      "Miranda Law helps New Jersey families create straightforward estate plans designed to protect the people they love and make their wishes clear.": "A Miranda Law ajuda as famílias de New Jersey a criar planos de planejamento patrimonial simplificados, projetados para proteger as pessoas que você ama e tornar seus desejos claros."
      "Start Your Estate Plan": "Inicie Seu Planejamento Patrimonial"
      "Estate planning services": "Serviços de planejamento patrimonial"
      "Start With the Documents That Protect You and Your Family": "Comece com os Documentos que Protegem Você e sua Família"
      "You don’t need to become an estate-planning expert. We’ll help you understand what makes sense for your situation.": "Você não precisa se tornar um especialista em planejamento patrimonial. Nós ajudaremos você a entender o que faz sentido para a sua situação."
      "Decide who receives your property, who handles your estate, and how you want your affairs managed.": "Decida quem receberá seus bens, quem administrará seu espólio e como você deseja que seus assuntos sejam geridos."
      "Learn About Wills": "Saiba Mais Sobre Testamentos"
      "Protect and manage assets with a plan designed around your family, property, and long-term goals.": "Proteja e gerencie seus bens com um plano elaborado com foco em sua família, propriedades e objetivos de longo prazo."
      "Learn About Trusts": "Saiba Mais Sobre Trusts (Fideicomissos)"
      "Choose someone you trust to handle important financial and legal matters if you’re unable to do so yourself.": "Escolha alguém em quem você confie para cuidar de assuntos financeiros e jurídicos importantes caso você não possa fazê-lo pessoalmente."
      "Learn About Powers of Attorney": "Saiba Mais Sobre Procurações"
      "Make your healthcare wishes clear and choose someone you trust to make decisions if you cannot.": "Deixe claros seus desejos de cuidados de saúde e escolha alguém de sua confiança para tomar decisões caso você não possa fazê-lo."
      "Learn About Health Care Directives": "Saiba Mais Sobre Diretivas de Cuidados de Saúde"
      "Why choose Miranda Law": "Por que escolher a Miranda Law"
      "Estate Planning Doesn’t Have to Feel Complicated.": "O Planejamento Patrimonial não precisa ser complicado."
      "The goal isn’t to hand you a stack of legal documents. It’s to help you understand your options, make the right decisions for your family, and leave with a plan you feel confident about.": "Nosso objetivo não é entregar um monte de documentos jurídicos. É ajudar você a compreender suas opções, tomar as decisões corretas para sua família e sair com um plano em que você se sinta confiante."
      "Straightforward": "Direto ao Ponto"
      "We explain your options in plain language and help you determine what you actually need.": "Explicamos suas opções em linguagem clara e ajudamos você a determinar o que é realmente necessário."
      "Personal": "Pessoalizado"
      "Your plan is built around your family, assets, wishes, and circumstances.": "Seu plano é construído com base em sua família, bens, desejos e circunstâncias."
