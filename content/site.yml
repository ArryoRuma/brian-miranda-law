      "Important legal decisions are easier when you can discuss them in the language you’re most comfortable using.": "Las decisiones legales importantes son más sencillas cuando puede discutirlas en el idioma con el que se siente más cómodo."
      "Miranda Law serves clients in English, Spanish, and Portuguese.": "Miranda Law atiende a clientes en inglés, español y portugués."
      "Choose your language to learn more about estate planning and schedule a free initial consultation.": "Elija su idioma para obtener más información sobre la planificación patrimonial y programar una consulta inicial gratuita."
      "Preview the estate planning questionnaire": "Vista previa del cuestionario de planificación patrimonial"
      "More Than Estate Planning": "Más que planificación patrimonial"
      "Need help with something else? Miranda Law also assists clients with select matters involving:": "¿Necesita ayuda con algo más? Miranda Law también asiste a clientes en asuntos selectos relacionados con:"
      "Real Estate": "Bienes raíces"
      "Immigration": "Inmigración"
      "Litigation": "Litigios"
      "View All Legal Services": "Ver todos los servicios legales"
      "Testimonials & Reviews": "Testimonios y reseñas"
      "Trusted by Clients Throughout New Jersey": "Confianza de clientes en todo New Jersey"
      "Approved Google reviews and client testimonials will be published here after they have been verified and cleared for use.": "Las reseñas aprobadas de Google y los testimonios de clientes se publicarán aquí después de haber sido verificados y autorizados para su uso."
      "Verified client reviews coming soon": "Reseñas de clientes verificadas próximamente"
      "Estate planning FAQs": "Preguntas frecuentes sobre planificación patrimonial"
      "Questions About Estate Planning?": "¿Tiene preguntas sobre la planificación patrimonial?"
      "Start with clear answers to a few of the questions New Jersey families ask most often.": "Comience con respuestas claras a algunas de las preguntas que las familias de New Jersey realizan con más frecuencia."
      "View Estate Planning FAQs": "Ver preguntas frecuentes sobre planificación patrimonial"
      "Do I need an estate plan if I am not wealthy?": "¿Necesito un plan patrimonial si no tengo grandes bienes?"
      "Estate planning is not only about wealth. It can help you name decision-makers, document your wishes, prepare for incapacity, and make important matters clearer for the people you love.": "La planificación patrimonial no trata solo de riqueza. Puede ayudarle a designar personas para la toma de decisiones, documentar sus deseos, prepararse para una posible incapacidad y dar mayor claridad en asuntos importantes para sus seres queridos."
      "What documents are commonly included in an estate plan?": "¿Qué documentos se incluyen comúnmente en un plan patrimonial?"
      "Depending on your circumstances, an estate plan may include a will, trust, power of attorney, and healthcare directive. We’ll help you understand which documents make sense for your situation.": "Dependiendo de sus circunstancias, un plan patrimonial puede incluir un testamento, fideicomiso, poder notarial y directiva de atención médica. Le ayudaremos a comprender qué documentos son adecuados para su situación."
      "How much does estate planning cost?": "¿Cuánto cuesta la planificación patrimonial?"
      "The cost depends on the documents and complexity involved. After your free initial consultation, we’ll explain what your situation requires and the associated fees before moving forward.": "El costo depende de los documentos y la complejidad involucrada. Después de su consulta inicial gratuita, le explicaremos lo que requiere su situación y los honorarios asociados antes de proceder."
      "What happens during the initial consultation?": "¿Qué sucede durante la consulta inicial?"
      "We’ll learn about your family, priorities, property, existing documents, and questions, then explain the options that may fit your goals. You do not need to arrive with every decision already made.": "Conoceremos a su familia, sus prioridades, sus propiedades, sus documentos existentes y sus preguntas; luego, explicaremos las opciones que pueden adaptarse a sus objetivos. No es necesario que llegue con todas las decisiones ya tomadas."
      "Can Miranda Law assist me in Spanish or Portuguese?": "¿Puede Miranda Law asistirme en español o portugués?"
      "Yes. Miranda Law serves clients in English, Spanish, and Portuguese so you can discuss important legal decisions in the language you’re most comfortable using.": "Sí. Miranda Law atiende a clientes en inglés, español y portugués para que pueda discutir decisiones legales importantes en el idioma con el que se sienta más cómodo."
      "Does Miranda Law offer virtual consultations?": "¿Ofrece Miranda Law consultas virtuales?"
      "Consultation formats may depend on your circumstances. Contact Miranda Law to ask whether a virtual consultation is available for your matter.": "Los formatos de consulta pueden depender de sus circunstancias. Contacte a Miranda Law para preguntar si hay una consulta virtual disponible para su asunto."
      "Start your estate plan": "Comience su plan patrimonial"
      "The Best Time to Make a Plan Is Before Your Family Needs It.": "El mejor momento para hacer un plan es antes de que su familia lo necesite."
      "You don’t need to know which documents you need before contacting us. That’s what the consultation is for. Tell us a little about your situation and we’ll help you understand the next step.": "No es necesario que sepa qué documentos necesita antes de contactarnos. Para eso es la consulta. Cuéntenos un poco sobre su situación y le ayudaremos a comprender el siguiente paso."
      "Available in": "Disponible en"
      "English · Español · Português": "English · Español · Português"
      "Estate Planning in North Jersey": "Planificación patrimonial en North Jersey"
      "Understand wills, trusts, powers of attorney, and health care directives with clear, multilingual estate-planning guidance from Miranda Law.": "Comprenda testamentos, fideicomisos, poderes notariales y directivas de atención médica con una guía clara y multilingüe sobre planificación patrimonial de Miranda Law."
      "Estate planning for North Jersey families": "Planificación patrimonial para familias de North Jersey"
      "Make the important decisions": "Tome las decisiones importantes"
      "before someone else has to.": "antes de que alguien más tenga que hacerlo."
      "A thoughtful estate plan brings your wishes, decision-makers, and essential documents into one clear framework. Miranda Law helps families build that framework in English, Spanish, and Portuguese.": "Un plan de planificación patrimonial reflexivo integra sus deseos, sus responsables de la toma de decisiones y los documentos esenciales en un marco claro. Miranda Law ayuda a las familias a construir ese marco en inglés, español y portugués."
      "Use the planning checklist": "Utilice la lista de verificación de planificación"
      "Why planning matters": "Por qué es importante la planificación"
      "Estate planning is about people as much as property.": "La planificación patrimonial trata tanto de las personas como de los bienes."
      "An estate plan can give the people you trust useful direction if you die or become unable to make decisions. It can also reduce the number of urgent choices your family must make during an already difficult time.": "Un plan de planificación patrimonial puede brindar una dirección útil a las personas en quienes usted confía en caso de que fallezca o no pueda tomar decisiones. También puede reducir el número de decisiones urgentes que su familia debe tomar durante un momento que ya es difícil."
      "The right documents depend on your family, assets, responsibilities, and goals. The work begins by understanding those facts—not by reaching for a one-size-fits-all package.": "Los documentos adecuados dependen de su familia, sus activos, sus responsabilidades y sus objetivos. El trabajo comienza por comprender esos hechos, no por recurrir a un paquete genérico."
      "What a plan can do": "Lo que un plan puede lograr"
      "Put your decisions in writing.": "Ponga sus decisiones por escrito."
      "Explain how you want property handled after your death.": "Explique cómo desea que se manejen sus bienes después de su fallecimiento."
      "Nominate the people you want to manage your estate and carry out your instructions.": "Nomine a las personas que desea que administren su patrimonio y ejecuten sus instrucciones."
      "Choose someone to address financial and legal matters if you cannot act for yourself.": "Elija a alguien para que se encargue de los asuntos financieros y legales si usted no puede actuar por sí mismo."
      "Name a health care representative and communicate medical preferences.": "Nombre a un representante de atención médica y comunique sus preferencias médicas."
      "Create practical guidance for children, dependents, caregivers, and loved ones.": "Cree orientación práctica para hijos, dependientes, cuidadores y seres queridos."
      "Coordinate existing documents after marriage, divorce, a birth, a death, retirement, or a major financial change.": "Coordine los documentos existentes tras un matrimonio, divorcio, nacimiento, fallecimiento, jubilación o un cambio financiero importante."
      "Core documents": "Documentos principales"
      "The pieces of a coordinated estate plan.": "Los elementos de un plan de planificación patrimonial coordinado."
      "State how property should be distributed, nominate an executor, and document other important wishes.": "Establezca cómo debe distribuirse la propiedad, designe a un albacea y documente otros deseos importantes."
      "Create a structure for holding, managing, and transferring selected assets under written terms.": "Cree una estructura para mantener, administrar y transferir activos seleccionados bajo términos escritos."
      "Authorize a trusted person to handle defined financial or legal matters on your behalf.": "Autorice a una persona de confianza para que gestione asuntos financieros o legales definidos en su nombre."
      "Choose a health care representative and communicate treatment preferences for a time when you cannot decide for yourself.": "Elija un representante de atención médica y comunique sus preferencias de tratamiento para un momento en el que no pueda decidir por sí mismo."
      "How it works together": "Cómo funciona en conjunto"
      "Different questions call for different documents.": "Diferentes preguntas requieren diferentes documentos."
      "Your wishes and property": "Sus deseos y su propiedad"
      "A will—and, when appropriate, a trust—can address how selected assets should be managed and transferred.": "Un testamento y, cuando sea apropiado, un fideicomiso, pueden abordar cómo deben administrarse y transferirse los activos seleccionados."
      "Financial incapacity": "Incapacidad financiera"
      "A power of attorney can identify who may act for you and define the authority that person receives.": "Un poder notarial puede identificar quién puede actuar en su nombre y definir la autoridad que esa persona recibe."
      "Medical incapacity": "Incapacidad médica"
      "A health care directive can identify your representative and preserve guidance about treatment decisions.": "Una directiva de atención médica puede identificar a su representante y preservar las instrucciones sobre decisiones de tratamiento."
      "Who planning is for": "Para quién es esta planificación"
      "You do not need to be wealthy to need a plan.": "No es necesario tener grandes riquezas para necesitar un plan."
      "Parents and guardians of minor children": "Padres y tutores de menores de edad"
      "Homeowners and people with financial accounts or personal property": "Propietarios de viviendas y personas con cuentas financieras o bienes personales"
      "Married and unmarried couples": "Parejas casadas y no casadas"
      "Business owners and independent professionals": "Dueños de negocios y profesionales independientes"
      "People preparing for retirement": "Personas que se preparan para la jubilación"
      "Adults helping parents or caring for other relatives": "Adultos que ayudan a sus padres o cuidan de otros familiares"
      "Anyone whose family, health, assets, or responsibilities have recently changed": "Cualquier persona cuya familia, salud, activos o responsabilidades hayan cambiado recientemente"
      "The Miranda Law process": "El proceso de Miranda Law"
      "A practical route from questions to signed documents.": "Una ruta práctica desde las preguntas hasta los documentos firmados."
      "Start with a conversation about your family, existing documents, concerns, and goals.": "Comience con una conversación sobre su familia, sus documentos actuales, sus preocupaciones y sus objetivos."
      "Review the planning options": "Revise las opciones de planificación"
      "Brian explains the available approaches in plain language and identifies the questions that matter most.": "Brian explica los enfoques disponibles en lenguaje sencillo e identifica las preguntas más importantes."
      "Prepare and review": "Prepare y revise"
      "The firm drafts the agreed documents and walks through what they mean before anything is finalized.": "La firma redacta los documentos acordados y explica su significado antes de que se finalice cualquier trámite."
      "Sign and carry the plan forward": "Firme y ponga en marcha el plan"
      "Complete the required formalities, understand where documents should be kept, and know when a future review may be useful.": "Complete las formalidades requeridas, comprenda dónde deben guardarse los documentos y sepa cuándo puede ser útil una revisión futura."
      "Why Miranda Law": "Por qué Miranda Law"
      "Clear guidance, responsive communication, and room for questions.": "Orientación clara, comunicación receptiva y espacio para sus preguntas."
      "Personalized recommendations based on your circumstances and goals.": "Recomendaciones personalizadas basadas en sus circunstancias y objetivos."
      "Service in English, Spanish, and Portuguese.": "Servicio en inglés, español y portugués."
      "Phone, text, and WhatsApp communication with the office.": "Comunicación con la oficina por teléfono, mensaje de texto y WhatsApp."
      "A North Jersey practice serving Monmouth County and communities north of it.": "Una práctica en North Jersey que sirve al condado de Monmouth y a las comunidades al norte del mismo."
      "A free initial consultation.": "Una consulta inicial gratuita."
      "Many plans include a will, a financial power of attorney, and one or more health care directives. A trust may be appropriate depending on the assets, family circumstances, and goals involved.": "Muchos planes incluyen un testamento, un poder notarial financiero y una o más directivas de atención médica. Un fideicomiso puede ser apropiado dependiendo de los activos, las circunstancias familiares y los objetivos involucrados."
      "Estate planning also addresses decision-making, incapacity, children, personal property, and the people who may be asked to act for you. Those questions can matter at many income and asset levels.": "La planificación patrimonial también aborda la toma de decisiones, la incapacidad, los hijos, la propiedad personal y las personas a quienes se les podría pedir que actúen en su nombre. Esas preguntas pueden ser importantes en muchos niveles de ingresos y activos."
      "How often should I review my plan?": "¿Con qué frecuencia debo revisar mi plan?"
      "A review can be useful after a marriage, divorce, birth, death, move, retirement, significant financial change, or change in the people you named. Periodic reviews can also confirm that the plan still reflects your wishes.": "Una revisión puede ser útil después de un matrimonio, divorcio, nacimiento, fallecimiento, mudanza, jubilación, cambio financiero significativo o un cambio en las personas que usted designó. Las revisiones periódicas también pueden confirmar que el plan aún refleja sus deseos."
      "What happens during the first consultation?": "¿Qué sucede durante la primera consulta?"
      "The conversation focuses on your family, assets, existing documents, concerns, and goals. You do not need to arrive with every decision already made.": "La conversación se centra en su familia, activos, documentos existentes, inquietudes y objetivos. No es necesario que llegue con todas las decisiones ya tomadas."
      "Fees depend on the documents and complexity involved. Miranda Law discusses the recommended scope and fee before legal work begins.": "Los honorarios dependen de los documentos y la complejidad involucrada. Miranda Law analiza el alcance recomendado y los honorarios antes de que comience el trabajo legal."
      "Yes. Miranda Law communicates with clients in English, Spanish, and Portuguese.": "Sí. Miranda Law se comunica con los clientes en inglés, español y portugués."
      "About Brian Miranda": "Acerca de Brian Miranda"
      "Meet Brian M. Miranda, Esq. and learn about Miranda Law's clear, responsive, multilingual approach to serving North Jersey families.": "Conozca a Brian M. Miranda, Esq. y aprenda sobre el enfoque claro, receptivo y multilingüe de Miranda Law para servir a las familias de North Jersey."
      "Legal guidance should feel": "La orientación legal debe sentirse"
      "clear, personal, and useful.": "clara, personal y útil."
      "Brian M. Miranda, Esq. leads a North Jersey practice built around direct communication, practical next steps, and long-term client relationships.": "Brian M. Miranda, Esq. lidera una práctica en North Jersey basada en la comunicación directa, pasos prácticos a seguir y relaciones a largo plazo con los clientes."
      "A linen-bound planning book with organized legal documents": "Un libro de planificación encuadernado en lino con documentos legales organizados"
      "Explore estate planning": "Explore la planificación patrimonial"
      "The practice": "La práctica"
      "A steady point of contact for important legal decisions.": "Un punto de contacto estable para decisiones legales importantes."
      "Miranda Law works with individuals and families who want straightforward explanations and a plan they can understand. The estate-planning process is designed to turn broad concerns—about family, property, health, and the future—into a practical set of decisions.": "Miranda Law trabaja con individuos y familias que desean explicaciones directas y un plan que puedan entender. El proceso de planificación patrimonial está diseñado para convertir inquietudes generales —sobre la familia, la propiedad, la salud y el futuro— en un conjunto práctico de decisiones."
      "The firm also assists with select real estate, corporate, civil litigation and defense, municipal, immigration, and landlord-tenant matters.": "La firma también brinda asistencia en asuntos selectos de bienes raíces, corporativos, litigio civil y defensa, municipales, inmigración y de arrendador-inquilino."
      "What clients can expect": "Lo que los clientes pueden esperar"
      "Clear answers without unnecessary distance.": "Respuestas claras sin distancias innecesarias."
      "Plain-language explanations": "Explicaciones en lenguaje sencillo"
      "Understand the purpose of each option, the decisions it requires, and how it relates to the rest of the plan.": "Comprenda el propósito de cada opción, las decisiones que requiere y cómo se relaciona con el resto del plan."
      "Personal recommendations": "Recomendaciones personales"
      "The conversation begins with your actual family, assets, responsibilities, and priorities.": "La conversación comienza con su familia, activos, responsabilidades y prioridades reales."
      "Responsive communication": "Comunicación receptiva"
      "The legal team handles intake and scheduling through phone, text, and WhatsApp.": "El equipo legal gestiona la recepción de casos y la programación a través de teléfono, mensajes de texto y WhatsApp."
      "Multilingual service": "Servicio multilingüe"
      "English, Spanish, and Portuguese communication is available throughout the client experience.": "La comunicación en inglés, español y portugués está disponible durante toda la experiencia del cliente."
      "Serving North Jersey": "Sirviendo al norte de New Jersey"
      "Local counsel for multilingual families.": "Asesoría legal local para familias multilingües."
      "Miranda Law primarily serves North Jersey, including Monmouth County and communities north of it. The Warren office gives clients a local place to begin, while the firm's phone, text, and WhatsApp options help make communication easier.": "Miranda Law sirve principalmente al norte de New Jersey, incluyendo el condado de Monmouth y las comunidades al norte de este. La oficina de Warren brinda a los clientes un lugar local para comenzar, mientras que las opciones de teléfono, texto y WhatsApp de la firma ayudan a facilitar la comunicación."
      "Approximately half of the firm's clients are Spanish- or Portuguese-speaking. Multilingual service is not an add-on; it is part of how the practice works every day.": "Aproximadamente la mitad de los clientes de la firma hablan español o portugués. El servicio multilingüe no es un complemento; es parte de la forma en que la práctica opera cada día."
      "Approach to estate planning": "Enfoque de planificación patrimonial"
      "Listen first. Explain the options. Build the plan carefully.": "Escuchar primero. Explicar las opciones. Construir el plan cuidadosamente."
      "Understand": "Comprender"
      "Discuss the people, property, responsibilities, and changes that bring you to the conversation.": "Analizamos las personas, propiedades, responsabilidades y cambios que lo motivan a iniciar esta conversación."
      "Explain": "Explicar"
      "Review possible documents and tradeoffs in language that makes the choices easier to follow.": "Revisamos los posibles documentos y sus implicaciones en un lenguaje que haga que las elecciones sean más fáciles de seguir."
      "Prepare": "Prepararse"
      "Draft and review the agreed plan with enough room to ask questions before signing.": "Redacte y revise el plan acordado con suficiente tiempo para hacer preguntas antes de la firma."
      "Carry forward": "Continuar con seguridad"
      "Leave knowing what was signed, where it belongs, and what kinds of future changes may call for another review.": "Vaya con la tranquilidad de saber qué se firmó, dónde se encuentran los documentos y qué tipos de cambios futuros podrían requerir una nueva revisión."
      "Bring the questions you have now.": "Traiga las preguntas que tenga ahora."
      "You do not need to solve every decision before calling. A free initial consultation is a place to understand what may come next.": "No es necesario resolver cada decisión antes de llamar. Una consulta inicial gratuita es un espacio para comprender qué podría ser lo siguiente."
      "Estate Planning Resources": "Recursos de planificación patrimonial"
      "Use Miranda Law's estate-planning FAQs, preparation checklist, and video resources to organize questions before a consultation.": "Utilice las preguntas frecuentes, la lista de verificación de preparación y los recursos en video de Miranda Law para organizar sus preguntas antes de una consulta."
      "Estate planning resources": "Recursos de planificación patrimonial"
      "Start informed.": "Comience informado."
      "You do not have to start certain.": "No es necesario comenzar con todas las certezas."
      "These resources are designed to help you organize the people, property, documents, and questions you may want to discuss with an attorney.": "Estos recursos están diseñados para ayudarle a organizar a las personas, propiedades, documentos y preguntas que desee discutir con un abogado."
      "Read common questions": "Lea las preguntas comunes"
      "Prepare at your pace": "Prepárese a su propio ritmo"
      "Three ways to make the first conversation easier.": "Tres formas de facilitar la primera conversación."
      "Plain-language answers to common questions about documents, timing, cost, and the first consultation.": "Respuestas en lenguaje sencillo a preguntas comunes sobre documentos, plazos, costos y la primera consulta."
      "Browse the FAQs": "Explore las preguntas frecuentes"
      "A practical list of information and decisions to gather. Complete what you can and leave the rest for the conversation.": "Una lista práctica de información y decisiones para recopilar. Complete lo que pueda y deje el resto para la conversación."
      "Open the checklist": "Abra la lista de verificación"
      "Short explanations of estate-planning concepts and the questions families commonly bring to the office.": "Explicaciones breves sobre conceptos de planificación patrimonial y las preguntas que las familias suelen traer a la oficina."
      "Visit the video library": "Visite la biblioteca de videos"
      "A useful reminder": "Un recordatorio útil"
      "General information is a starting point, not a personal legal plan.": "La información general es un punto de partida, no un plan legal personal."
      "Online resources can help you identify questions, but they cannot account for every family, asset, document, or legal issue. A consultation is where general information becomes a conversation about your circumstances.": "Los recursos en línea pueden ayudarle a identificar preguntas, pero no pueden contemplar cada familia, activo, documento o asunto legal. Una consulta es el espacio donde la información general se convierte en una conversación sobre sus circunstancias."
      "Miranda Law assists North Jersey clients with select real estate, corporate, litigation, municipal, immigration, and landlord-tenant matters.": "Miranda Law asiste a clientes del norte de New Jersey con asuntos selectos de bienes raíces, corporativos, litigios, municipales, inmigración y de arrendador-inquiliente."
      "Practical counsel for": "Asesoramiento práctico para"
      "the matters around the plan.": "los asuntos relacionados con el plan."
      "In addition to estate planning, Miranda Law assists clients with select legal matters affecting property, business, immigration, and everyday disputes.": "Además de la planificación patrimonial, Miranda Law asiste a los clientes con asuntos legales selectos que afectan la propiedad, los negocios, la inmigración y las disputas cotidianas."
      "Ask about your matter": "Consúltenos sobre su asunto"
      "Areas of assistance": "Áreas de asistencia"
      "Tell us what brings you here.": "Cuéntenos qué le trae por aquí."
      "Guidance for select residential and related property matters, from questions and documents through the next practical step.": "Orientación para asuntos residenciales selectos y propiedades relacionadas, desde preguntas y documentos hasta el siguiente paso práctico."
      "Corporate Matters": "Asuntos Corporativos"
      "Counsel for select business questions and transactions where clear documentation and risk awareness matter.": "Asesoramiento para preguntas y transacciones comerciales selectas donde la documentación clara y la conciencia del riesgo son fundamentales."
      "Civil Litigation & Defense": "Litigios Civiles y Defensa"
      "Representation in select civil disputes, with an early focus on the facts, available options, and proportionate next steps.": "Representación en disputas civiles selectas, con un enfoque inicial en los hechos, las opciones disponibles y los pasos proporcionales a seguir."
      "Municipal Matters": "Asuntos Municipales"
      "Assistance with select matters handled through New Jersey municipal courts and local processes.": "Asistencia en asuntos selectos tramitados a través de los tribunales municipales de New Jersey y procesos locales."
      "Support with select immigration matters for individuals and families, available in English, Spanish, and Portuguese.": "Apoyo en asuntos migratorios selectos para individuos y familias, disponible en inglés, español y portugués."
      "Landlord & Tenant": "Arrendadores y Propietarios"
      "Guidance for select landlord-tenant questions and disputes involving rights, documents, and next steps.": "Orientación para consultas y disputas selectas entre arrendadores y propietarios que involucren derechos, documentos y pasos a seguir."
      "The availability of representation depends on the facts, timing, jurisdiction, and any conflicts. Contact the office so the legal team can determine whether the matter is one Miranda Law can consider.": "La disponibilidad de representación depende de los hechos, el tiempo, la jurisdicción y cualquier conflicto de interés. Comuníquese con la oficina para que el equipo legal pueda determinar si el asunto es uno que Miranda Law puede considerar."
      "A coordinated perspective": "Una perspectiva coordinada"
      "Legal matters rarely stay in one neat category.": "Los asuntos legales rara vez permanecen en una sola categoría definida."
      "A real estate transaction can affect an estate plan. A business interest may need to be considered alongside family goals. An immigration or litigation matter can change what requires attention first.": "Una transacción inmobiliaria puede afectar un plan de planificación patrimonial. Un interés comercial puede requerir ser considerado junto con los objetivos familiares. Un asunto de inmigración o litigio puede cambiar lo que requiere atención prioritaria."
      "Miranda Law begins by understanding the immediate issue and its connection to the rest of the client's legal picture.": "Miranda Law comienza comprendiendo el problema inmediato y su conexión con el resto del panorama legal del cliente."
      "Contact Miranda Law": "Contacte a Miranda Law"
      "Schedule a free initial consultation with Miranda Law in Warren, New Jersey by phone, text, WhatsApp, or email.": "Programe una consulta inicial gratuita con Miranda Law en Warren, New Jersey, por teléfono, mensaje de texto, WhatsApp o correo electrónico."
      "Take the first step": "Dé el primer paso"
      "toward a clearer plan.": "hacia un plan más claro."
      "Tell the legal team what brings you here. A free initial consultation is available, and the office can communicate by phone, text, WhatsApp, or email.": "Cuéntele al equipo legal qué le trae aquí. Una consulta inicial gratuita está disponible, y la oficina puede comunicarse por teléfono, mensaje de texto, WhatsApp o correo electrónico."
      "Organized planning documents and a linen-bound book": "Documentos de planificación organizados y un libro encuadernado en lino"
      "Wills Attorney in North Jersey": "Abogado de Testamentos en North Jersey"
      "Learn what a New Jersey will can address and speak with Miranda Law about documenting your wishes, executor, and estate plan.": "Conozca lo que un testamento de New Jersey puede abordar y hable con Miranda Law sobre la documentación de sus deseos, el albacea y su planificación patrimonial."
      "Put your wishes": "Proteja sus deseos"
      "into a plan others can follow.": "en un plan que otros puedan seguir."
      "A will can state how property should be distributed, nominate the person who will administer your estate, and record other important decisions for the people you leave behind.": "Un testamento puede establecer cómo debe distribuirse la propiedad, nombrar a la persona que administrará su patrimonio y registrar otras decisiones importantes para las personas que usted deje atrás."
      "See the complete estate plan": "Ver el plan de planificación patrimonial completo"
      "What is a will?": "¿Qué es un testamento?"
      "A legal document for decisions that take effect after death.": "Un documento legal para decisiones que entran en vigor tras el fallecimiento."
      "A will records instructions for property governed by the will and nominates an executor to administer the estate. Parents may also use a will to nominate a guardian for minor children, subject to court review.": "Un testamento registra las instrucciones para los bienes regidos por este y nombra a un albacea para administrar el patrimonio. Los padres también pueden utilizar un testamento para nombrar a un tutor para hijos menores, sujeto a revisión judicial."
      "A will does not control every asset. Beneficiary designations, jointly owned property, trust assets, and other arrangements may operate separately, which is why coordination matters.": "Un testamento no controla todos los activos. Las designaciones de beneficiarios, la propiedad de titularidad conjunta, los activos en fideicomiso y otros acuerdos pueden funcionar por separado, razón por la cual la coordinación es importante."
      "Why you may need one": "Por qué podría necesitar uno"
      "Give your family written direction.": "Brinde una dirección escrita a su familia."
      "You want to identify who should receive property governed by the will.": "Usted desea identificar quién debe recibir los bienes regidos por el testamento."
      "You want to nominate an executor and a backup.": "Usted desea nombrar a un albacea y a un suplente."
      "You have minor children and want to record a guardian nomination.": "Usted tiene hijos menores y desea registrar la nominación de un tutor."
      "You want to make selected gifts to people or organizations.": "Usted desea realizar donaciones selectas a personas u organizaciones."
      "Your family structure or wishes differ from the default rules that may otherwise apply.": "Su estructura familiar o sus deseos difieren de las reglas predeterminadas que podrían aplicarse de otro modo."
      "You already have a will, but the people, property, or instructions are out of date.": "Ya tiene un testamento, pero las personas, los bienes o las instrucciones están desactualizados."
      "What you can decide": "Lo que usted puede decidir"
      "The people, gifts, and instructions at the center of the estate.": "Las personas, las donaciones y las instrucciones en el centro del patrimonio."
      "Executor": "Albacea"
      "Nominate the person who should handle the estate and name an alternate if the first choice cannot serve.": "Nombre a la persona que debe encargarse del patrimonio y designe a un sustituto en caso de que la primera opción no pueda ejercer el cargo."
      "Beneficiaries": "Beneficiarios"
      "Identify who should receive property governed by the will and how the remaining estate should be divided.": "Identifique quién debe recibir los bienes regulados por el testamento y cómo debe dividirse el resto del patrimonio."
      "Specific gifts": "Legados específicos"
      "Record selected gifts of property or amounts, while coordinating those instructions with the overall plan.": "Registre los legados seleccionados de bienes o montos, coordinando dichas instrucciones con el plan general."
      "Guardian nomination": "Designación de tutor"
      "Parents can state whom they want considered to care for minor children if a guardian becomes necessary.": "Los padres pueden establecer a quién desean considerar para el cuidado de sus hijos menores en caso de que sea necesario un tutor."
      "Who should consider a will": "Quién debería considerar un testamento"
      "A foundational document for many adults.": "Un documento fundamental para muchos adultos."
      "Parents and guardians": "Padres y tutores"
      "Homeowners and people with personal property": "Propietarios de viviendas y personas con bienes personales"
      "Married and unmarried partners": "Parejas casadas y no casadas"
      "People with stepchildren or blended families": "Personas con hijos afines o familias reconstituidas"
      "Business owners": "Dueños de negocios"
      "Anyone who wants to choose an executor rather than leave administration entirely to default procedures": "Cualquier persona que desee elegir un albacea en lugar de dejar la administración enteramente a los procedimientos por defecto"
      "What happens without one": "Qué sucede si no se tiene uno"
      "New Jersey's default rules may decide what your document did not.": "Las reglas por defecto de New Jersey pueden decidir lo que su documento no especificó."
      "When a person dies without a valid will, New Jersey's intestacy rules govern the distribution of probate property. A court process may also be needed to appoint an administrator rather than confirm an executor named in a will.": "Cuando una persona fallece sin un testamento válido, las reglas de sucesión intestada de New Jersey rigen la distribución de los bienes sujetos a legalización (probate). También puede ser necesario un proceso judicial para designar a un administrador en lugar de confirmar a un albacea nombrado en un testamento."
      "Those default rules cannot account for every personal relationship or informal promise. A properly prepared will gives the legal process written instructions to work from.": "Esas reglas por defecto no pueden contemplar cada relación personal o promesa informal. Un testamento debidamente preparado proporciona instrucciones escritas para guiar el proceso legal."
      "Common misconceptions": "Conceptos erróneos comunes"
      "A will is important, but it is not the whole plan.": "Un testamento es importante, pero no constituye el plan completo."
      "“A will avoids probate.”": "“Un testamento evita el proceso de legalización (probate).”"
      "A will generally provides instructions for probate rather than eliminating the process by itself.": "Un testamento generalmente proporciona instrucciones para el proceso de validación testamentaria (probate), en lugar de eliminar dicho proceso por sí solo."
      "“My family already knows what I want.”": "“Mi familia ya sabe lo que quiero”."
      "Conversations are valuable, but they do not replace a properly executed legal document.": "Las conversaciones son valiosas, pero no reemplazan a un documento legal debidamente ejecutado."
      "“A will covers incapacity.”": "“Un testamento cubre la incapacidad”."
      "Financial powers of attorney and health care directives address decisions during life if you cannot act for yourself.": "Los poderes notariales financieros y las directivas de atención médica abordan las decisiones durante la vida en caso de que usted no pueda actuar por sí mismo."
      "How it fits": "Cómo se integra"
      "Coordinate the will with the rest of the estate plan.": "Coordine el testamento con el resto de su planificación patrimonial."
      "A will works alongside beneficiary designations, ownership arrangements, trusts, powers of attorney, and health care directives. Reviewing those pieces together can reveal gaps or conflicting instructions before they become someone else's problem.": "Un testamento funciona junto con las designaciones de beneficiarios, los acuerdos de propiedad, fideicomisos, poderes notariales y directivas de atención médica. Revisar todos estos elementos en conjunto puede revelar vacíos o instrucciones contradictorias antes de que se conviertan en un problema para otros."
      "From a first conversation to a finished document.": "Desde la primera conversación hasta el documento finalizado."
      "Discuss your current documents, family, property, concerns, and goals.": "Analizamos sus documentos actuales, su familia, propiedades, inquietudes y objetivos."
      "Review the options": "Revise las opciones"
      "Understand the purpose, limits, and decisions involved before choosing a direction.": "Comprenda el propósito, los límites y las decisiones involucradas antes de elegir un camino."
      "The firm drafts the document and reviews its terms with you in plain language.": "La firma redacta el documento y revisa sus términos con usted en un lenguaje sencillo."
      "Sign and finalize": "Firme y finalice"
      "Complete the required formalities and understand how the document fits with the rest of the plan.": "Complete las formalidades requeridas y comprenda cómo el documento se integra con el resto del plan."
      "Why work with Miranda Law": "Por qué trabajar con Miranda Law"
      "Personal guidance with accessible communication.": "Guía personalizada con comunicación accesible."
      "Clear explanations centered on the decisions you need to make.": "Explicaciones claras centradas en las decisiones que usted debe tomar."
      "Recommendations based on your family, assets, and goals.": "Recomendaciones basadas en su familia, activos y objetivos."
      "A free initial consultation to understand the possible scope.": "Una consulta inicial gratuita para comprender el alcance posible."
      "Can I write my own will?": "¿Puedo redactar mi propio testamento?"
      "A will must satisfy legal requirements to be valid. Legal guidance can also help coordinate the document with beneficiary designations, jointly owned property, and the rest of the estate plan.": "Un testamento debe cumplir con los requisitos legales para ser válido. La asesoría legal también puede ayudar a coordinar el documento con las designaciones de beneficiarios, la propiedad de titularidad conjunta y el resto de la planificación patrimonial."
      "Does a will control every asset I own?": "¿Controla un testamento todos los activos que poseo?"
      "Not necessarily. Assets with beneficiary designations, jointly owned property, and trust assets may pass under separate arrangements.": "No necesariamente. Los activos con designaciones de beneficiarios, la propiedad de titularidad conjunta y los activos en un fideicomiso pueden transferirse bajo acuerdos separados."
      "Can I name a guardian for my children?": "¿Puedo nombrar a un tutor para mis hijos?"
      "A parent can use a will to nominate a guardian for minor children. A court makes the final appointment based on the applicable law and circumstances.": "Un progenitor puede utilizar un testamento para nominar a un tutor para hijos menores. Un tribunal realiza el nombramiento final basándose en la ley aplicable y las circunstancias."
      "When should I update my will?": "¿Cuándo debería actualizar mi testamento?"
      "A review can be useful after marriage, divorce, a birth, a death, a move, a major change in property, or a change in the people you named.": "Una revisión puede ser útil después de un matrimonio, divorcio, nacimiento, fallecimiento, mudanza, un cambio importante en la propiedad o un cambio en las personas que usted designó."
      "Where should I keep the signed will?": "¿Dónde debo guardar el testamento firmado?"
      "Keep it somewhere secure but accessible to the people who may need it. The firm can discuss practical storage and whether any registry or other arrangement is appropriate.": "Guárdelo en un lugar seguro pero accesible para las personas que puedan necesitarlo. El bufete puede analizar el almacenamiento práctico y si algún registro u otro acuerdo es apropiado."
      "Trusts Attorney in North Jersey": "Abogado de fideicomisos en North Jersey"
      "Understand how trusts can hold and manage assets under written terms and speak with Miranda Law about whether a trust fits your estate plan.": "Comprenda cómo los fideicomisos pueden mantener y administrar activos bajo términos escritos y hable con Miranda Law sobre si un fideicomiso se ajusta a su planificación patrimonial."
      "Create structure for": "Cree una estructura para"
      "how selected assets are managed.": "cómo se gestionan los activos seleccionados."
      "A trust can place selected property under written terms for the benefit of the people or purposes you choose. Whether one belongs in your plan depends on what you own, what you want to accomplish, and how the trust will be maintained.": "Un fideicomiso puede colocar propiedades seleccionadas bajo términos escritos para el beneficio de las personas o fines que usted elija. El hecho de que uno pertenezca a su plan depende de lo que usted posee, lo que desea lograr y cómo se mantendrá el fideicomiso."
      "What is a trust?": "¿Qué es un fideicomiso?"
      "A legal relationship built around property, instructions, and responsibility.": "Una relación legal construida en torno a la propiedad, las instrucciones y la responsabilidad."
      "A trust generally involves a trustee who holds or manages property under written terms for one or more beneficiaries. The person creating the trust decides its purpose and the rules that apply, within the limits of the law.": "Un fideicomso generalmente involucra a un fiduciario que posee o administra bienes bajo términos escritos para uno o más beneficiarios. La persona que crea el fideicomiso decide su propósito y las reglas que se aplican, dentro de los límites de la ley."
      "There are many kinds of trusts. The right structure—and whether a trust is useful at all—depends on the goals and assets involved.": "Existen muchos tipos de fideicomisos. La estructura adecuada —y si un fideicomiso es útil o no— depende de los objetivos y los activos involucrados."
      "Add control where a simple transfer may not be enough.": "Agregue control donde una transferencia simple puede no ser suficiente."
      "You want property managed for a child or another beneficiary over time.": "Usted desea que los bienes sean administrados para un hijo u otro beneficiario a lo largo del tiempo."
      "You want a successor trustee to manage trust property if you cannot.": "Usted desea un administrador sucesor que administre los bienes del fideicomiso en caso de que usted no pueda hacerlo."
      "You want to set conditions or timing for distributions.": "Usted desea establecer condiciones o plazos para las distribuciones."
      "You have a blended family or responsibilities that require careful coordination.": "Usted tiene una familia reconstituida o responsabilidades que requieren una coordinación cuidadosa."
      "You want a plan for selected property that continues beyond your lifetime.": "Usted desea un plan para bienes seleccionados que continúe más allá de su vida."
      "You have an existing trust that has not been reviewed or properly coordinated with current assets.": "Usted tiene un fideicomiso existente que no ha sido revisado o coordinado adecuadamente con sus activos actuales."
      "Define who manages, who benefits, and how the terms work.": "Defina quién administra, quién se beneficia y cómo funcionan los términos."
      "Trustee": "Administrador"
      "Choose the person or institution responsible for following the trust terms and name appropriate successors.": "Elija a la persona o institución responsable de cumplir con los términos del fideicomiso y designe a los sucesores apropiados."
      "Identify who may benefit and under what circumstances distributions may be made.": "Identifique quién puede beneficiarse y bajo qué circunstancias se pueden realizar las distribuciones."
      "Property": "Bienes"
      "Determine which assets should be transferred to or coordinated with the trust.": "Determine qué activos deben transferirse al fideicomiso o coordinarse con este."
      "Timing and purpose": "Plazos y propósito"
      "Set a framework for when property may be used, distributed, or retained for future needs.": "Establezca un marco de referencia para cuándo los bienes pueden ser utilizados, distribuidos o retenidos para necesidades futuras."
      "Who should consider a trust": "Quién debería considerar un fideicomiso"
      "Useful in the right plan—not automatically necessary in every plan.": "Útil en el plan adecuado; no es automáticamente necesario en todos los planes."
      "Parents planning for minor children": "Padres que planifican para hijos menores de edad"
      "Families supporting a beneficiary who may need ongoing management": "Familias que apoyan a un beneficiario que puede necesitar administración continua"
      "Homeowners and people with property in more than one jurisdiction": "Propietarios de viviendas y personas con propiedades en más de una jurisdicción"
      "Blended families": "Familias reconstituidas"
      "People who want a successor structure for managing selected assets during incapacity": "Personas que desean una estructura sucesora para la gestión de activos seleccionados durante una incapacidad"
      "The result depends on the rest of the plan.": "El resultado depende del resto del plan."
      "A trust is not required for every estate. Without one, property may still pass through a will, beneficiary designation, joint ownership, or other legal arrangement.": "No se requiere un fideicomiso para todos los patrimonías. Sin uno, la propiedad aún puede transferirse a través de un testamento, designación de beneficiarios, propiedad conjunta u otro acuerdo legal."
      "The practical question is whether those alternatives provide enough control, continuity, and coordination for your circumstances.": "La cuestión práctica es si esas alternativas proporcionan suficiente control, continuidad y coordinación para sus circunstancias."
      "A signed trust is only the beginning.": "Un fideicomiso firmado es solo el comienzo."
      "“Every family needs a trust.”": "“Toda familia necesita un fideicomiso”."
      "Some goals can be handled effectively through other documents and ownership arrangements.": "Algunos objetivos pueden manejarse eficazmente a través de otros documentos y acuerdos de propiedad."
      "“A trust works automatically once signed.”": "“Un fideicomiso funciona automáticamente una vez firmado”."
      "A trust generally must be funded or coordinated with the relevant assets to do the work it was designed to do.": "Por lo general, un fideicomiso debe ser financiado o coordinado con los activos pertinentes para cumplir la función para la cual fue diseñado."
      "“A trust replaces every other document.”": "“Un fideicomiso reemplaza a cualquier otro documento”."
      "Wills, powers of attorney, health care directives, and beneficiary designations may still be essential.": "Los testamentos, poderes notariales, directivas de atención médica y las designaciones de beneficiarios aún pueden ser esenciales."
      "Connect the trust to the will, titles, and beneficiary designations.": "Conecte el fideicomiso con el testamento, los títulos y las designaciones de beneficiarios."
      "Trust planning is as much about coordination as drafting. The document, selected assets, ownership records, beneficiary designations, and the rest of the estate plan should point in the same direction.": "La planificación de fideicomisos consiste tanto en la coordinación como en la redacción. El documento, los activos seleccionados, los registros de propiedad, las designaciones de beneficiarios y el resto del plan de planificación patrimonial deben apuntar en la misma dirección."
      "What is the difference between a will and a trust?": "¿Cuál es la diferencia entre un testamento y un fideicomiso?"
      "A will gives instructions for property governed by the will after death. A trust can hold and manage selected property under written terms during life, after death, or both.": "Un testamento proporciona instrucciones para los bienes regidos por este después del fallecimiento. Un fideicomiso puede mantener y administrar bienes seleccionados bajo términos escritos durante la vida, después de la muerte, o ambos."
      "Does a trust avoid probate?": "¿Evita un fideicomiso el proceso de sucesión (probate)?"
      "Property properly held in a trust may be administered under the trust terms rather than through probate, but assets left outside the trust may follow a different path.": "Los bienes debidamente mantenidos en un fideicomiso pueden administrarse bajo los términos del fideicomiso en lugar de a través del proceso de sucesión; sin embargo, los activos que queden fuera del fideicomiso pueden seguir un camino diferente."
      "Can I change a trust?": "¿Puedo cambiar un fideicomiso?"
      "That depends on the type of trust and its terms. Revocable and irrevocable trusts operate differently, so the document must be reviewed.": "Eso depende del tipo de fideicomiso y sus términos. Los fideicomisos revocables e irrevocables operan de manera diferente, por lo que el documento debe ser revisado."
      "Who should serve as trustee?": "¿Quién debe actuar como fiduciario?"
      "The choice depends on the responsibility involved, the people affected, the complexity of the property, and the candidate's judgment and availability.": "La elección depende de la responsabilidad involucrada, las personas afectadas, la complejidad de los bienes y el juicio y la disponibilidad del candidato."
      "What does it mean to fund a trust?": "¿Qué significa financiar un fideicomiso?"
      "Funding generally means transferring or coordinating selected assets so the trust can govern them. The necessary steps depend on the asset.": "Financiar generalmente significa transferir o coordinar activos seleccionados para que el fideicomiso pueda administrarlos. Los pasos necesarios dependen del activo."
      "Powers of Attorney in North Jersey": "Poderes notariales en North Jersey"
      "Learn how a financial power of attorney can authorize a trusted person to handle defined matters and speak with Miranda Law about your plan.": "Aprenda cómo un poder notarial financiero puede autorizar a una persona de confianza para gestionar asuntos definidos y consulte con Miranda Law sobre su plan."
      "Choose who may act": "Elija quién puede actuar"
      "when you cannot act for yourself.": "cuando usted no pueda actuar por sí mismo."
      "A power of attorney can authorize a trusted person to handle defined financial, legal, or practical matters on your behalf. Careful drafting helps make the authority clear before it is urgently needed.": "Un poder notarial puede autorizar a una persona de confianza para gestionar asuntos financieros, legales o prácticos definidos en su nombre. Una redacción cuidadosa ayuda a que la autoridad sea clara antes de que se necesite con urgencia."
      "What is a power of attorney?": "¿Qué es un poder notarial?"
      "Written authority for a person you choose.": "Autoridad por escrito para una persona que usted elija."
      "A power of attorney names an agent to act for you within the authority described in the document. Depending on its terms, that authority may cover financial accounts, property, taxes, contracts, benefits, business interests, or other legal and practical matters.": "Un poder notarial designa a un agente para actuar en su nombre dentro de la autoridad descrita en el documento. Dependiendo de sus términos, esa autoridad puede cubrir cuentas financieras, propiedades, impuestos, contratos, beneficios, intereses comerciales u otros asuntos legales y prácticos."
      "The document should be tailored to the authority you actually want to give and coordinated with institutions or arrangements that may have their own requirements.": "El documento debe adaptarse a la autoridad que usted realmente desea otorgar y coordinarse con las instituciones o acuerdos que puedan tener sus propios requisitos."
      "Prepare for a time when signatures and decisions cannot wait.": "Prepárese para un momento en el que las firmas y las decisiones no puedan esperar."
      "You want someone to manage bills or financial accounts during incapacity.": "Usted desea que alguien gestione facturas o cuentas financieras durante una incapacidad."
      "You own real estate or a business interest that may require ongoing action.": "Usted posee bienes raíces o una participación comercial que puede requerir acciones continuas."
      "You want an agent to address taxes, benefits, insurance, or legal documents.": "Usted desea que un agente se encargue de impuestos, beneficios, seguros o documentos legales."
      "You travel or may need help handling a limited transaction.": "Usted viaja o puede necesitar ayuda para gestionar una transacción limitada."
      "You want a backup agent if the first person cannot serve.": "Usted desea un agente de respaldo si la primera persona no puede ejercer el cargo."
      "Your current document is old, too narrow, or names someone who is no longer appropriate.": "Su documento actual es antiguo, demasiado limitado o designa a alguien que ya no es apropiado."
      "Who acts, what they may do, and how the authority is limited.": "Quién actúa, qué puede hacer y cómo se limita la autoridad."
      "Primary agent": "Agente principal"
      "Choose a person you trust to follow the document and act with care.": "Elija a una persona de su confianza para que cumpla con el documento y actúe con cuidado."
      "Successor agent": "Agente sucesor"
      "Name a backup in case the first agent cannot or will not act.": "Nombre a un sustituto en caso de que el primer agente no pueda o no desee actuar."
      "Scope of authority": "Alcance de la autoridad"
      "Describe the financial, legal, property, business, or other matters the agent may handle.": "Describa los asuntos financieros, legales, de propiedad, comerciales u otros que el agente podrá gestionar."
      "Timing and limits": "Plazos y límites"
      "Address when authority begins, whether it continues during incapacity, and any instructions or limits that should apply.": "Especifique cuándo comienza la autoridad, si esta continúa durante una incapacidad y cualquier instrucción o límite que deba aplicarse."
      "Who should consider one": "Quién debería considerar uno"
      "Incapacity planning belongs in many adult estate plans.": "La planificación de la incapacidad es parte fundamental de muchos planes de planificación patrimonial para adultos."
      "Adults with financial accounts or recurring obligations": "Adultos con cuentas financieras u obligaciones recurrentes"
      "Homeowners and business owners": "Propietarios de viviendas y propietarios de negocios"
      "People approaching retirement": "Personas próximas a la jubilación"
      "Caregivers and adults supporting family members": "Cuidadores y adultos que brindan apoyo a miembros de la familia"
      "People with planned travel, medical procedures, or periods of limited availability": "Personas con viajes programados, procedimientos médicos o períodos de disponibilidad limitada"
      "Anyone who wants to choose an agent before a court process may become necessary": "Cualquier persona que desee elegir un agente antes de que sea necesario un proceso judicial"
      "Family members do not always receive automatic financial authority.": "Los familiares no siempre reciben autoridad financiera automática."
      "If you become unable to manage financial or legal matters and no effective authority is in place, relatives may face delays, institutional barriers, or a court proceeding to obtain authority.": "Si usted queda imposibilitado para gestionar asuntos financieros o legales y no cuenta con una autoridad efectiva, sus familiares podrían enfrentar retrasos, barreras institucionales o un proceso judicial para obtener dicha autoridad."
      "A power of attorney cannot prevent every difficulty, but it can provide a documented starting point and identify the person you chose.": "Un poder notarial no puede evitar todas las dificultades, pero puede proporcionar un punto de partida documentado e identificar a la persona que usted eligió."
      "Authority should be deliberate, not vague.": "La autoridad debe ser deliberada, no vaga."
      "“My spouse or child can automatically handle everything.”": "“Mi cónyuge o hijo puede encargarse de todo automáticamente”."
      "Relationships alone may not give another person authority over individually held accounts or legal matters.": "Los vínculos afectivos por sí solos pueden no otorgar a otra persona autoridad sobre cuentas individuales o asuntos legales."
      "“A power of attorney replaces a will.”": "“Un poder notarial reemplaza un testamento”."
      "A power of attorney generally concerns authority during life; a will addresses instructions after death.": "Un poder notarial generalmente se refiere a la autoridad durante la vida; un testamento aborda las instrucciones después del fallecimiento."
      "“The broadest document is always best.”": "“El documento más amplio es siempre el mejor”."
      "The appropriate authority depends on your goals, risks, and trust in the people being named.": "La autoridad apropiada depende de sus objetivos, riesgos y la confianza en las personas que sean designadas."
      "Pair financial authority with health care planning.": "Combine la autoridad financiera con la planificación de atención médica."
      "A financial power of attorney handles a different set of decisions from a health care directive. Keeping both documents current can create a more complete incapacity plan.": "Un poder notarial financiero maneja un conjunto de decisiones distinto al de una directiva de atención médica. Mantener ambos documentos actualizados puede crear un plan de incapacidad más completo."
      "When does a power of attorney take effect?": "¿Cuándo entra en vigor un poder notarial?"
      "That depends on the document's terms and applicable law. The timing should be discussed and written clearly.": "Eso depende de los términos del documento y la ley aplicable. El momento de entrada en vigor debe discutirse y redactarse claramente."
      "Does the authority continue if I become incapacitated?": "¿Continúa la autoridad si quedo incapacitado?"
      "A durable power of attorney is designed to continue during incapacity, but the actual document must be reviewed for its terms and validity.": "Un poder notarial duradero está diseñado para continuar durante la incapacidad, pero el documento real debe revisarse para verificar sus términos y validez."
      "Can I name more than one agent?": "¿Puedo designar a más de un agente?"
      "A document may name co-agents or successors, but multiple agents can create practical questions about signatures, coordination, and disagreements.": "Un documento puede designar coagentes o sucesores, pero múltiples agentes pueden generar dudas prácticas sobre firmas, coordinación y desacuerdos."
      "Can I revoke a power of attorney?": "¿Puedo revocar un poder notarial?"
      "A person with capacity can generally revoke authority, but effective revocation also requires practical notice to the agent and relevant institutions.": "Una persona con capacidad legal generalmente puede revocar la autoridad, pero una revocación efectiva también requiere notificación práctica al agente y a las instituciones pertinentes."
      "Is a power of attorney the same as a health care proxy?": "¿Es un poder notarial lo mismo que un representante de atención médica?"
      "No. Financial powers of attorney and health care directives address different decisions and are usually documented separately.": "No. Los poderes notariales financieros y las directivas de atención médica abordan decisiones distintas y generalmente se documentan por separado."
      "Health Care Directives in North Jersey": "Directivas de atención médica en el norte de New Jersey"
      "Learn how New Jersey health care directives can name a representative and communicate treatment preferences if you cannot decide for yourself.": "Aprenda cómo las directivas de atención médica de New Jersey pueden designar a un representante y comunicar sus preferencias de tratamiento si usted no puede decidir por sí mismo."
      "Give the people you trust": "Brinde a las personas en las que confía"
      "clearer medical guidance.": "una guía médica más clara."
      "A health care directive can name a representative to make health care decisions if you become unable to decide and can record preferences that help guide difficult conversations.": "Una directiva de atención médica puede designar a un representante para tomar decisiones de atención médica en caso de que usted no pueda decidir, y puede registrar preferencias que ayuden a orientar conversaciones difíciles."
      "What is a health care directive?": "¿Qué es una directiva de atención médica?"
      "A written plan for medical decision-making during incapacity.": "Un plan por escrito para la toma de decisiones médicas durante una incapacidad."
      "New Jersey recognizes a proxy directive, which names a health care representative, and an instruction directive, often called a living will, which communicates treatment preferences.": "New Jersey reconoce una directiva de apoderado, que designa a un representante de atención médica, y una directiva de instrucciones, a menudo llamada testamento vital, que comunica las preferencias de tratamiento."
      "The representative's authority is intended for a time when you cannot make your own health care decisions. While you remain able to decide, your own decisions control.": "La autoridad del representante está destinada para un momento en el que usted no pueda tomar sus propias decisiones de atención médica. Mientras usted mantenga la capacidad de decidir, sus propias decisiones prevalecerán."
      "Make the conversation easier before a crisis.": "Facilite la conversación antes de una crisis."
      "You want to choose who should speak with physicians and make decisions if you cannot.": "Usted desea elegir quién debe hablar con los médicos y tomar decisiones si usted no puede hacerlo."
      "You want to name an alternate representative.": "Usted desea designar a un representante alternativo."
      "You have treatment preferences or values you want your representative to understand.": "Usted tiene preferencias o valores de tratamiento que desea que su representante comprenda."
      "You want family members and medical providers to have written guidance.": "Usted desea que los familiares y los proveedores médicos cuenten con una guía por escrito."
      "You have an older directive that names the wrong person or no longer reflects your wishes.": "Usted tiene una directiva antigua que designa a la persona incorrecta o que ya no refleja sus deseos."
      "You are preparing for surgery, managing a health condition, or completing a broader estate plan.": "Usted se está preparando para una cirugía, manejando una condición de salud o completando un plan de planificación patrimonial más amplio."
      "Choose a representative and communicate what matters to you.": "Elija un representante y comunique lo que es importante para usted."
      "Health care representative": "Representante de atención médica"
      "Name the person authorized to make health care decisions if you are unable to do so.": "Designar a la persona autorizada para tomar decisiones de atención médica si usted no puede hacerlo."
      "Alternate representative": "Representante alternativo"
      "Choose a backup if the first person is unable, unwilling, or unavailable to serve.": "Elegir un respaldo en caso de que la primera persona no pueda, no quiera o no esté disponible para ejercer el cargo."
      "Treatment preferences": "Preferencias de tratamiento"
      "Provide guidance about treatments, life-sustaining measures, and the values that should shape decisions.": "Proporcione orientación sobre tratamientos, medidas de soporte vital y los valores que deben orientar las decisiones."
      "People who receive copies": "Personas que reciben copias"
      "Plan how representatives, family members, physicians, and health care facilities can access the directive when needed.": "Planifique cómo los representantes, familiares, médicos y centros de atención médica pueden acceder a la directiva cuando sea necesario."
      "Advance directives are not only for older adults.": "Las directivas anticipadas no son solo para adultos mayores."
      "Any adult who wants to choose a health care representative": "Cualquier adulto que desee elegir un representante de atención médica"
      "People preparing for surgery or managing an illness": "Personas que se preparan para una cirugía o que están tratando una enfermedad"
      "Parents, caregivers, and adults with family responsibilities": "Padres, cuidadores y adultos con responsabilidades familiares"
      "People whose relatives disagree about medical decisions": "Personas cuyos familiares no están de acuerdo respecto a decisiones médicas"
      "Adults whose closest trusted person may not otherwise be the obvious decision-maker": "Adultos cuya persona de confianza más cercana podría no ser, de otro modo, la persona designada para tomar decisiones"
      "Anyone completing or updating an estate plan": "Cualquier persona que esté completando o actualizando un plan de planificación patrimonial"
      "Loved ones may be left without your written choice or instructions.": "Sus seres queridos podrían quedar sin su elección o instrucciones por escrito."
      "Without a directive, medical providers and family members may have to determine who should participate in decisions and what you would have wanted without the benefit of your written guidance.": "Sin una directiva, los proveedores médicos y los familiares podrían verse obligados a determinar quién debe participar en las decisiones y qué habría sido su voluntad, sin contar con el beneficio de su guía por escrito."
      "A directive cannot anticipate every medical circumstance, but it can identify the person you trust and give that person a clearer understanding of your values.": "Una directiva no puede anticipar todas las circunstancias médicas, pero puede identificar a la persona en quien usted confía y brindarle a esa persona una comprensión más clara de sus valores."
      "The document protects your voice; it does not replace it.": "El documento protege su voz; no la reemplaza."
      "“My representative decides while I still can.”": "“Mi representante decide mientras yo aún puedo hacerlo”."
      "Your representative acts only when you are unable to make your own health care decisions under the applicable standard.": "Su representante actúa únicamente cuando usted no pueda tomar sus propias decisiones de atención médica bajo el estándar aplicable."
      "“A directive is only about end-of-life care.”": "“Una directiva trata solo sobre los cuidados al final de la vida”."
      "A proxy directive can address health care decision-making more broadly during incapacity.": "Una directiva de procuración puede abordar la toma de decisiones de atención médica de manera más amplia durante una incapacidad."
      "“Completing the form ends the conversation.”": "“Completar el formulario pone fin a la conversación”."
      "Discussing your values with the representative and sharing accessible copies are important parts of the plan.": "Conversar sobre sus valores con el representante y compartir copias accesibles son partes importantes del plan."
      "Coordinate medical and financial decision-makers.": "Coordinar a los responsables de la toma de decisiones médicas y financieras."
      "A health care representative addresses medical decisions, while an agent under a financial power of attorney may handle bills, insurance, accounts, and other practical matters. Both roles may be needed during the same period.": "Un representante de atención médica se encarga de las decisiones médicas, mientras que un agente bajo un poder notarial financiero puede encargarse de facturas, seguros, cuentas y otros asuntos prácticos. Es posible que ambos roles sean necesarios durante el mismo período."
      "What is the difference between a proxy directive and a living will?": "¿Cuál es la diferencia entre una directiva de representante y un testamento vital?"
      "A proxy directive names a health care representative. An instruction directive, often called a living will, records treatment preferences. A person may use one or both.": "Una directiva de representante designa a un representante de atención médica. Una directiva de instrucciones, a menudo llamada testamento vital, registra las preferencias de tratamiento. Una persona puede utilizar una o ambas."
      "When can my representative make decisions?": "¿Cuándo puede mi representante tomar decisiones?"
      "The representative acts when you have been determined unable to make your own health care decisions under the applicable process. If you regain capacity, your own decisions control again.": "El representante actúa cuando se ha determinado que usted no puede tomar sus propias decisiones de atención médica bajo el proceso aplicable. Si recupera la capacidad, sus propias decisiones vuelven a prevalecer."
      "Who should receive a copy?": "¿Quién debería recibir una copia?"
      "Consider providing copies to the primary and alternate representatives, appropriate family members, physicians, and health care facilities involved in your care.": "Considere proporcionar copias a los representantes principal y alternativo, a los familiares pertinentes, a los médicos y a los centros de atención médica involucrados en su cuidado."
      "Can I change my directive?": "¿Puedo cambiar mi directiva?"
      "A person with capacity can generally update or revoke a directive. New copies should be shared so older instructions are not used by mistake.": "Una persona con capacidad puede, por lo general, actualizar o revocar una directiva. Se deben compartir copias nuevas para que las instrucciones antiguas no se utilicen por error."
      "Is a POLST the same as an advance directive?": "¿Es un POLST lo mismo que una directiva anticipada?"
      "No. A POLST is a medical order used in particular serious-illness circumstances. It can complement, but does not automatically replace, an advance directive.": "No. Un POLST es una orden médica que se utiliza en circunstancias particulares de enfermedades graves. Puede complementar, pero no reemplaza automáticamente, una directiva anticipada."
      "Plain-language answers to common estate-planning questions about wills, trusts, incapacity documents, and working with Miranda Law.": "Respuestas en lenguaje sencillo a preguntas comunes sobre planificación patrimonial con respecto a testamentos, fideicomisos, documentos de incapacidad y el trabajo con Miranda Law."
      "Clear answers create": "Respuestas claras crean"
      "better questions.": "mejores preguntas."
      "Use these general answers to organize what you want to discuss. Your own plan should be based on your family, property, responsibilities, and goals.": "Utilice estas respuestas generales para organizar lo que desea discutir. Su propio plan debe basarse en su familia, propiedades, responsabilidades y objetivos."
      "Open the planning checklist": "Abrir la lista de verificación de planificación"
      "General information to help you prepare for a conversation.": "Información general para ayudarle a prepararse para una conversación."
      "Getting started": "Primeros pasos"
      "What documents are usually included in an estate plan?": "¿Qué documentos se incluyen generalmente en un plan de planificación patrimonial?"
      "Many plans include a will, financial power of attorney, and health care directives. A trust may be appropriate depending on the family, property, and goals involved.": "Muchos planes incluyen un testamento, un poder notarial financiero y directivas de atención médica. Un fideicomiso puede ser apropiado dependiendo de la familia, los bienes y los objetivos involucrados."
      "Do I need an estate plan if I do not have significant wealth?": "¿Necesito un plan de planificación patrimonial si no tengo una riqueza significativa?"
      "Planning also addresses decision-makers, incapacity, minor children, personal property, and family guidance. Those issues can matter regardless of wealth.": "La planificación también aborda las personas encargadas de tomar decisiones, la incapacidad, los hijos menores, los bienes personales y la orientación familiar. Esos asuntos pueden ser importantes independientemente de la riqueza."
      "What should I bring to the first consultation?": "¿Qué debo llevar a la primera consulta?"
      "Bring any existing estate-planning documents you can locate and a general list of family members, property, accounts, insurance, business interests, and questions. You do not need perfect numbers or final decisions.": "Traiga cualquier documento de planificación patrimonial existente que pueda localizar y una lista general de familiares, propiedades, cuentas, seguros, intereses comerciales y preguntas. No necesita cifras exactas ni decisiones finales."
      "Is the initial consultation free?": "¿La consulta inicial es gratuita?"
      "Yes. Miranda Law provides a free initial consultation and discusses the recommended scope and fee before legal work begins.": "Sí. Miranda Law ofrece una consulta inicial gratuita y analiza el alcance recomendado y los honorarios antes de que comience el trabajo legal."
      "Wills and trusts": "Testamentos y fideicomisos"
      "What happens if I die without a will in New Jersey?": "¿Qué sucede si fallezco sin un testamento en New Jersey?"
      "New Jersey's intestacy rules govern the distribution of probate property, and a court process may be needed to appoint an administrator. The result may not reflect every personal wish or relationship.": "Las reglas de sucesión intestada de New Jersey rigen la distribución de los bienes sujetos a validación judicial (probate), y puede ser necesario un proceso judicial para designar a un administrador. El resultado puede no reflejar todos los deseos o relaciones personales."
      "Does a will avoid probate?": "¿Un testamento evita el proceso de validación judicial (probate)?"
      "A will generally provides instructions for probate rather than avoiding the process by itself. Other ownership and trust arrangements may affect how particular assets are handled.": "Un testamento generalmente proporciona instrucciones para la validación judicial en lugar de evitar el proceso por sí mismo. Otros acuerdos de propiedad y fideicomisos pueden afectar la manera en que se gestionan activos particulares."
      "Does everyone need a trust?": "¿Todo el mundo necesita un fideicomiso?"
      "No. A trust can be useful for particular management, continuity, or distribution goals, but some plans can be handled effectively through other documents and arrangements.": "No. Un fideicomiso puede ser útil para objetivos específicos de gestión, continuidad o distribución, pero algunos planes pueden manejarse eficazmente a través de otros documentos y acuerdos."
      "Funding generally means transferring or coordinating selected assets so the trust can govern them. A signed trust that is not connected to the intended assets may not accomplish the expected result.": "La financiación generalmente significa transferir o coordinar activos seleccionados para que el fideicomiso pueda gobernarlos. Un fideicomiso firmado que no esté vinculado a los activos previstos puede no lograr el resultado esperado."
      "Planning for incapacity": "Planificación para la incapacidad"
      "What does a financial power of attorney do?": "¿Qué hace un poder notarial financiero?"
      "It authorizes a person you choose to handle the financial, legal, property, or other matters described in the document.": "Autoriza a una persona elegida por usted para encargarse de los asuntos financieros, legales, de propiedad u otros descritos en el documento."
      "Is a health care directive the same as a financial power of attorney?": "¿Es una directiva de atención médica lo mismo que un poder notarial financiero?"
      "No. A health care directive concerns medical decision-making. A financial power of attorney concerns the financial and legal authority written into that document.": "No. Una directiva de atención médica se refiere a la toma de decisiones médicas. Un poder notarial financiero se refiere a la autoridad financiera y legal establecida en dicho documento."
      "Can my health care representative decide for me while I still can?": "¿Puede mi representante de atención médica decidir por mí mientras yo todavía pueda hacerlo?"
      "No. Under New Jersey guidance, the representative acts when you have been determined unable to make your own health care decisions. If you regain that ability, your own decisions control again.": "No. Bajo las directrices de New Jersey, el representante actúa cuando se ha determinado que usted no puede tomar sus propias decisiones de atención médica. Si recupera esa capacidad, sus propias decisiones vuelven a prevalecer."
      "Who should receive copies of my health care directive?": "¿Quién debería recibir copias de mi directiva de atención médica?"
      "Consider giving copies to your primary and alternate representatives, appropriate family members, physicians, and health care facilities involved in your care.": "Considere entregar copias a sus representantes principal y alternativo, a los familiares correspondientes, a sus médicos y a los centros de atención médica involucrados en su cuidado."
      "Working with Miranda Law": "Trabajando con Miranda Law"
      "Yes. The firm communicates with clients in English, Spanish, and Portuguese.": "Sí. La firma se comunica con los clientes en inglés, español y portugués."
      "How can I contact the office?": "¿Cómo puedo contactar a la oficina?"
      "The legal team handles intake and scheduling by phone, text, WhatsApp, and email.": "El equipo legal gestiona la recepción de casos y la programación mediante teléfono, mensaje de texto, WhatsApp y correo electrónico."
      "How much does an estate plan cost?": "¿Cuánto cuesta un plan de planificación patrimonial?"
      "The fee depends on the documents and complexity involved. The firm discusses the proposed work and fee after understanding your needs.": "Los honorarios dependen de los documentos y la complejidad involucrada. La firma analiza el trabajo propuesto y los honorarios tras comprender sus necesidades."
      "How often should I update my plan?": "¿Con qué frecuencia debo actualizar mi plan?"
      "Consider a review after major family, health, property, or financial changes and when the people named in the documents are no longer the right choices.": "Considere una revisión después de cambios importantes en su familia, salud, propiedad o finanzas, y cuando las personas designadas en los documentos ya no sean las opciones adecuadas."
      "Prepare for an estate-planning consultation with a practical checklist covering family, documents, property, decision-makers, and questions.": "Prepárese para una consulta de planificación patrimonial con una lista de verificación práctica que cubre familia, documentos, propiedades, responsables de la toma de decisiones y preguntas."
      "Estate planning checklist": "Lista de verificación de planificación patrimonial"
      "Gather what you can.": "Reúna todo lo que pueda."
      "Bring the questions you still have.": "Traiga las preguntas que aún tenga."
      "You do not need every account number or every decision before a consultation. This checklist helps you collect the information that can make the conversation more productive.": "No necesita tener cada número de cuenta o cada decisión resuelta antes de una consulta. Esta lista de verificación le ayuda a recopilar la información que puede hacer que la conversación sea más productiva."
      "Read the FAQs": "Leer las preguntas frecuentes"
      "Preparation guide": "Guía de preparación"
      "Use this as a working list—not a test.": "Utilice esto como una lista de trabajo, no como un examen."
      "Check what is easy to gather. Make a note beside anything you cannot find or do not understand. Those gaps are useful topics for the consultation.": "Verifique qué es fácil de reunir. Tome nota junto a cualquier elemento que no pueda encontrar o que no comprenda. Esos vacíos son temas útiles para la consulta."
      "People and family": "Personas y familia"
      "Legal names and contact information for close family members": "Nombres legales e información de contacto de los familiares cercanos"
      "Children, stepchildren, and anyone who depends on you": "Hijos, hijastros y cualquier persona que dependa de usted"
      "People you may trust as executor, trustee, agent, or health care representative": "Personas en las que pueda confiar como albacea, fiduciario, agente o representante de atención médica"
      "Backup choices if a first choice cannot serve": "Opciones de respaldo en caso de que la primera opción no pueda ejercer el cargo"
      "Existing documents": "Documentos existentes"
      "Current wills, trusts, powers of attorney, and health care directives": "Testamentos, fideicomisos, poderes notariales y directivas de atención médica vigentes"
      "Prenuptial, postnuptial, divorce, or separation agreements that may affect planning": "Acuerdos prenupciales, postnupciales, de divorcio o de separación que puedan afectar la planificación"
      "Business agreements or succession documents": "Acuerdos comerciales o documentos de sucesión"
      "Any document you no longer understand or believe is out of date": "Cualquier documento que ya no comprenda o que considere que está desactualizado"
      "Property and accounts": "Propiedades y cuentas"
      "Homes, other real estate, and how each property is titled": "Casas, otros bienes raíces y la titularidad de cada propiedad"
      "Bank, investment, and retirement accounts": "Cuentas bancarias, de inversión y de jubilación"
      "Life insurance and current beneficiary designations": "Seguros de vida y designaciones actuales de beneficiarios"
      "Business ownership, vehicles, and significant personal property": "Propiedad de negocios, vehículos y bienes personales significativos"
      "Debts, mortgages, and other major obligations": "Deudas, hipotecas y otras obligaciones importantes"
      "Your wishes": "Sus deseos"
      "Who should receive property and whether any gifts need special handling": "Quién debe recibir los bienes y si algún legado requiere un manejo especial"
      "Who should administer the estate": "Quién debe administrar el patrimonio"
      "Who should care for minor children if a guardian is needed": "Quién debería cuidar de los hijos menores si se requiere un tutor"
      "Whether property should be managed over time for a beneficiary": "Si una propiedad debe ser administrada a lo largo del tiempo para un beneficiario"
      "Charitable gifts or personal items with special meaning": "Donaciones caritativas o artículos personales con un significado especial"
      "Financial decision-making": "Toma de decisiones financieras"
      "Who should handle financial and legal matters if you cannot": "Quién debería encargarse de los asuntos financieros y legales en caso de que usted no pueda hacerlo"
      "What authority that person may need": "Qué autoridad podría necesitar esa persona"
      "Who should serve as the backup agent": "Quién debería actuar como agente suplente"
      "Any business, property, benefits, or family responsibilities the agent should understand": "Cualquier negocio, propiedad, beneficio o responsabilidad familiar que el agente deba conocer"
      "Health care decisions": "Decisiones de atención médica"
      "Who should serve as health care representative and alternate": "Quién debe actuar como representante de atención médica y suplente"
      "Treatment preferences or values you want that person to understand": "Preferencias de tratamiento o valores que desea que esa persona comprenda"
      "Physicians and family members who should receive a copy": "Médicos y familiares que deberían recibir una copia"
      "Existing forms that may need review or replacement": "Formularios existentes que pueden requerir revisión o reemplazo"
      "Questions for the consultation": "Preguntas para la consulta"
      "What prompted you to consider planning now?": "¿Qué le motivó a considerar la planificación en este momento?"
      "What are you most concerned could become confusing or difficult?": "¿Qué es lo que más le preocupa que pueda volverse confuso o difícil?"
      "Are there family relationships or special needs the documents should account for?": "¿Existen relaciones familiares o necesidades especiales que los documentos deban contemplar?"
      "Which decisions are you ready to make, and which ones still feel uncertain?": "¿Qué decisiones está listo para tomar y cuáles aún siente que son inciertas?"
      "How soon do you need assistance?": "¿Con qué prontitud necesita asistencia?"
      "You do not need to finish the checklist before calling.": "No es necesario completar la lista de verificación antes de llamar."
      "A free initial consultation can help you decide what information matters and what can wait until later.": "Una consulta inicial gratuita puede ayudarle a decidir qué información es importante y qué puede esperar hasta más adelante."
      "Estate Planning Video Library": "Biblioteca de videos sobre planificación patrimonial"
      "Explore Miranda Law's planned video topics covering wills, trusts, powers of attorney, health care directives, and consultation preparation.": "Explore los temas de video planificados de Miranda Law, que cubren testamentos, fideicomisos, poderes notariales, directivas de atención médica y la preparación para su consulta."
      "Video library": "Biblioteca de videos"
      "Estate planning explained": "La planificación patrimonial explicada"
      "with clarity.": "con claridad."
      "Short videos are being prepared to answer common questions in a direct, useful format.": "Se están preparando videos cortos para responder preguntas comunes en un formato directo y útil."
      "Read the FAQs now": "Lea las preguntas frecuentes ahora"
      "Coming soon": "Próximamente"
      "Reviewed videos are in production.": "Los videos revisados se encuentran en producción."
      "Topics are listed as a preview. No recording, client story, or legal outcome is represented before final review and publication.": "Los temas se enumeran como una vista previa. No se representa ninguna grabación, historia de cliente ni resultado legal antes de la revisión y publicación final."
      "Video coming soon": "Video próximamente"
      "Why decision-makers, incapacity, children, and personal property matter at many asset levels.": "Por qué los responsables de la toma de decisiones, la incapacidad, los hijos y los bienes personales son importantes en muchos niveles de activos."
      "What does a will actually control?": "¿Qué controla realmente un testamento?"
      "A plain-language look at probate property, executors, guardians, and written wishes.": "Una mirada en lenguaje sencillo sobre los bienes sujetos a sucesión, albaceas, tutores y deseos por escrito."
      "When might a trust be useful?": "¿Cuándo podría ser útil un fideicomiso?"
      "How management, continuity, and distribution goals can shape the conversation.": "Cómo los objetivos de administración, continuidad y distribución pueden orientar la conversación."
      "Who should I name to act for me?": "¿A quién debería nombrar para que actúe en mi nombre?"
      "Practical considerations when choosing financial and health care decision-makers.": "Consideraciones prácticas al elegir a los responsables de las decisiones financieras y de atención médica."
      "Estate Planning Blog": "Blog de planificación patrimonial"
      "Read clear estate-planning articles from Miranda Law about wills, trusts, decision-makers, and preparing for a consultation.": "Lea artículos claros sobre planificación patrimonial de Miranda Law acerca de testamentos, fideicomisos, personas designadas para la toma de decisiones y cómo prepararse para una consulta."
      "Miranda Law blog": "Blog de Miranda Law"
      "Estate planning guidance": "Guía de planificación patrimonial"
      "in plain language.": "en lenguaje sencillo."
      "Practical articles to help New Jersey families understand common planning questions and prepare for a conversation with an attorney.": "Artículos prácticos para ayudar a las familias de New Jersey a comprender las preguntas comunes sobre planificación y a prepararse para una conversación con un abogado."
      "Article": "Artículo"
