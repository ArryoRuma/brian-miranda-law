      "Topics": "Tópicos"
      "Choose the easiest way to reach the office.": "Escolha a maneira mais fácil de entrar em contato com o escritório."
      "The legal team handles initial intake and scheduling. A first conversation helps the firm understand the general nature of your matter and determine an appropriate next step.": "A equipe jurídica é responsável pelo atendimento inicial e agendamento. Uma primeira conversa ajuda o escritório a entender a natureza geral do seu caso e a determinar o próximo passo apropriado."
      "Contacting the firm does not create an attorney-client relationship. Please do not send confidential or time-sensitive information until the firm confirms representation.": "Entrar em contato com o escritório não cria uma relação advogado-cliente. Por favor, não envie informações confidenciais ou urgentes até que o escritório confirme a representação."
      "908-424-1011": "908-424-1011"
      "Send a text message": "Enviar uma mensagem de texto"
      "Message on WhatsApp": "Mensagem no WhatsApp"
      "Warren office": "Escritório em Warren"
      "Meet by appointment in North Jersey.": "Reuniões mediante agendamento em North Jersey."
      "Miranda Law primarily serves clients in Monmouth County and communities north of it. Contact the office to arrange a consultation.": "A Miranda Law atende principalmente clientes em Monmouth County e comunidades ao norte desta. Entre em contato com o escritório para agendar uma consulta."
      "Privacy Policy": "Política de Privacidade"
      "Read how Miranda Law may handle information submitted through this website and how to contact the firm with privacy questions.": "Leia como a Miranda Law pode tratar as informações enviadas por meio deste site e como entrar em contato com o escritório para dúvidas sobre privacidade."
      "August 14, 2026": "14 de agosto de 2026"
      "This policy describes the general categories of information that may be processed through the Miranda Law website. It should be reviewed again when the secure intake, scheduling, analytics, and hosting services are finalized.": "Esta política descreve as categorias gerais de informações que podem ser processadas através do site da Miranda Law. Ela deve ser revisada novamente quando os serviços de triagem segura, agendamento, análise e hospedagem forem finalizados."
      "Information you choose to provide": "Informações que você opta por fornecer"
      "You may choose to provide contact information and a general description of your legal needs when communicating with the firm. Do not submit confidential, highly sensitive, or time-sensitive information until Miranda Law confirms that the communication method is appropriate and that the firm represents you.": "Ao comunicar-se com o escritório, você pode optar por fornecer informações de contato e uma descrição geral de suas necessidades jurídicas. Não envie informações confidenciaentes, altamente sensíveis ou urgentes até que a Miranda Law confirme que o método de comunicação é apropriado e que o escritório o representa."
      "Website and analytics information": "Informações do site e de análise"
      "The website and its service providers may process technical information such as browser type, device type, referring page, pages visited, approximate location, and interaction data for security, performance, and website improvement.": "O site e seus provedores de serviços podem processar informações técnicas, como tipo de navegador, tipo de dispositivo, página de referência, páginas visitadas, localização aproximada e dados de interação para fins de segurança, desempenho e melhoria do site."
      "How information may be used": "Como as informações podem ser utilizadas"
      "Respond to inquiries and help schedule consultations": "Responder a consultas e auxiliar no agendamento de consultas"
      "Evaluate whether the firm can consider a matter": "Avaliar se o escritório pode considerar um caso"
      "Operate, secure, and improve the website": "Operar, proteger e melhorar o site"
      "Maintain records and comply with legal or professional obligations": "Manter registros e cumprir obrigações legais ou profissionais"
      "Prevent misuse, fraud, or threats to the website and its users": "Prevenir uso indevido, fraude ou ameaças ao site e aos seus usuários"
      "Service providers and legal requirements": "Provedores de serviços e requisitos legais"
      "Information may be processed by service providers that support hosting, communications, scheduling, analytics, security, or intake. Information may also be disclosed when required by law, court process, professional obligation, or a good-faith need to protect rights and safety.": "As informações podem ser processadas por provedores de serviços que dão suporte à hospedagem, comunicações, agendamento, análise, segurança ou triagem. As informações também podem ser divulgadas quando exigido por lei, processo judicial, obrigação profissional ou por uma necessidade de boa-fé para proteger direitos e a segurança."
      "Questions and requests": "Dúvidas e solicitações"
      "Questions about this policy may be sent to bmiranda@bmirandalaw.com. The availability of particular privacy rights depends on the law that applies to the request.": "Dúvidas sobre esta política podem ser enviadas para bmiranda@bmirandalaw.com. A disponibilidade de direitos de privacidade específicos depende da lei aplicável à solicitação."
      "Cookie Notice": "Aviso de Cookies"
      "Learn how Miranda Law's website may use essential storage and limited analytics technologies.": "Saiba como o site da Miranda Law pode utilizar tecnologias de armazenamento essenciais e de análise limitada."
      "Cookies and similar browser technologies can help a website function, remember preferences, measure performance, and protect against misuse.": "Cookies e tecnologias semelhantes do navegador podem ajudar um site a funcionar, lembrar preferências, medir o desempenho e proteger contra uso indevido."
      "Essential technologies": "Tecnologias essenciais"
      "Essential technologies may be used when necessary to deliver pages, maintain security, remember a user choice, or support a requested feature. Blocking them may affect how parts of the website work.": "Tecnologias essenciais podem ser utilizadas quando necessário para entregar páginas, manter a segurança, lembrar uma escolha do usuário ou suportar um recurso solicitado. O bloqueio destas tecnologias pode afetar o funcionamento de partes do website."
      "Analytics": "Análise de dados"
      "The website may use privacy-conscious analytics to understand aggregate traffic and page usage. The final analytics configuration and retention settings should be confirmed before launch.": "O website pode utilizar ferramentas de análise que respeitam a privacidade para compreender o tráfego agregado e o uso das páginas. A configuração final da análise e as definições de retenção devem ser confirmadas antes do lançamento."
      "Managing browser storage": "Gerenciamento de armazenamento do navegador"
      "Most browsers allow you to delete or block cookies and other stored website data. Those controls are available in the privacy or site-settings area of your browser.": "A maioria dos navegadores permite excluir ou bloquear cookies e outros dados armazenados do website. Esses controles estão disponíveis na área de privacidade ou de configurações do site do seu navegador."
      "Updates": "Atualizações"
      "This notice may be updated when the website's hosting, analytics, intake, or scheduling services change. The updated date above identifies the current version.": "Este aviso pode ser atualizado quando os serviços de hospedagem, análise, triagem ou agendamento do website forem alterados. A data de atualização acima identifica a versão atual."
      "Read the Miranda Law website disclaimer concerning general information, attorney-client relationships, communications, and results.": "Leia o aviso legal do website da Miranda Law referente a informações gerais, relação advogado-cliente, comunicações e resultados."
      "This website provides general information about Miranda Law and selected legal topics. It is not a substitute for advice from an attorney who has reviewed your circumstances.": "Este website fornece informações gerais sobre a Miranda Law e tópicos jurídicos selecionados. Ele não substitui o aconselhamento de um advogado que tenha analisado as suas circunstâncias."
      "No legal advice": "Ausência de aconselhamento jurídico"
      "Website content is educational and may not reflect every legal development, exception, deadline, or fact that could affect a matter. Do not act or refrain from acting solely because of information on this website.": "O conteúdo do website é educativo e pode não refletir todos os desenvolvimentos jurídicos, exceções, prazos ou fatos que possam afetar uma questão. Não tome decisões ou deixe de tomá-las baseando-se exclusivamente nas informações contidas neste website."
      "No attorney-client relationship": "Ausência de relação advogado-cliente"
      "Viewing the website, using a questionnaire, sending a message, or speaking with the office does not by itself create an attorney-client relationship. Representation begins only after Miranda Law confirms acceptance and the required agreement is completed.": "A visualização do website, o uso de um questionário, o envio de uma mensagem ou o contato com o escritório não criam, por si só, uma relação advogado-cliente. A representação começa apenas após a Miranda Law confirmar a aceitação e o contrato necessário ser formalizado."
      "Communications and deadlines": "Comunicações e prazos"
      "Do not send confidential information until the firm confirms that it is appropriate to do so. Do not rely on an unconfirmed website, email, text, or voicemail communication to protect a filing date, court date, response period, or other deadline.": "Não envie informações confidenciais até que o escritório confirme que é apropriado fazê-lo. Não dependa de uma comunicação não confirmada via website, e-mail, texto ou mensagem de voz para proteger uma data de protocolo, data de audiência, período de resposta ou outro prazo."
      "Jurisdiction and availability": "Jurisdição e disponibilidade"
      "The availability of legal services depends on jurisdiction, the facts, timing, conflicts, and the firm's acceptance of the matter. Website content is not intended to advertise services where doing so would violate applicable professional rules.": "A disponibilidade dos serviços jurídicos depende da jurisdição, dos fatos, do cronograma, de conflitos de interesse e da aceitação da questão pelo escritório. O conteúdo do website não tem o objetivo de anunciar serviços onde tal prática violaria as normas profissionais aplicáveis."
      "No guarantee of results": "Ausência de garantia de resultados"
      "Descriptions of services, examples, or past matters do not guarantee a particular outcome. Legal results depend on the facts, law, evidence, decision-makers, and other circumstances of each matter.": "Descrições de serviços, exemplos ou casos anteriores não garantem um resultado específico. Os resultados jurídicos dependem dos fatos, da lei, das provas, dos decisores e de outras circunstâncias de cada caso."
      "Accessibility Statement": "Declaração de Acessibilidade"
      "Read Miranda Law's website accessibility statement and find contact information for assistance accessing website content.": "Leia a declaração de acessibilidade do website da Miranda Law e encontre informações de contato para assistência no acesso ao conteúdo do site."
      "Miranda Law is working to provide a website that is usable by people with a wide range of abilities, devices, browsers, and assistive technologies.": "A Miranda Law está trabalhando para fornecer um website que seja utilizável por pessoas com uma ampla gama de habilidades, dispositivos, navegadores e tecnologias assistivas."
      "Our approach": "Nossa abordagem"
      "The website is designed with semantic headings, keyboard-accessible controls, visible focus states, descriptive links, responsive layouts, and text alternatives for meaningful images. Accessibility will be included in ongoing content and quality reviews.": "O website foi desenvolvido com cabeçalhos semânticos, controles acessíveis via teclado, estados de foco visíveis, links descritivos, layouts responsivos e alternativas de texto para imagens significativas. A acessibilidade será incluída nas revisões contínuas de conteúdo e qualidade."
      "Need assistance?": "Precisa de assistência?"
      "If you have difficulty accessing content or completing a task, contact the office at 908-424-1011 or bmiranda@bmirandalaw.com. Please describe the page, feature, and assistance you need.": "Se você tiver dificuldade em acessar o conteúdo ou concluir uma tarefa, entre em contato com o escritório pelo telefone 908-424-1011 ou pelo e-mail bmiranda@bmirandalaw.com. Por favor, descreva a página, o recurso e a assistência de que necessita."
      "Feedback": "Feedback"
      "Accessibility is an ongoing process. Feedback about barriers helps the firm prioritize improvements as the website and its intake tools evolve.": "A acessibilidade é um processo contínuo. O feedback sobre barreiras ajuda o escritório a priorizar melhorias à medida que o website e suas ferramentas de triagem evoluem."
      "What we may ask": "O que podemos perguntar"
      "Please do not include confidential or time-sensitive information until the firm confirms representation.": "Por favor, não inclua informações confidenciais ou urgentes até que o escritório confirme a representação legal."
      "Page Not Found": "Página Não Encontrada"
      "The requested Miranda Law page could not be found.": "A página da Miranda Law solicitada não pôde ser encontrada."
      "404": "404"
      "That page could not be found.": "Esta página não pôde ser encontrada."
      "The page may have moved, or the address may be incomplete.": "A página pode ter sido movida ou o endereço pode estar incompleto."
      "Return home": "Voltar à página inicial"
