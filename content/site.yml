  faq:
    eyebrow: Estate planning FAQs
    title: Questions About Estate Planning?
    body: Start with clear answers to a few of the questions New Jersey families ask most often.
    linkLabel: View Estate Planning FAQs
    href: /resources/estate-planning-faqs
    items:
      - question: Do I need an estate plan if I am not wealthy?
        answer: Estate planning is not only about wealth. It can help you name decision-makers, document your wishes, prepare for incapacity, and make important matters clearer for the people you love.
      - question: What documents are commonly included in an estate plan?
        answer: Depending on your circumstances, an estate plan may include a will, trust, power of attorney, and healthcare directive. We’ll help you understand which documents make sense for your situation.
      - question: How much does estate planning cost?
        answer: The cost depends on the documents and complexity involved. After your free initial consultation, we’ll explain what your situation requires and the associated fees before moving forward.
      - question: What happens during the initial consultation?
        answer: We’ll learn about your family, priorities, property, existing documents, and questions, then explain the options that may fit your goals. You do not need to arrive with every decision already made.
      - question: Can Miranda Law assist me in Spanish or Portuguese?
        answer: Yes. Miranda Law serves clients in English, Spanish, and Portuguese so you can discuss important legal decisions in the language you’re most comfortable using.
      - question: Does Miranda Law offer virtual consultations?
        answer: Consultation formats may depend on your circumstances. Contact Miranda Law to ask whether a virtual consultation is available for your matter.
