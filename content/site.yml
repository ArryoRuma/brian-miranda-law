      "Meet by appointment in North Jersey.": "Reuniones con cita previa en North Jersey."
      "Miranda Law primarily serves clients in Monmouth County and communities north of it. Contact the office to arrange a consultation.": "Miranda Law atiende principalmente a clientes en Monmouth County y las comunidades al norte de este. Contacte a la oficina para programar una consulta."
      "Privacy Policy": "Política de privacidad"
      "Read how Miranda Law may handle information submitted through this website and how to contact the firm with privacy questions.": "Lea cómo Miranda Law puede manejar la información enviada a través de este sitio web y cómo ponerse en contacto con la firma si tiene preguntas sobre privacidad."
      "August 14, 2026": "14 de agosto de 2026"
      "This policy describes the general categories of information that may be processed through the Miranda Law website. It should be reviewed again when the secure intake, scheduling, analytics, and hosting services are finalized.": "Esta política describe las categorías generales de información que pueden procesarse a través del sitio web de Miranda Law. Debe revisarse nuevamente cuando se finalicen los servicios de recepción segura, programación, análisis y alojamiento."
      "Information you choose to provide": "Información que usted elige proporcionar"
      "You may choose to provide contact information and a general description of your legal needs when communicating with the firm. Do not submit confidential, highly sensitive, or time-sensitive information until Miranda Law confirms that the communication method is appropriate and that the firm represents you.": "Al comunicarse con la firma, usted puede optar por proporcionar información de contacto y una descripción general de sus necesidades legales. No envíe información confidencial, altamente sensible o urgente hasta que Miranda Law confirme que el método de comunicación es adecuado y que la firma lo representa."
      "Website and analytics information": "Información del sitio web y de análisis"
      "The website and its service providers may process technical information such as browser type, device type, referring page, pages visited, approximate location, and interaction data for security, performance, and website improvement.": "El sitio web y sus proveedores de servicios pueden procesar información técnica como el tipo de navegador, el tipo de dispositivo, la página de referencia, las páginas visitadas, la ubicación aproximada y los datos de interacción con fines de seguridad, rendimiento y mejora del sitio web."
      "How information may be used": "Cómo puede utilizarse la información"
      "Respond to inquiries and help schedule consultations": "Responder a consultas y ayudar a programar consultas"
      "Evaluate whether the firm can consider a matter": "Evaluar si la firma puede considerar un asunto"
      "Operate, secure, and improve the website": "Operar, asegurar y mejorar el sitio web"
      "Maintain records and comply with legal or professional obligations": "Mantener registros y cumplir con obligaciones legales o profesionales"
      "Prevent misuse, fraud, or threats to the website and its users": "Prevenir el uso indebido, el fraude o las amenazas al sitio web y a sus usuarios"
      "Service providers and legal requirements": "Proveedores de servicios y requisitos legales"
      "Information may be processed by service providers that support hosting, communications, scheduling, analytics, security, or intake. Information may also be disclosed when required by law, court process, professional obligation, or a good-faith need to protect rights and safety.": "La información puede ser procesada por proveedores de servicios que brindan apoyo en alojamiento, comunicaciones, programación, análisis, seguridad o recepción. La información también puede ser divulgada cuando así lo requiera la ley, un proceso judicial, una obligación profesional o una necesidad de buena fe para proteger derechos y la seguridad."
      "Questions and requests": "Preguntas y solicitudes"
      "Questions about this policy may be sent to bmiranda@bmirandalaw.com. The availability of particular privacy rights depends on the law that applies to the request.": "Las preguntas sobre esta política pueden enviarse a bmiranda@bmirandalaw.com. La disponibilidad de derechos de privacidad particulares depende de la ley que se aplique a la solicitud."
      "Cookie Notice": "Aviso de cookies"
      "Learn how Miranda Law's website may use essential storage and limited analytics technologies.": "Conozca cómo el sitio web de Miranda Law puede utilizar tecnologías de almacenamiento esenciales y de análisis limitado."
      "Cookies and similar browser technologies can help a website function, remember preferences, measure performance, and protect against misuse.": "Las cookies y tecnologías similares del navegador pueden ayudar a que un sitio web funcione, recuerde preferencias, mida el rendimiento y proteja contra el uso indebido."
      "Essential technologies": "Tecnologías esenciales"
      "Essential technologies may be used when necessary to deliver pages, maintain security, remember a user choice, or support a requested feature. Blocking them may affect how parts of the website work.": "Las tecnologías esenciales pueden utilizarse cuando sea necesario para entregar las páginas, mantener la seguridad, recordar una elección del usuario o permitir una función solicitada. Bloquearlas puede afectar el funcionamiento de algunas partes del sitio web."
      "Analytics": "Análisis"
      "The website may use privacy-conscious analytics to understand aggregate traffic and page usage. The final analytics configuration and retention settings should be confirmed before launch.": "El sitio web puede utilizar análisis respetuos con la privacidad para comprender el tráfico agregado y el uso de las páginas. La configuración final de los análisis y los ajustes de retención deben confirmarse antes del lanzamiento."
      "Managing browser storage": "Gestión del almacenamiento del navegador"
      "Most browsers allow you to delete or block cookies and other stored website data. Those controls are available in the privacy or site-settings area of your browser.": "La mayoría de los navegadores permiten eliminar o bloquear cookies y otros datos almacenados del sitio web. Dichos controles están disponibles en el área de privacidad o de configuración del sitio de su navegador."
      "Updates": "Actualizaciones"
      "This notice may be updated when the website's hosting, analytics, intake, or scheduling services change. The updated date above identifies the current version.": "Este aviso puede actualizarse cuando cambien los servicios de alojamiento, análisis, recepción de casos o programación del sitio web. La fecha de actualización arriba indicada identifica la versión actual."
      "Read the Miranda Law website disclaimer concerning general information, attorney-client relationships, communications, and results.": "Lea el descargo de responsabilidad del sitio web de Miranda Law con respecto a la información general, las relaciones abogado-cliente, las comunicaciones y los resultados."
      "This website provides general information about Miranda Law and selected legal topics. It is not a substitute for advice from an attorney who has reviewed your circumstances.": "Este sitio web proporciona información general sobre Miranda Law y temas legales seleccionados. No sustituye el asesoramiento de un abogado que haya revisado sus circunstancias."
      "No legal advice": "Sin asesoramiento legal"
      "Website content is educational and may not reflect every legal development, exception, deadline, or fact that could affect a matter. Do not act or refrain from acting solely because of information on this website.": "El contenido del sitio web es educativo y puede no reflejar cada desarrollo legal, excepción, plazo o hecho que pudiera afectar un asunto. No actúe ni se abstenga de actuar únicamente debido a la información contenida en este sitio web."
      "No attorney-client relationship": "Sin relación abogado-cliente"
      "Viewing the website, using a questionnaire, sending a message, or speaking with the office does not by itself create an attorney-client relationship. Representation begins only after Miranda Law confirms acceptance and the required agreement is completed.": "Ver el sitio web, utilizar un cuestionario, enviar un mensaje o hablar con la oficina no crea por sí mismo una relación abogado-cliente. La representación comienza únicamente después de que Miranda Law confirme su aceptación y se complete el acuerdo requerido."
      "Communications and deadlines": "Comunicaciones y plazos"
      "Do not send confidential information until the firm confirms that it is appropriate to do so. Do not rely on an unconfirmed website, email, text, or voicemail communication to protect a filing date, court date, response period, or other deadline.": "No envíe información confidencial hasta que la firma confirme que es apropiado hacerlo. No dependa de una comunicación no confirmada por sitio web, correo electrónico, mensaje de texto o buzón de voz para proteger una fecha de presentación, fecha de audiencia, periodo de respuesta u otro plazo."
      "Jurisdiction and availability": "Jurisdicción y disponibilidad"
      "The availability of legal services depends on jurisdiction, the facts, timing, conflicts, and the firm's acceptance of the matter. Website content is not intended to advertise services where doing so would violate applicable professional rules.": "La disponibilidad de los servicios legales depende de la jurisdicción, los hechos, el tiempo, los conflictos y la aceptación del asunto por parte de la firma. El contenido del sitio web no tiene la intención de anunciar servicios donde hacerlo violaría las normas profesionales aplicables."
      "No guarantee of results": "Sin garantía de resultados"
      "Descriptions of services, examples, or past matters do not guarantee a particular outcome. Legal results depend on the facts, law, evidence, decision-makers, and other circumstances of each matter.": "Las descripciones de los servicios, ejemplos o asuntos pasados no garantizan un resultado particular. Los resultados legales dependen de los hechos, la ley, las pruebas, los encargados de tomar decisiones y otras circunstancias de cada asunto."
      "Accessibility Statement": "Declaración de accesibilidad"
      "Read Miranda Law's website accessibility statement and find contact information for assistance accessing website content.": "Lea la declaración de accesibilidad del sitio web de Miranda Law y encuentre la información de contacto para recibir asistencia al acceder al contenido del sitio."
      "Miranda Law is working to provide a website that is usable by people with a wide range of abilities, devices, browsers, and assistive technologies.": "Miranda Law está trabajando para proporcionar un sitio web que sea utilizable por personas con una amplia gama de capacidades, dispositivos, navegadores y tecnologías de asistencia."
      "Our approach": "Nuestro enfoque"
      "The website is designed with semantic headings, keyboard-accessible controls, visible focus states, descriptive links, responsive layouts, and text alternatives for meaningful images. Accessibility will be included in ongoing content and quality reviews.": "El sitio web está diseñado con encabezados semánticos, controles accesibles mediante teclado, estados de enfoque visibles, enlaces descriptivos, diseños adaptables y alternativas de texto para imágenes significativas. La accesibilidad se incluirá en las revisiones continuas de contenido y calidad."
      "Need assistance?": "¿Necesita asistencia?"
      "If you have difficulty accessing content or completing a task, contact the office at 908-424-1011 or bmiranda@bmirandalaw.com. Please describe the page, feature, and assistance you need.": "Si tiene dificultades para acceder al contenido o completar una tarea, comuníquese con la oficina al 908-424-1011 o a bmiranda@bmirandalaw.com. Por favor, describa la página, la función y la asistencia que necesita."
      "Feedback": "Comentarios"
      "Accessibility is an ongoing process. Feedback about barriers helps the firm prioritize improvements as the website and its intake tools evolve.": "La accesibilidad es un proceso continuo. Los comentarios sobre las barreras ayudan a la firma a priorizar las mejoras a medida que el sitio web y sus herramientas de recepción evolucionan."
      "What we may ask": "Lo que podríamos preguntar"
      "Please do not include confidential or time-sensitive information until the firm confirms representation.": "Por favor, no incluya información confidencial o urgente hasta que la firma confirme la representación."
      "Page Not Found": "Página no encontrada"
      "The requested Miranda Law page could not be found.": "No se pudo encontrar la página solicitada de Miranda Law."
      "404": "404"
      "That page could not be found.": "No se pudo encontrar esa página."
      "The page may have moved, or the address may be incomplete.": "Es posible que la página se haya movido o que la dirección esté incompleta."
      "Return home": "Volver al inicio"
