      "A linen-bound planning book resting on layered papers and deep green folders": "Um livro de planejamento encadernado em linho repousando sobre papéis sobrepostos e pastas verde-escuro"
      "Tell us a little about yourself and what you’re looking to accomplish.": "Conte-nos um pouco sobre você e o que pretende alcançar."
