name: ci

on: push

env:
  NODE_VERSION: 24
  PNPM_VERSION: 11.24.0

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify static output
        run: pnpm generate && pnpm test:static

      - name: Verify Nitro deployment build
        run: pnpm build

      - name: Verify Vercel public output
        run: |
          NITRO_PRESET=vercel pnpm build
          test -f .vercel/output/functions/__fallback.func/index.mjs
          test -f .vercel/output/functions/__fallback.func/chunks/routes/api/intake.post.mjs
